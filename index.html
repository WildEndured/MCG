<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модульный Генератор Персонажей v7.0</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --accent-color: #e94560;
            --text-color: #fff;
            --secondary-bg: #0f3460;
            --module-header: #0d1b2a;
            --group-appearance: #e94560;
            --group-clothes: #4a90d9;
            --group-race: #d9a441;
            --group-mods: #7b68ee;
            --group-simple: #5cb85c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background-color: var(--container-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            height: fit-content;
        }

        /* Вкладки */
        .tabs { display: flex; background-color: #0d1b2a; }
        .tab-btn {
            flex: 1; padding: 15px; background: none; border: none;
            color: #888; font-size: 1rem; cursor: pointer; font-weight: bold;
            border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--text-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: var(--container-bg);
        }

        .tab-content { padding: 20px; display: none; }
        .tab-content.active { display: block; }

        /* Генератор */
        .result-box {
            background-color: var(--secondary-bg);
            padding: 20px; border-radius: 10px;
            margin-bottom: 20px;
            max-height: 500px; overflow-y: auto;
        }

        .result-line {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.95rem;
            gap: 15px;
        }
        .result-line:last-child { border-bottom: none; }
        .result-path { color: #888; font-weight: bold; font-size: 0.85rem; }
        .result-value { color: #fff; font-weight: bold; text-align: right; }

        .btn-main {
            background-color: var(--accent-color); color: white; border: none;
            padding: 15px 30px; font-size: 1rem; border-radius: 50px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
            width: 100%; margin-bottom: 10px; transition: 0.2s;
        }
        .btn-main:hover { background-color: #ff2e63; transform: scale(1.02); }

        .btn-secondary {
            background-color: var(--secondary-bg); color: white;
            border: 1px solid #555; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #1a4a7a; }

        /* Пресеты */
        .presets-bar {
            display: flex; gap: 8px; margin-bottom: 15px;
            flex-wrap: wrap; align-items: center;
        }
        .presets-bar span { font-size: 0.85rem; color: #888; }
        .preset-btn {
            padding: 6px 12px; font-size: 0.8rem;
            border-radius: 20px; cursor: pointer;
            background: var(--secondary-bg); color: white;
            border: 1px solid #555; transition: 0.2s;
        }
        .preset-btn:hover { background: var(--accent-color); border-color: var(--accent-color); }

        /* История */
        .history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input {
            flex-grow: 1; padding: 10px; border-radius: 5px;
            border: 1px solid #333; background-color: #0d1b2a; color: white;
        }

        .history-list {
            display: flex; flex-direction: column; gap: 10px;
            max-height: 500px; overflow-y: auto;
        }

        .history-item {
            background-color: #0d1b2a; padding: 15px;
            border-radius: 8px; border-left: 4px solid var(--secondary-bg);
        }
        .history-item.favorite { border-left-color: gold; }

        .history-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .history-date { font-size: 0.75rem; color: #888; }

        .history-details { font-size: 0.85rem; color: #ccc; line-height: 1.5; }

        .history-actions { display: flex; gap: 5px; }
        .icon-btn {
            background: none; border: none; cursor: pointer;
            font-size: 1.1rem; padding: 3px; opacity: 0.6;
            transition: 0.2s; color: white;
        }
        .icon-btn:hover { opacity: 1; transform: scale(1.1); }
        .icon-btn.fav-active { opacity: 1; color: gold; }

        /* РЕДАКТОР */
        .editor-toolbar {
            display: flex; gap: 10px; margin-bottom: 15px;
            flex-wrap: wrap; align-items: center;
        }

        .group-title {
            font-size: 1.1rem; font-weight: bold;
            padding: 12px 15px; margin-top: 15px;
            border-radius: 8px; color: white;
            cursor: pointer; user-select: none;
            display: flex; justify-content: space-between; align-items: center;
        }
        .group-appearance { background: linear-gradient(90deg, var(--group-appearance), transparent); }
        .group-clothes { background: linear-gradient(90deg, var(--group-clothes), transparent); }
        .group-race { background: linear-gradient(90deg, var(--group-race), transparent); }
        .group-mods { background: linear-gradient(90deg, var(--group-mods), transparent); }
        .group-simple { background: linear-gradient(90deg, var(--group-simple), transparent); }

        .group-title .toggle-icon { font-size: 0.9rem; opacity: 0.7; }
        .group-body { padding-left: 10px; }
        .group-body.collapsed { display: none; }

        /* Простой модуль (Расы, Стили, Модификаторы) */
        .simple-module {
            background-color: #0d1b2a;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
            border-left: 3px solid var(--group-simple);
        }
        .simple-module.disabled { opacity: 0.5; }

        .simple-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 10px 15px;
            background-color: var(--module-header); cursor: pointer;
            user-select: none;
        }
        .simple-header h4 { margin: 0; font-size: 0.95rem; }
        .simple-header .counter { font-size: 0.75rem; color: #888; }
        .simple-header .controls { display: flex; gap: 8px; align-items: center; }

        .simple-body { padding: 8px 12px 12px 12px; }
        .simple-body.collapsed { display: none; }

        /* Категория (Уровень 2) */
        .category {
            background-color: #0d1b2a;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
        }

        .category-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 10px 15px;
            background-color: var(--module-header); cursor: pointer;
            user-select: none;
        }

        .category-header h4 { margin: 0; font-size: 0.95rem; }
        .category-header .counter { font-size: 0.75rem; color: #888; }
        .category-header .controls { display: flex; gap: 8px; align-items: center; }

        .category-body { padding: 8px 12px 12px 12px; }
        .category-body.collapsed { display: none; }

        /* Подкатегория (Уровень 3) */
        .subcategory {
            background-color: #1a1a2e;
            border-radius: 6px;
            margin-top: 6px;
            overflow: hidden;
            border-left: 2px solid var(--secondary-bg);
        }
        .subcategory.disabled { opacity: 0.5; }
        .subcategory.off { border-left-color: #333; }

        .subcategory-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px 12px;
            cursor: pointer; user-select: none;
            font-size: 0.9rem;
        }
        .subcategory-header:hover { background-color: rgba(255,255,255,0.03); }

        .subcategory-header .sub-name { font-weight: bold; }
        .subcategory-header .sub-counter { font-size: 0.7rem; color: #888; margin-left: 8px; }
        .subcategory-header .sub-controls { display: flex; gap: 5px; align-items: center; }

        .subcategory-body {
            padding: 8px 12px 12px 12px;
            border-top: 1px solid #0d1b2a;
        }
        .subcategory-body.collapsed { display: none; }

        /* Список значений (Уровень 4) */
        .value-list {
            max-height: 180px; overflow-y: auto;
            margin-top: 8px;
        }

        .value-item {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 0; border-bottom: 1px solid #0d1b2a;
            font-size: 0.85rem;
        }
        .value-item.disabled { opacity: 0.4; text-decoration: line-through; }

        .value-item-text {
            flex-grow: 1; cursor: pointer; padding: 3px;
            border-radius: 3px;
        }
        .value-item-text:hover { background-color: rgba(255,255,255,0.1); }

        .value-item input[type="text"] {
            flex-grow: 1; padding: 4px 8px; border-radius: 4px;
            border: 1px solid var(--accent-color);
            background-color: #1a1a2e; color: white; font-size: 0.85rem;
        }

        .value-item input[type="checkbox"] {
            cursor: pointer; width: 15px; height: 15px;
            accent-color: var(--accent-color);
        }

        .add-value-row {
            display: flex; gap: 5px; margin-top: 8px;
        }
        .add-value-row input {
            flex-grow: 1; padding: 5px 8px; border-radius: 4px;
            border: 1px solid #333; background-color: #0d1b2a;
            color: white; font-size: 0.8rem;
        }
        .add-value-row button {
            padding: 5px 10px; background-color: var(--accent-color);
            color: white; border: none; border-radius: 4px;
            cursor: pointer; font-size: 0.8rem;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background-color: var(--container-bg); padding: 25px;
            border-radius: 12px; max-width: 550px; width: 100%;
            max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { margin-top: 0; }
        .modal textarea {
            width: 100%; height: 200px; padding: 10px;
            background-color: #0d1b2a; color: white;
            border: 1px solid #333; border-radius: 8px;
            font-family: inherit; font-size: 0.9rem; resize: vertical;
        }
        .modal-actions {
            display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); background-color: #333;
            color: white; padding: 10px 20px; border-radius: 20px;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generator')">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('history')">📜 История</button>
        <button class="tab-btn" onclick="switchTab('editor')">⚙️ Модули</button>
    </div>

    <!-- ГЕНЕРАТОР -->
    <div id="tab-generator" class="tab-content active">
        <div class="presets-bar">
            <span>Пресеты:</span>
            <button class="preset-btn" onclick="applyPreset('portrait')">👤 Портрет</button>
            <button class="preset-btn" onclick="applyPreset('full')">🧍 Полный рост</button>
            <button class="preset-btn" onclick="applyPreset('race')">🧬 Только раса</button>
            <button class="preset-btn" onclick="applyPreset('all')">✅ Все</button>
        </div>
        <div class="result-box" id="resultBox">
            <p style="text-align:center; color:#888;">Нажмите «Сгенерировать»</p>
        </div>
        <button class="btn-main" onclick="generateCharacter()">Сгенерировать!</button>
        <button class="btn-secondary" style="width:100%; margin-bottom:10px;" onclick="copyResult()">📋 Скопировать промпт</button>
        <button class="btn-secondary" style="width:100%;" onclick="copyResultShort()">📋 Скопировать кратко</button>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="tab-history" class="tab-content">
        <div class="history-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="exportHistoryCSV()">📊 CSV</button>
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- РЕДАКТОР МОДУЛЕЙ -->
    <div id="tab-editor" class="tab-content">
        <div class="editor-toolbar">
            <button class="btn-secondary" onclick="expandAll(true)">📖 Развернуть всё</button>
            <button class="btn-secondary" onclick="expandAll(false)">📕 Свернуть всё</button>
            <button class="btn-secondary" onclick="exportData()">💾 Скачать базу</button>
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Загрузить базу</button>
            <button class="btn-secondary" onclick="resetAllLists()">↺ Сброс</button>
            <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importData(event)">
        </div>
        <div id="editorContainer"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="editModalTitle">Редактирование</h3>
        <p style="color:#888; font-size:0.85rem;">Один элемент на строку (или через запятую).</p>
        <textarea id="editModalTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEditModal()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="saveEditModal()">Сохранить</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>

        race: [
            "simple.races",
            "raceTraits.traits.trait1", "raceTraits.traits.trait2", "raceTraits.traits.trait3",
            "raceTraits.traits.trait4", "raceTraits.traits.trait5", "raceTraits.traits.trait6", "raceTraits.traits.trait7"
        ]
    };

    let state = {
        data: null,
        history: [],
        currentResult: {},
        resultPaths: []
    };

    let editContext = null;

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    function init() {
        const saved = localStorage.getItem('cg_data_v7');
        const savedHistory = localStorage.getItem('cg_history_v7');

        if (saved) {
            try { state.data = JSON.parse(saved); }
            catch (e) { state.data = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
        } else {
            state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        state.history = savedHistory ? JSON.parse(savedHistory) : [];
        saveData();
        renderEditor();
        renderHistory();
    }

    function saveData() {
        localStorage.setItem('cg_data_v7', JSON.stringify(state.data));
        localStorage.setItem('cg_history_v7', JSON.stringify(state.history));
    }

    // ============================================================
    // НАВИГАЦИЯ
    // ============================================================

    function switchTab(name) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab-${name}`).classList.add('active');
        const btns = document.querySelectorAll('.tab-btn');
        if (name === 'generator') btns[0].classList.add('active');
        if (name === 'history') btns[1].classList.add('active');
        if (name === 'editor') btns[2].classList.add('active');

        if (name === 'history') renderHistory();
    }

    // ============================================================
    // ГЕНЕРАЦИЯ
    // ============================================================

    function getRandomActive(items) {
        const active = items.filter(i => i.enabled && i.text && !["Отсутствует", "Отсутствуют", "None"].includes(i.text));
        if (active.length === 0) return null;
        return active[Math.floor(Math.random() * active.length)].text;
    }

    function generateCharacter() {
        const result = {};
        const paths = [];

        // 1. Простые модули
        for (const key in state.data.simpleModules) {
            const mod = state.data.simpleModules[key];
            if (!mod.enabled) continue;
            const value = getRandomActive(mod.items);
            if (value) {
                const path = `simple.${key}`;
                result[path] = value;
                paths.push(path);
            }
        }

        // 2. Модули с категориями и подкатегориями
        const complexModules = ['appearance', 'clothes', 'raceTraits'];
        for (const moduleKey of complexModules) {
            const module = state.data[moduleKey];
            for (const catKey in module.categories) {
                const cat = module.categories[catKey];
                for (const subKey in cat.subcategories) {
                    const sub = cat.subcategories[subKey];
                    if (!sub.enabled) continue;
                    const value = getRandomActive(sub.items);
                    if (value) {
                        const path = `${moduleKey}.${catKey}.${subKey}`;
                        result[path] = value;
                        paths.push(path);
                    }
                }
            }
        }

        // 3. Применяем модификатор к случайной одежде
        if (state.data.simpleModules.modifiers && state.data.simpleModules.modifiers.enabled) {
            const modifier = getRandomActive(state.data.simpleModules.modifiers.items);
            const clothesSlots = ['clothes.topwear.type', 'clothes.bottomwear.type', 'clothes.legwear.type', 'clothes.footwear.type', 'clothes.headwear.type'];
            const availableSlots = clothesSlots.filter(s => result[s]);
            if (modifier && availableSlots.length > 0) {
                const target = availableSlots[Math.floor(Math.random() * availableSlots.length)];
                result[target] = `${modifier} ${result[target]}`;
            }
        }

        if (paths.length === 0) {
            showToast("Все модули отключены!");
            return;
        }

        state.currentResult = result;
        state.resultPaths = paths;
        renderResult(result, paths);
        addToHistory(result, paths);
    }

    function renderResult(result, paths) {
        const box = document.getElementById('resultBox');
        box.innerHTML = '';

        paths.forEach(path => {
            const name = getPathName(path);
            const line = document.createElement('div');
            line.className = 'result-line';
            line.innerHTML = `<span class="result-path">${name}</span><span class="result-value">${result[path]}</span>`;
            box.appendChild(line);
        });
    }

    function getPathName(path) {
        const parts = path.split('.');

        // Простой модуль
        if (parts[0] === 'simple') {
            return state.data.simpleModules[parts[1]].name;
        }

        // Сложный модуль
        const module = state.data[parts[0]];
        const cat = module.categories[parts[1]];
        const sub = cat.subcategories[parts[2]];
        return `${cat.name} → ${sub.name}`;
    }

    function addToHistory(result, paths) {
        const newItem = {
            id: Date.now(),
            result: JSON.parse(JSON.stringify(result)),
            paths: [...paths],
            date: new Date().toLocaleString('ru-RU'),
            favorite: false
        };
        state.history.unshift(newItem);
        if (state.history.length > 200) state.history.pop();
        saveData();
    }

    function formatPrompt(result, paths) {
        return paths.map(path => `${getPathName(path)}: ${result[path]}`).join('\n');
    }

    function formatPromptShort(result, paths) {
        return paths.map(path => result[path]).join(', ');
    }

    function copyResult() {
        navigator.clipboard.writeText(formatPrompt(state.currentResult, state.resultPaths)).then(() => showToast('Скопировано!'));
    }

    function copyResultShort() {
        navigator.clipboard.writeText(formatPromptShort(state.currentResult, state.resultPaths)).then(() => showToast('Скопировано!'));
    }

    // ============================================================
    // ПРЕСЕТЫ
    // ============================================================

    function applyPreset(name) {
        const preset = PRESETS[name];

        // Простые модули
        for (const key in state.data.simpleModules) {
            const mod = state.data.simpleModules[key];
            if (preset === null) mod.enabled = true;
            else mod.enabled = preset.includes(`simple.${key}`);
        }

        // Сложные модули
        const complexModules = ['appearance', 'clothes', 'raceTraits'];
        for (const moduleKey of complexModules) {
            const module = state.data[moduleKey];
            for (const catKey in module.categories) {
                const cat = module.categories[catKey];
                for (const subKey in cat.subcategories) {
                    const sub = cat.subcategories[subKey];
                    if (preset === null) sub.enabled = true;
                    else sub.enabled = preset.includes(`${moduleKey}.${catKey}.${subKey}`);
                }
            }
        }

        saveData();
        renderEditor();
        showToast(`Пресет "${name}"`);
    }

    // ============================================================
    // ИСТОРИЯ
    // ============================================================

    function renderHistory() {
        const list = document.getElementById('historyList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = state.history.filter(item => {
            const text = formatPromptShort(item.result, item.paths).toLowerCase();
            return text.includes(query);
        });

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#666;">История пуста.</p>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.favorite ? 'favorite' : ''}`;
            const details = formatPromptShort(item.result, item.paths);

            div.innerHTML = `
                <div class="history-header">
                    <span class="history-date">${item.date}</span>
                    <div class="history-actions">
                        <button class="icon-btn ${item.favorite ? 'fav-active' : ''}" onclick="toggleFavorite(${item.id})">${item.favorite ? '★' : '☆'}</button>
                        <button class="icon-btn" onclick="copyHistoryItem(${item.id})">📋</button>
                        <button class="icon-btn" onclick="deleteHistoryItem(${item.id})">❌</button>
                    </div>
                </div>
                <div class="history-details">${details}</div>
            `;
            list.appendChild(div);
        });
    }

    function toggleFavorite(id) {
        const item = state.history.find(i => i.id === id);
        if (item) { item.favorite = !item.favorite; saveData(); renderHistory(); }
    }

    function deleteHistoryItem(id) {
        state.history = state.history.filter(i => i.id !== id);
        saveData(); renderHistory();
    }

    function clearHistory() {
        if (confirm('Удалить всю историю?')) {
            state.history = []; saveData(); renderHistory();
        }
    }

    function copyHistoryItem(id) {
        const item = state.history.find(i => i.id === id);
        if (item) {
            navigator.clipboard.writeText(formatPrompt(item.result, item.paths));
            showToast('Скопировано!');
        }
    }

    function exportHistoryCSV() {
        if (state.history.length === 0) { showToast('История пуста'); return; }

        const allPaths = new Set();
        state.history.forEach(item => item.paths.forEach(p => allPaths.add(p)));
        const pathArray = Array.from(allPaths);

        const headers = ['Дата', 'Избранное', ...pathArray.map(p => getPathName(p))];
        const rows = state.history.map(item => {
            const row = [item.date, item.favorite ? 'Да' : 'Нет'];
            pathArray.forEach(p => row.push(item.result[p] || ''));
            return row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',');
        });

        const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
        downloadFile(csv, 'character_history.csv', 'text/csv');
        showToast('CSV скачан!');
    }

    // ============================================================
    // РЕДАКТОР
    // ============================================================

    function renderEditor() {
        const container = document.getElementById('editorContainer');
        container.innerHTML = '';

        // === БЛОК 1: ПРОСТЫЕ МОДУЛИ (Расы, Стили, Модификаторы) ===
        const simpleTitle = document.createElement('div');
        simpleTitle.className = 'group-title group-simple';
        simpleTitle.innerHTML = `<span>📋 Основные списки</span><span class="toggle-icon">${state.data._simpleExpanded !== false ? '▼' : '▶'}</span>`;
        simpleTitle.onclick = () => {
            state.data._simpleExpanded = state.data._simpleExpanded === false ? true : false;
            saveData(); renderEditor();
        };
        container.appendChild(simpleTitle);

        const simpleBody = document.createElement('div');
        simpleBody.className = `group-body ${state.data._simpleExpanded !== false ? '' : 'collapsed'}`;

        for (const key in state.data.simpleModules) {
            simpleBody.appendChild(createSimpleModule(key, state.data.simpleModules[key]));
        }
        container.appendChild(simpleBody);

        // === БЛОК 2: БАЗОВАЯ ВНЕШНОСТЬ ===
        container.appendChild(createComplexModule('appearance'));

        // === БЛОК 3: ОДЕЖДА ===
        container.appendChild(createComplexModule('clothes'));

        // === БЛОК 4: РАСОВЫЕ ЧЕРТЫ ===
        container.appendChild(createComplexModule('raceTraits'));
    }

    // --- Простой модуль (Расы, Стили) ---
    function createSimpleModule(key, mod) {
        const div = document.createElement('div');
        div.className = `simple-module ${mod.enabled ? '' : 'disabled'}`;

        const activeCount = mod.items.filter(i => i.enabled).length;

        div.innerHTML = `
            <div class="simple-header">
                <div>
                    <h4>${mod.name}</h4>
                    <span class="counter">Активно: ${activeCount} / ${mod.items.length}</span>
                </div>
                <div class="controls">
                    <label style="font-size:0.8rem; cursor:pointer;">
                        <input type="checkbox" ${mod.enabled ? 'checked' : ''} onchange="toggleSimpleEnabled('${key}')" style="accent-color: var(--accent-color);"> Вкл
                    </label>
                    <button class="icon-btn" onclick="event.stopPropagation(); openEditModalSimple('${key}')" title="Редактировать">✏️</button>
                    <span class="toggle-icon">${mod.expanded ? '▼' : '▶'}</span>
                </div>
            </div>
        `;

        const body = document.createElement('div');
        body.className = `simple-body ${mod.expanded ? '' : 'collapsed'}`;
        body.innerHTML = `
            <div class="value-list" id="simple-values-${key}"></div>
            <div class="add-value-row">
                <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addSimpleValue('${key}', this)">
                <button onclick="addSimpleValue('${key}', this.previousElementSibling)">+</button>
            </div>
        `;

        div.querySelector('.simple-header').onclick = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            mod.expanded = !mod.expanded;
            saveData(); renderEditor();
        };

        div.appendChild(body);
        setTimeout(() => renderSimpleValues(key), 0);
        return div;
    }

    function renderSimpleValues(key) {
        const container = document.getElementById(`simple-values-${key}`);
        if (!container) return;
        container.innerHTML = '';
        const mod = state.data.simpleModules[key];

        mod.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `value-item ${item.enabled ? '' : 'disabled'}`;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = item.enabled;
            checkbox.onchange = () => toggleSimpleValue(key, index);

            const textSpan = document.createElement('span');
            textSpan.className = 'value-item-text';
            textSpan.textContent = item.text;
            textSpan.onclick = () => startEditSimpleValue(key, index, textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn';
            delBtn.textContent = '❌';
            delBtn.onclick = () => removeSimpleValue(key, index);

            div.appendChild(checkbox);
            div.appendChild(textSpan);
            div.appendChild(delBtn);
            container.appendChild(div);
        });

        const header = container.closest('.simple-module').querySelector('.counter');
        const activeCount = mod.items.filter(i => i.enabled).length;
        header.textContent = `Активно: ${activeCount} / ${mod.items.length}`;
    }

    function toggleSimpleEnabled(key) {
        state.data.simpleModules[key].enabled = !state.data.simpleModules[key].enabled;
        saveData(); renderEditor();
    }

    function toggleSimpleValue(key, index) {
        state.data.simpleModules[key].items[index].enabled = !state.data.simpleModules[key].items[index].enabled;
        saveData(); renderSimpleValues(key);
    }

    function startEditSimpleValue(key, index, spanElement) {
        const mod = state.data.simpleModules[key];
        const currentText = mod.items[index].text;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentText;
        spanElement.replaceWith(input);
        input.focus();

        const finish = () => {
            const newText = input.value.trim();
            if (newText && newText !== currentText) {
                mod.items[index].text = newText;
                saveData();
            }
            renderSimpleValues(key);
        };
        input.onblur = finish;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') finish();
            if (e.key === 'Escape') renderSimpleValues(key);
        };
    }

    function addSimpleValue(key, inputElement) {
        const value = inputElement.value.trim();
        if (!value) return;
        const mod = state.data.simpleModules[key];
        if (mod.items.some(i => i.text.toLowerCase() === value.toLowerCase())) {
            showToast('Уже есть!'); return;
        }
        mod.items.push({ text: value, enabled: true });
        inputElement.value = '';
        saveData(); renderSimpleValues(key);
    }

    function removeSimpleValue(key, index) {
        state.data.simpleModules[key].items.splice(index, 1);
        saveData(); renderSimpleValues(key);
    }

    function openEditModalSimple(key) {
        editContext = { type: 'simple', key };
        const mod = state.data.simpleModules[key];
        document.getElementById('editModalTitle').textContent = `Редактирование: ${mod.name}`;
        document.getElementById('editModalTextarea').value = mod.items.map(i => i.text).join('\n');
        document.getElementById('editModal').classList.add('active');
    }

    // --- Сложный модуль (Внешность, Одежда, Расовые черты) ---
    function createComplexModule(moduleKey) {
        const module = state.data[moduleKey];
        const fragment = document.createDocumentFragment();

        const groupTitle = document.createElement('div');
        groupTitle.className = `group-title ${module.groupClass}`;
        groupTitle.innerHTML = `
            <span>${module.name}</span>
            <span class="toggle-icon">${module.expanded ? '▼' : '▶'}</span>
        `;
        groupTitle.onclick = () => {
            module.expanded = !module.expanded;
            saveData(); renderEditor();
        };
        fragment.appendChild(groupTitle);

        const groupBody = document.createElement('div');
        groupBody.className = `group-body ${module.expanded ? '' : 'collapsed'}`;

        for (const catKey in module.categories) {
            groupBody.appendChild(createCategoryElement(moduleKey, catKey, module.categories[catKey]));
        }

        fragment.appendChild(groupBody);
        return fragment;
    }

    function createCategoryElement(moduleKey, catKey, cat) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        const activeSubs = Object.values(cat.subcategories).filter(s => s.enabled).length;
        const totalSubs = Object.keys(cat.subcategories).length;

        catDiv.innerHTML = `
            <div class="category-header">
                <div>
                    <h4>${cat.name}</h4>
                    <span class="counter">Подкатегорий: ${activeSubs} / ${totalSubs}</span>
                </div>
                <div class="controls">
                    <span class="toggle-icon">${cat.expanded ? '▼' : '▶'}</span>
                </div>
            </div>
        `;

        const catBody = document.createElement('div');
        catBody.className = `category-body ${cat.expanded ? '' : 'collapsed'}`;

        catDiv.querySelector('.category-header').onclick = () => {
            cat.expanded = !cat.expanded;
            saveData(); renderEditor();
        };

        for (const subKey in cat.subcategories) {
            catBody.appendChild(createSubcategoryElement(moduleKey, catKey, subKey, cat.subcategories[subKey]));
        }

        catDiv.appendChild(catBody);
        return catDiv;
    }

    function createSubcategoryElement(moduleKey, catKey, subKey, sub) {
        const subDiv = document.createElement('div');
        subDiv.className = `subcategory ${sub.enabled ? '' : 'disabled off'}`;

        const activeItems = sub.items.filter(i => i.enabled).length;

        subDiv.innerHTML = `
            <div class="subcategory-header">
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" ${sub.enabled ? 'checked' : ''} style="accent-color: var(--accent-color); cursor:pointer;" onclick="event.stopPropagation(); toggleSubEnabled('${moduleKey}','${catKey}','${subKey}')">
                    <span class="sub-name">${sub.name}</span>
                    <span class="sub-counter">(${activeItems}/${sub.items.length})</span>
                </div>
                <div class="sub-controls">
                    <button class="icon-btn" onclick="event.stopPropagation(); openEditModalComplex('${moduleKey}','${catKey}','${subKey}')" title="Редактировать список">✏️</button>
                    <button class="icon-btn" onclick="event.stopPropagation(); removeSubcategory('${moduleKey}','${catKey}','${subKey}')" title="Удалить">🗑</button>
                    <span class="toggle-icon">${sub.expanded ? '▼' : '▶'}</span>
                </div>
            </div>
        `;

        const subBody = document.createElement('div');
        subBody.className = `subcategory-body ${sub.expanded ? '' : 'collapsed'}`;
        subBody.innerHTML = `
            <div class="value-list" id="values-${moduleKey}-${catKey}-${subKey}"></div>
            <div class="add-value-row">
                <input type="text" placeholder="Добавить значение..." onkeydown="if(event.key==='Enter') addComplexValue('${moduleKey}','${catKey}','${subKey}', this)">
                <button onclick="addComplexValue('${moduleKey}','${catKey}','${subKey}', this.previousElementSibling)">+</button>
            </div>
        `;

        subDiv.querySelector('.subcategory-header').onclick = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            sub.expanded = !sub.expanded;
            saveData(); renderEditor();
        };

        subDiv.appendChild(subBody);
        setTimeout(() => renderComplexValues(moduleKey, catKey, subKey), 0);
        return subDiv;
    }

    function renderComplexValues(moduleKey, catKey, subKey) {
        const container = document.getElementById(`values-${moduleKey}-${catKey}-${subKey}`);
        if (!container) return;
        container.innerHTML = '';

        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];

        sub.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `value-item ${item.enabled ? '' : 'disabled'}`;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = item.enabled;
            checkbox.onchange = () => toggleComplexValue(moduleKey, catKey, subKey, index);

            const textSpan = document.createElement('span');
            textSpan.className = 'value-item-text';
            textSpan.textContent = item.text;
            textSpan.onclick = () => startEditComplexValue(moduleKey, catKey, subKey, index, textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn';
            delBtn.textContent = '❌';
            delBtn.onclick = () => removeComplexValue(moduleKey, catKey, subKey, index);

            div.appendChild(checkbox);
            div.appendChild(textSpan);
            div.appendChild(delBtn);
            container.appendChild(div);
        });

        const header = container.closest('.subcategory').querySelector('.sub-counter');
        const activeItems = sub.items.filter(i => i.enabled).length;
        header.textContent = `(${activeItems}/${sub.items.length})`;
    }

    function toggleSubEnabled(moduleKey, catKey, subKey) {
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        sub.enabled = !sub.enabled;
        saveData(); renderEditor();
    }

    function toggleComplexValue(moduleKey, catKey, subKey, index) {
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        sub.items[index].enabled = !sub.items[index].enabled;
        saveData(); renderComplexValues(moduleKey, catKey, subKey);
    }

    function startEditComplexValue(moduleKey, catKey, subKey, index, spanElement) {
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        const currentText = sub.items[index].text;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentText;
        spanElement.replaceWith(input);
        input.focus();

        const finish = () => {
            const newText = input.value.trim();
            if (newText && newText !== currentText) {
                sub.items[index].text = newText;
                saveData();
            }
            renderComplexValues(moduleKey, catKey, subKey);
        };
        input.onblur = finish;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') finish();
            if (e.key === 'Escape') renderComplexValues(moduleKey, catKey, subKey);
        };
    }

    function addComplexValue(moduleKey, catKey, subKey, inputElement) {
        const value = inputElement.value.trim();
        if (!value) return;
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        if (sub.items.some(i => i.text.toLowerCase() === value.toLowerCase())) {
            showToast('Уже есть!'); return;
        }
        sub.items.push({ text: value, enabled: true });
        inputElement.value = '';
        saveData(); renderComplexValues(moduleKey, catKey, subKey);
    }

    function removeComplexValue(moduleKey, catKey, subKey, index) {
        state.data[moduleKey].categories[catKey].subcategories[subKey].items.splice(index, 1);
        saveData(); renderComplexValues(moduleKey, catKey, subKey);
    }

    function removeSubcategory(moduleKey, catKey, subKey) {
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        if (!confirm(`Удалить подкатегорию "${sub.name}"?`)) return;
        delete state.data[moduleKey].categories[catKey].subcategories[subKey];
        saveData(); renderEditor();
    }

    function openEditModalComplex(moduleKey, catKey, subKey) {
        editContext = { type: 'complex', moduleKey, catKey, subKey };
        const sub = state.data[moduleKey].categories[catKey].subcategories[subKey];
        document.getElementById('editModalTitle').textContent = `Редактирование: ${sub.name}`;
        document.getElementById('editModalTextarea').value = sub.items.map(i => i.text).join('\n');
        document.getElementById('editModal').classList.add('active');
    }

    // ============================================================
    // МОДАЛЬНОЕ ОКНО
    // ============================================================

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        editContext = null;
    }

    function saveEditModal() {
        if (!editContext) return;
        const text = document.getElementById('editModalTextarea').value;
        const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);

        if (editContext.type === 'simple') {
            const mod = state.data.simpleModules[editContext.key];
            const oldMap = {};
            mod.items.forEach(i => oldMap[i.text.toLowerCase()] = i.enabled);
            mod.items = lines.map(t => ({ text: t, enabled: oldMap[t.toLowerCase()] !== undefined ? oldMap[t.toLowerCase()] : true }));
            saveData(); renderEditor();
        } else {
            const sub = state.data[editContext.moduleKey].categories[editContext.catKey].subcategories[editContext.subKey];
            const oldMap = {};
            sub.items.forEach(i => oldMap[i.text.toLowerCase()] = i.enabled);
            sub.items = lines.map(t => ({ text: t, enabled: oldMap[t.toLowerCase()] !== undefined ? oldMap[t.toLowerCase()] : true }));
            saveData(); renderEditor();
        }

        closeEditModal();
        showToast(`Сохранено: ${lines.length}`);
    }

    // ============================================================
    // СВЕРНУТЬ/РАЗВЕРНУТЬ ВСЁ
    // ============================================================

    function expandAll(expand) {
        for (const key in state.data.simpleModules) {
            state.data.simpleModules[key].expanded = expand;
        }

        const complexModules = ['appearance', 'clothes', 'raceTraits'];
        for (const mKey of complexModules) {
            const module = state.data[mKey];
            module.expanded = expand;
            for (const cKey in module.categories) {
                const cat = module.categories[cKey];
                cat.expanded = expand;
                for (const sKey in cat.subcategories) {
                    cat.subcategories[sKey].expanded = expand;
                }
            }
        }
        state.data._simpleExpanded = expand;
        saveData(); renderEditor();
    }

    // ============================================================
    // ЭКСПОРТ/ИМПОРТ
    // ============================================================

    function exportData() {
        const backup = {
            version: 7,
            exported: new Date().toISOString(),
            data: state.data,
            history: state.history
        };
        downloadFile(JSON.stringify(backup, null, 2), `character_generator_backup_${Date.now()}.json`, 'application/json');
        showToast('База скачана!');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const backup = JSON.parse(e.target.result);
                if (!backup.data) throw new Error('Неверный формат');
                if (!confirm('Загрузить базу? Текущие данные будут заменены.')) return;
                state.data = backup.data;
                state.history = backup.history || [];
                saveData(); renderEditor(); renderHistory();
                showToast('База загружена!');
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function resetAllLists() {
        if (!confirm('Сбросить всё к стандартным?')) return;
        state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveData(); renderEditor();
        showToast('Сброшено');
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.onload = init;
</script>

</body>
</html>
