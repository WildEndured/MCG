<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Персонажей v3.0</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --accent-color: #e94560;
            --text-color: #fff;
            --secondary-bg: #0f3460;
            --disabled-color: #555;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--container-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            background-color: #0d1b2a;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--text-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: var(--container-bg);
        }

        .tab-btn:hover { color: var(--text-color); }

        /* Контент */
        .tab-content {
            padding: 20px;
            display: none;
        }

        .tab-content.active { display: block; }

        /* Генератор */
        .result-box {
            background-color: var(--secondary-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        .race-text { font-size: 1.2rem; color: #a8a8a8; margin-bottom: 5px; }
        .style-text { font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
        .plus { font-size: 1.5rem; color: var(--accent-color); margin: 5px 0; }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-main:hover { background-color: #ff2e63; transform: scale(1.02); }

        .btn-secondary {
            background-color: var(--secondary-bg);
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #1a4a7a; }

        /* История */
        .history-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #0d1b2a;
            color: white;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background-color: #0d1b2a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--secondary-bg);
            transition: 0.2s;
        }

        .history-item.favorite { border-left-color: gold; }

        .history-info { flex-grow: 1; }
        .history-text { font-size: 1rem; font-weight: bold; }
        .history-date { font-size: 0.75rem; color: #888; margin-top: 5px; }

        .history-actions { display: flex; gap: 5px; }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            opacity: 0.6;
            transition: 0.2s;
            color: white;
        }

        .icon-btn:hover { opacity: 1; transform: scale(1.1); }
        .icon-btn.fav-active { opacity: 1; color: gold; }

        /* Редактор списков */
        .editor-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .editor-toolbar button {
            padding: 8px 15px;
            font-size: 0.85rem;
        }

        .editor-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .editor-column {
            flex: 1;
            min-width: 300px;
            background-color: #0d1b2a;
            padding: 15px;
            border-radius: 10px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .editor-counter {
            font-size: 0.8rem;
            color: #888;
        }

        .editor-list {
            max-height: 350px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        .editor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a2e;
            gap: 10px;
        }

        .editor-item.disabled {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .editor-item-text {
            flex-grow: 1;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .editor-item-text:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .editor-item-text.editing {
            background-color: #1a1a2e;
            outline: 1px solid var(--accent-color);
        }

        .editor-item input[type="text"] {
            flex-grow: 1;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
            background-color: #1a1a2e;
            color: white;
            font-size: 0.9rem;
        }

        .editor-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
        }

        .editor-input-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .editor-input-group input {
            flex-grow: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #1a1a2e;
            color: white;
        }

        .editor-input-group button {
            padding: 8px 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generator')">Генератор</button>
        <button class="tab-btn" onclick="switchTab('history')">История</button>
        <button class="tab-btn" onclick="switchTab('editor')">Списки</button>
    </div>

    <!-- Вкладка 1: Генератор -->
    <div id="tab-generator" class="tab-content active">
        <div class="result-box">
            <div class="race-text" id="raceDisplay">Нажмите кнопку</div>
            <div class="plus">+</div>
            <div class="style-text" id="styleDisplay">...</div>
        </div>
        <button class="btn-main" onclick="generateCharacter()">Сгенерировать!</button>
        <button class="btn-secondary" style="width: 100%;" onclick="copyResult()">📋 Скопировать результат</button>
    </div>

    <!-- Вкладка 2: История -->
    <div id="tab-history" class="tab-content">
        <div class="history-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по истории..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- Вкладка 3: Редактор списков -->
    <div id="tab-editor" class="tab-content">
        
        <!-- Панель инструментов -->
        <div class="editor-toolbar">
            <button class="btn-secondary" onclick="sortLists()">🔤 Сортировать А-Я</button>
            <button class="btn-secondary" onclick="resetLists()">↺ Сбросить к стандартным</button>
            <span style="font-size:0.8rem; color:#888; margin-left:auto;">Клик по тексту — редактировать</span>
        </div>

        <div class="editor-section">
            <!-- Редактор Рас -->
            <div class="editor-column">
                <div class="editor-header">
                    <h3 style="margin:0;">Расы</h3>
                    <span class="editor-counter" id="raceCounter">Активно: 0 / 0</span>
                </div>
                <div class="editor-input-group">
                    <input type="text" id="newRace" placeholder="Новая раса..." onkeydown="if(event.key==='Enter') addItem('races')">
                    <button onclick="addItem('races')">+</button>
                </div>
                <div class="editor-list" id="raceList"></div>
            </div>
            <!-- Редактор Стилей -->
            <div class="editor-column">
                <div class="editor-header">
                    <h3 style="margin:0;">Стили</h3>
                    <span class="editor-counter" id="styleCounter">Активно: 0 / 0</span>
                </div>
                <div class="editor-input-group">
                    <input type="text" id="newStyle" placeholder="Новый стиль..." onkeydown="if(event.key==='Enter') addItem('styles')">
                    <button onclick="addItem('styles')">+</button>
                </div>
                <div class="editor-list" id="styleList"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">Скопировано!</div>

<script>
    // --- БАЗОВЫЕ ДАННЫЕ ---
    const DEFAULT_RACES = [
        "Angel girl", "Arapaima girl", "Bat girl", "Bird girl", "Chimera", "Crocodile girl", 
        "Crow girl", "Cat girl", "Cow girl", "Capybara girl", "Chicken girl", "Demon girl", 
        "Doll girl", "Dragon girl", "Deer girl", "Elf", "Fish girl", "Fox girl", "Gargoyle girl", 
        "Ghost girl", "Horse girl", "Insect girl", "Jackal girl", "Kitsune girl", "Mimic", 
        "Orca girl", "Program girl", "Panda girl", "Rat girl", "Rabbit girl", "Reptile girl", 
        "Snake girl", "Slime girl", "Serval girl", "Shark girl", "Succubus", "Sheep girl", 
        "Tiger girl", "Vampire girl", "Wolf girl", "Wyrm girl", "Zombie girl"
    ];

    const DEFAULT_STYLES = [
        "Ancient Egyptian", "Boho-chic", "Casual", "Gyaru", "Grunge", "Gothic Lolita", 
        "Jester", "Japanese clothes", "Jirai key", "Maid", "Nun", "Naval", "Punk", 
        "Prison", "Rags", "Sportswear", "Swimsuit", "Streetwear", "Techwear", 
        "Witch", "Winter clothes", "Y2K"
    ];

    // --- СОСТОЯНИЕ ---
    // Теперь элементы хранятся как объекты: { text: "Cat girl", enabled: true }
    let state = {
        races: [],
        styles: [],
        history: [],
        currentResult: { race: '', style: '' }
    };

    // --- ИНИЦИАЛИЗАЦИЯ ---
    function init() {
        const savedRaces = localStorage.getItem('cg_races_v3');
        const savedStyles = localStorage.getItem('cg_styles_v3');
        const savedHistory = localStorage.getItem('cg_history');

        if (savedRaces) {
            state.races = JSON.parse(savedRaces);
        } else {
            state.races = DEFAULT_RACES.map(text => ({ text, enabled: true }));
        }

        if (savedStyles) {
            state.styles = JSON.parse(savedStyles);
        } else {
            state.styles = DEFAULT_STYLES.map(text => ({ text, enabled: true }));
        }

        state.history = savedHistory ? JSON.parse(savedHistory) : [];

        // Защита от пустых списков
        if (state.races.length === 0) state.races = DEFAULT_RACES.map(text => ({ text, enabled: true }));
        if (state.styles.length === 0) state.styles = DEFAULT_STYLES.map(text => ({ text, enabled: true }));

        saveData();
        renderEditor();
        renderHistory();
        generateCharacter();
    }

    function saveData() {
        localStorage.setItem('cg_races_v3', JSON.stringify(state.races));
        localStorage.setItem('cg_styles_v3', JSON.stringify(state.styles));
        localStorage.setItem('cg_history', JSON.stringify(state.history));
    }

    // --- НАВИГАЦИЯ ---
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tabName}`).classList.add('active');
        const btns = document.querySelectorAll('.tab-btn');
        if(tabName === 'generator') btns[0].classList.add('active');
        if(tabName === 'history') btns[1].classList.add('active');
        if(tabName === 'editor') btns[2].classList.add('active');

        if (tabName === 'history') renderHistory();
    }

    // --- ГЕНЕРАЦИЯ ---
    // Теперь учитываем только enabled: true
    function getRandomItem(arr) {
        const activeItems = arr.filter(item => item.enabled);
        if (activeItems.length === 0) return { text: "???" }; // Заглушка, если все выключены
        return activeItems[Math.floor(Math.random() * activeItems.length)];
    }

    function generateCharacter() {
        const raceObj = getRandomItem(state.races);
        const styleObj = getRandomItem(state.styles);
        
        const race = raceObj.text;
        const style = styleObj.text;

        if (race === "???" || style === "???") {
            showToast("Ошибка: Все элементы отключены!");
            return;
        }

        state.currentResult = { race, style };

        const raceEl = document.getElementById('raceDisplay');
        const styleEl = document.getElementById('styleDisplay');
        raceEl.style.opacity = 0;
        styleEl.style.opacity = 0;

        setTimeout(() => {
            raceEl.textContent = race;
            styleEl.textContent = style;
            raceEl.style.opacity = 1;
            styleEl.style.opacity = 1;
        }, 150);

        addToHistory(race, style);
    }

    function addToHistory(race, style) {
        const newItem = {
            id: Date.now(),
            race: race,
            style: style,
            date: new Date().toLocaleString('ru-RU'),
            favorite: false
        };
        state.history.unshift(newItem);
        if (state.history.length > 100) state.history.pop();
        saveData();
    }

    function copyResult() {
        const text = `${state.currentResult.race} + ${state.currentResult.style}`;
        navigator.clipboard.writeText(text).then(() => showToast('Скопировано!'));
    }

    // --- ИСТОРИЯ ---
    function renderHistory() {
        const list = document.getElementById('historyList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = state.history.filter(item => 
            item.race.toLowerCase().includes(query) || 
            item.style.toLowerCase().includes(query)
        );

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#666;">История пуста или ничего не найдено.</p>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.favorite ? 'favorite' : ''}`;
            div.innerHTML = `
                <div class="history-info">
                    <div class="history-text">${item.race} + ${item.style}</div>
                    <div class="history-date">${item.date}</div>
                </div>
                <div class="history-actions">
                    <button class="icon-btn ${item.favorite ? 'fav-active' : ''}" onclick="toggleFavorite(${item.id})">${item.favorite ? '★' : '☆'}</button>
                    <button class="icon-btn" onclick="copyHistoryItem(${item.id})">📋</button>
                    <button class="icon-btn" onclick="deleteHistoryItem(${item.id})">❌</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function toggleFavorite(id) {
        const item = state.history.find(i => i.id === id);
        if (item) { item.favorite = !item.favorite; saveData(); renderHistory(); }
    }

    function deleteHistoryItem(id) {
        state.history = state.history.filter(i => i.id !== id);
        saveData(); renderHistory();
    }

    function clearHistory() {
        if (confirm('Удалить всю историю?')) {
            state.history = []; saveData(); renderHistory();
        }
    }

    function copyHistoryItem(id) {
        const item = state.history.find(i => i.id === id);
        if (item) { navigator.clipboard.writeText(`${item.race} + ${item.style}`); showToast('Скопировано!'); }
    }

    // --- РЕДАКТОР СПИСКОВ (ОБНОВЛЕНО) ---
    function renderEditor() {
        renderList('races', 'raceList');
        renderList('styles', 'styleList');
        updateCounters();
    }

    function updateCounters() {
        const activeRaces = state.races.filter(i => i.enabled).length;
        const totalRaces = state.races.length;
        const activeStyles = state.styles.filter(i => i.enabled).length;
        const totalStyles = state.styles.length;

        document.getElementById('raceCounter').textContent = `Активно: ${activeRaces} / ${totalRaces}`;
        document.getElementById('styleCounter').textContent = `Активно: ${activeStyles} / ${totalStyles}`;
    }

    function renderList(type, elementId) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        
        state[type].forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `editor-item ${item.enabled ? '' : 'disabled'}`;
            
            // Чекбокс (включение/отключение)
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = item.enabled;
            checkbox.onchange = () => toggleItem(type, index);
            
            // Текст (с возможностью редактирования)
            const textSpan = document.createElement('span');
            textSpan.className = 'editor-item-text';
            textSpan.textContent = item.text;
            textSpan.onclick = () => startEdit(type, index, textSpan);
            
            // Кнопка удаления
            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn';
            delBtn.textContent = '❌';
            delBtn.onclick = () => removeItem(type, index);

            div.appendChild(checkbox);
            div.appendChild(textSpan);
            div.appendChild(delBtn);
            container.appendChild(div);
        });
    }

    // Включение/Отключение
    function toggleItem(type, index) {
        state[type][index].enabled = !state[type][index].enabled;
        saveData();
        renderEditor(); // Перерисовываем, чтобы обновить зачеркивание
    }

    // Редактирование (Inline)
    function startEdit(type, index, spanElement) {
        const currentText = state[type][index].text;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentText;
        
        // Заменяем span на input
        spanElement.replaceWith(input);
        input.focus();

        const finishEdit = () => {
            const newText = input.value.trim();
            if (newText && newText !== currentText) {
                state[type][index].text = newText;
                saveData();
            }
            renderEditor(); // Перерисовываем список
        };

        input.onblur = finishEdit;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') finishEdit();
            if (e.key === 'Escape') renderEditor(); // Отмена
        };
    }

    function addItem(type) {
        const inputId = type === 'races' ? 'newRace' : 'newStyle';
        const input = document.getElementById(inputId);
        const value = input.value.trim();

        if (value) {
            // Проверка на дубликат (без учета регистра)
            const exists = state[type].some(item => item.text.toLowerCase() === value.toLowerCase());
            if (exists) {
                showToast('Такой элемент уже есть!');
                return;
            }
            state[type].push({ text: value, enabled: true });
            input.value = '';
            saveData();
            renderEditor();
        }
    }

    function removeItem(type, index) {
        state[type].splice(index, 1);
        saveData();
        renderEditor();
    }

    // Сортировка списков
    function sortLists() {
        state.races.sort((a, b) => a.text.localeCompare(b.text));
        state.styles.sort((a, b) => a.text.localeCompare(b.text));
        saveData();
        renderEditor();
        showToast('Списки отсортированы');
    }

    // Сброс к стандартным
    function resetLists() {
        if (confirm('Сбросить списки к стандартным? Ваши изменения будут потеряны.')) {
            state.races = DEFAULT_RACES.map(text => ({ text, enabled: true }));
            state.styles = DEFAULT_STYLES.map(text => ({ text, enabled: true }));
            saveData();
            renderEditor();
            showToast('Списки сброшены');
        }
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ---
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.onload = init;
</script>

</body>
</html>
