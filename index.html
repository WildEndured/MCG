<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модульный Генератор Персонажей v6.0</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --accent-color: #e94560;
            --text-color: #fff;
            --secondary-bg: #0f3460;
            --module-header: #0d1b2a;
            --group-appearance: #e94560;
            --group-clothes: #4a90d9;
            --group-race: #d9a441;
            --group-mods: #7b68ee;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background-color: var(--container-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            height: fit-content;
        }

        /* Вкладки */
        .tabs { display: flex; background-color: #0d1b2a; }
        .tab-btn {
            flex: 1; padding: 15px; background: none; border: none;
            color: #888; font-size: 1rem; cursor: pointer; font-weight: bold;
            border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--text-color);
            border-bottom: 3px solid var(--accent-color);
            background-color: var(--container-bg);
        }

        .tab-content { padding: 20px; display: none; }
        .tab-content.active { display: block; }

        /* Генератор */
        .result-box {
            background-color: var(--secondary-bg);
            padding: 20px; border-radius: 10px;
            margin-bottom: 20px;
            max-height: 500px; overflow-y: auto;
        }

        .result-line {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.95rem;
            gap: 15px;
        }
        .result-line:last-child { border-bottom: none; }
        .result-path { color: #888; font-weight: bold; font-size: 0.85rem; }
        .result-value { color: #fff; font-weight: bold; text-align: right; }

        .btn-main {
            background-color: var(--accent-color); color: white; border: none;
            padding: 15px 30px; font-size: 1rem; border-radius: 50px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
            width: 100%; margin-bottom: 10px; transition: 0.2s;
        }
        .btn-main:hover { background-color: #ff2e63; transform: scale(1.02); }

        .btn-secondary {
            background-color: var(--secondary-bg); color: white;
            border: 1px solid #555; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #1a4a7a; }

        /* Пресеты */
        .presets-bar {
            display: flex; gap: 8px; margin-bottom: 15px;
            flex-wrap: wrap; align-items: center;
        }
        .presets-bar span { font-size: 0.85rem; color: #888; }
        .preset-btn {
            padding: 6px 12px; font-size: 0.8rem;
            border-radius: 20px; cursor: pointer;
            background: var(--secondary-bg); color: white;
            border: 1px solid #555; transition: 0.2s;
        }
        .preset-btn:hover { background: var(--accent-color); border-color: var(--accent-color); }

        /* История */
        .history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .search-input {
            flex-grow: 1; padding: 10px; border-radius: 5px;
            border: 1px solid #333; background-color: #0d1b2a; color: white;
        }

        .history-list {
            display: flex; flex-direction: column; gap: 10px;
            max-height: 500px; overflow-y: auto;
        }

        .history-item {
            background-color: #0d1b2a; padding: 15px;
            border-radius: 8px; border-left: 4px solid var(--secondary-bg);
        }
        .history-item.favorite { border-left-color: gold; }

        .history-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .history-date { font-size: 0.75rem; color: #888; }

        .history-details { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
        .history-details b { color: #888; font-weight: normal; }

        .history-actions { display: flex; gap: 5px; }
        .icon-btn {
            background: none; border: none; cursor: pointer;
            font-size: 1.1rem; padding: 3px; opacity: 0.6;
            transition: 0.2s; color: white;
        }
        .icon-btn:hover { opacity: 1; transform: scale(1.1); }
        .icon-btn.fav-active { opacity: 1; color: gold; }

        /* РЕДАКТОР - ТРЁХУРОВНЕВАЯ ИЕРАРХИЯ */
        .editor-toolbar {
            display: flex; gap: 10px; margin-bottom: 15px;
            flex-wrap: wrap; align-items: center;
        }

        .group-title {
            font-size: 1.1rem; font-weight: bold;
            padding: 12px 15px; margin-top: 15px;
            border-radius: 8px; color: white;
            cursor: pointer; user-select: none;
            display: flex; justify-content: space-between; align-items: center;
        }
        .group-appearance { background: linear-gradient(90deg, var(--group-appearance), transparent); }
        .group-clothes { background: linear-gradient(90deg, var(--group-clothes), transparent); }
        .group-race { background: linear-gradient(90deg, var(--group-race), transparent); }
        .group-mods { background: linear-gradient(90deg, var(--group-mods), transparent); }

        .group-title .toggle-icon { font-size: 0.9rem; opacity: 0.7; }
        .group-body { padding-left: 10px; }
        .group-body.collapsed { display: none; }

        /* Категория (Уровень 2) */
        .category {
            background-color: #0d1b2a;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
        }

        .category-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 10px 15px;
            background-color: var(--module-header); cursor: pointer;
            user-select: none;
        }

        .category-header h4 { margin: 0; font-size: 0.95rem; }
        .category-header .counter { font-size: 0.75rem; color: #888; }
        .category-header .controls { display: flex; gap: 8px; align-items: center; }

        .category-body { padding: 8px 12px 12px 12px; }
        .category-body.collapsed { display: none; }

        /* Подкатегория (Уровень 3) */
        .subcategory {
            background-color: #1a1a2e;
            border-radius: 6px;
            margin-top: 6px;
            overflow: hidden;
            border-left: 2px solid var(--secondary-bg);
        }
        .subcategory.disabled { opacity: 0.5; }
        .subcategory.off { border-left-color: #333; }

        .subcategory-header {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px 12px;
            cursor: pointer; user-select: none;
            font-size: 0.9rem;
        }
        .subcategory-header:hover { background-color: rgba(255,255,255,0.03); }

        .subcategory-header .sub-name { font-weight: bold; }
        .subcategory-header .sub-counter { font-size: 0.7rem; color: #888; margin-left: 8px; }
        .subcategory-header .sub-controls { display: flex; gap: 5px; align-items: center; }

        .subcategory-body {
            padding: 8px 12px 12px 12px;
            border-top: 1px solid #0d1b2a;
        }
        .subcategory-body.collapsed { display: none; }

        /* Список значений (Уровень 4) */
        .value-list {
            max-height: 180px; overflow-y: auto;
            margin-top: 8px;
        }

        .value-item {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 0; border-bottom: 1px solid #0d1b2a;
            font-size: 0.85rem;
        }
        .value-item.disabled { opacity: 0.4; text-decoration: line-through; }

        .value-item-text {
            flex-grow: 1; cursor: pointer; padding: 3px;
            border-radius: 3px;
        }
        .value-item-text:hover { background-color: rgba(255,255,255,0.1); }

        .value-item input[type="text"] {
            flex-grow: 1; padding: 4px 8px; border-radius: 4px;
            border: 1px solid var(--accent-color);
            background-color: #1a1a2e; color: white; font-size: 0.85rem;
        }

        .value-item input[type="checkbox"] {
            cursor: pointer; width: 15px; height: 15px;
            accent-color: var(--accent-color);
        }

        .add-value-row {
            display: flex; gap: 5px; margin-top: 8px;
        }
        .add-value-row input {
            flex-grow: 1; padding: 5px 8px; border-radius: 4px;
            border: 1px solid #333; background-color: #0d1b2a;
            color: white; font-size: 0.8rem;
        }
        .add-value-row button {
            padding: 5px 10px; background-color: var(--accent-color);
            color: white; border: none; border-radius: 4px;
            cursor: pointer; font-size: 0.8rem;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background-color: var(--container-bg); padding: 25px;
            border-radius: 12px; max-width: 550px; width: 100%;
            max-height: 85vh; overflow-y: auto;
        }
        .modal h3 { margin-top: 0; }
        .modal textarea {
            width: 100%; height: 200px; padding: 10px;
            background-color: #0d1b2a; color: white;
            border: 1px solid #333; border-radius: 8px;
            font-family: inherit; font-size: 0.9rem; resize: vertical;
        }
        .modal-actions {
            display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); background-color: #333;
            color: white; padding: 10px 20px; border-radius: 20px;
            opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generator')">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('history')">📜 История</button>
        <button class="tab-btn" onclick="switchTab('editor')">⚙️ Модули</button>
    </div>

    <!-- ГЕНЕРАТОР -->
    <div id="tab-generator" class="tab-content active">
        <div class="presets-bar">
            <span>Пресеты:</span>
            <button class="preset-btn" onclick="applyPreset('portrait')">👤 Портрет</button>
            <button class="preset-btn" onclick="applyPreset('full')">🧍 Полный рост</button>
            <button class="preset-btn" onclick="applyPreset('race')">🧬 Только раса</button>
            <button class="preset-btn" onclick="applyPreset('all')">✅ Все</button>
        </div>
        <div class="result-box" id="resultBox">
            <p style="text-align:center; color:#888;">Нажмите «Сгенерировать»</p>
        </div>
        <button class="btn-main" onclick="generateCharacter()">Сгенерировать!</button>
        <button class="btn-secondary" style="width:100%; margin-bottom:10px;" onclick="copyResult()">📋 Скопировать промпт</button>
        <button class="btn-secondary" style="width:100%;" onclick="copyResultShort()">📋 Скопировать кратко</button>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="tab-history" class="tab-content">
        <div class="history-controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="exportHistoryCSV()">📊 CSV</button>
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- РЕДАКТОР МОДУЛЕЙ -->
    <div id="tab-editor" class="tab-content">
        <div class="editor-toolbar">
            <button class="btn-secondary" onclick="expandAll(true)">📖 Развернуть всё</button>
            <button class="btn-secondary" onclick="expandAll(false)">📕 Свернуть всё</button>
            <button class="btn-secondary" onclick="exportData()">💾 Скачать базу</button>
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Загрузить базу</button>
            <button class="btn-secondary" onclick="resetAllLists()">↺ Сброс</button>
            <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importData(event)">
        </div>
        <div id="editorContainer"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ СПИСКА -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="editModalTitle">Редактирование</h3>
        <p style="color:#888; font-size:0.85rem;">Один элемент на строку (или через запятую).</p>
        <textarea id="editModalTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEditModal()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="saveEditModal()">Сохранить</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ============================================================
    // ДЕФОЛТНАЯ СТРУКТУРА (трёхуровневая)
    // ============================================================

    const DEFAULT_DATA = {
        appearance: {
            name: "🎨 Базовая внешность",
            groupClass: "group-appearance",
            expanded: true,
            categories: {
                hair: {
                    name: "Волосы",
                    expanded: true,
                    subcategories: {
                        bangs:      { name: "Bangs",           enabled: true, expanded: false, items: ["Прямая", "Косая", "Рваная", "Отсутствует"] },
                        sidelocks:  { name: "Sidelocks",       enabled: true, expanded: false, items: ["Короткие", "Длинные", "Отсутствуют"] },
                        backHair:   { name: "Back hair",       enabled: true, expanded: false, items: ["Хвост", "Косички", "Распущенные", "Отсутствуют"] },
                        additional: { name: "Additional hair", enabled: true, expanded: false, items: ["Ахоге", "Пучок", "Отсутствует"] }
                    }
                },
                eyes: {
                    name: "Глаза",
                    expanded: true,
                    subcategories: {
                        eyeShape: { name: "Форма глаз", enabled: true, expanded: false, items: ["Большие", "Узкие", "Круглые", "Закрытые"] }
                    }
                },
                torso: {
                    name: "Торс",
                    expanded: true,
                    subcategories: {
                        breastSize: { name: "Размер груди", enabled: true, expanded: false, items: ["Плоская", "Средняя", "Большая", "Очень большая"] },
                        skinColor:  { name: "Цвет кожи",    enabled: true, expanded: false, items: ["Бледная", "Загорелая", "Тёмная", "Оливковая"] }
                    }
                }
            }
        },
        clothes: {
            name: "👗 Одежда",
            groupClass: "group-clothes",
            expanded: true,
            categories: {
                style:      { name: "Стиль", expanded: true, subcategories: { styleType: { name: "Тип стиля", enabled: true, expanded: false, items: ["Casual", "Streetwear", "Gothic Lolita", "Punk", "Techwear", "Y2K"] } } },
                headwear:   { name: "Headwear", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Шляпа", "Капюшон", "Ободок", "Шапка", "Отсутствует"] } } },
                neckwear:   { name: "Neckwear", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Чокер", "Шарф", "Ожерелье", "Отсутствует"] } } },
                topwear:    { name: "Topwear",  expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Футболка", "Худи", "Кроп-топ", "Куртка", "Свитер", "Отсутствует"] } } },
                bottomwear: { name: "Bottomwear", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Юбка", "Джинсы", "Шорты", "Карго", "Отсутствует"] } } },
                legwear:    { name: "Legwear",  expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Чулки", "Носки", "Колготки", "Отсутствует"] } } },
                footwear:   { name: "Footwear", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Кроссовки", "Ботинки", "Каблуки", "Сандалии", "Отсутствует"] } } },
                acc1:       { name: "Accessory 1", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Серьги", "Очки", "Браслет", "Отсутствует"] } } },
                acc2:       { name: "Accessory 2", expanded: true, subcategories: { type: { name: "Тип", enabled: true, expanded: false, items: ["Сумка", "Зонт", "Оружие", "Отсутствует"] } } }
            }
        },
        race: {
            name: "🧬 Раса",
            groupClass: "group-race",
            expanded: true,
            categories: {
                raceBase: {
                    name: "Раса",
                    expanded: true,
                    subcategories: {
                        type: { name: "Тип расы", enabled: true, expanded: false, items: ["Cat girl", "Elf", "Demon girl", "Dragon girl", "Vampire girl", "Slime girl", "Zombie girl"] }
                    }
                },
                traits: {
                    name: "Расовые черты",
                    expanded: true,
                    subcategories: {
                        trait1: { name: "Черта 1", enabled: true, expanded: false, items: ["Animal ears", "Horns", "Tail", "Wings", "Halos"] },
                        trait2: { name: "Черта 2", enabled: true, expanded: false, items: ["Fangs", "Claws", "Glowing eyes", "Scales", "Отсутствует"] },
                        trait3: { name: "Черта 3", enabled: true, expanded: false, items: ["Magic aura", "Tattoos", "Freckles", "Scars", "Отсутствует"] },
                        trait4: { name: "Черта 4", enabled: true, expanded: false, items: ["Отсутствует"] },
                        trait5: { name: "Черта 5", enabled: true, expanded: false, items: ["Отсутствует"] },
                        trait6: { name: "Черта 6", enabled: true, expanded: false, items: ["Отсутствует"] },
                        trait7: { name: "Черта 7", enabled: true, expanded: false, items: ["Отсутствует"] }
                    }
                }
            }
        }
    };

    // Пресеты — какие ПОДКАТЕГОРИИ включаются (по полному пути group.category.sub)
    const PRESETS = {
        all: null,
        portrait: ["appearance.hair.*", "appearance.eyes.*", "appearance.torso.*", "race.raceBase.*", "race.traits.*", "clothes.acc1.*"],
        full: ["appearance.*", "clothes.*", "race.*"],
        race: ["race.*"]
    };

    let state = {
        data: {},
        history: [],
        currentResult: {},
        resultPaths: [] // порядок ключей для промпта
    };

    let editContext = null; // { groupKey, catKey, subKey }

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    function init() {
        const saved = localStorage.getItem('cg_data_v6');
        const savedHistory = localStorage.getItem('cg_history_v6');

        if (saved) {
            try {
                state.data = JSON.parse(saved);
            } catch (e) {
                state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        } else {
            state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        }

        state.history = savedHistory ? JSON.parse(savedHistory) : [];
        saveData();
        renderEditor();
        renderHistory();
    }

    function saveData() {
        localStorage.setItem('cg_data_v6', JSON.stringify(state.data));
        localStorage.setItem('cg_history_v6', JSON.stringify(state.history));
    }

    // ============================================================
    // НАВИГАЦИЯ
    // ============================================================

    function switchTab(name) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab-${name}`).classList.add('active');
        const btns = document.querySelectorAll('.tab-btn');
        if (name === 'generator') btns[0].classList.add('active');
        if (name === 'history') btns[1].classList.add('active');
        if (name === 'editor') btns[2].classList.add('active');

        if (name === 'history') renderHistory();
    }

    // ============================================================
    // ГЕНЕРАЦИЯ
    // ============================================================

    function getRandomActive(items) {
        const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "Отсутствуют" && i.text !== "None");
        if (active.length === 0) return null;
        return active[Math.floor(Math.random() * active.length)].text;
    }

    function generateCharacter() {
        const result = {};
        const paths = [];

        // Проходим по всем группам → категориям → подкатегориям
        for (const groupKey in state.data) {
            const group = state.data[groupKey];
            for (const catKey in group.categories) {
                const cat = group.categories[catKey];
                for (const subKey in cat.subcategories) {
                    const sub = cat.subcategories[subKey];
                    if (!sub.enabled) continue;
                    const value = getRandomActive(sub.items);
                    if (value) {
                        const path = `${groupKey}.${catKey}.${subKey}`;
                        result[path] = value;
                        paths.push(path);
                    }
                }
            }
        }

        if (paths.length === 0) {
            showToast("Все модули отключены!");
            return;
        }

        state.currentResult = result;
        state.resultPaths = paths;
        renderResult(result, paths);
        addToHistory(result, paths);
    }

    function renderResult(result, paths) {
        const box = document.getElementById('resultBox');
        box.innerHTML = '';

        paths.forEach(path => {
            const { group, cat, sub } = pathToNames(path);
            const line = document.createElement('div');
            line.className = 'result-line';
            line.innerHTML = `<span class="result-path">${group} → ${cat} → ${sub}</span><span class="result-value">${result[path]}</span>`;
            box.appendChild(line);
        });
    }

    function pathToNames(path) {
        const [g, c, s] = path.split('.');
        const group = state.data[g];
        const cat = group.categories[c];
        const sub = cat.subcategories[s];
        return { group: group.name, cat: cat.name, sub: sub.name };
    }

    function addToHistory(result, paths) {
        const newItem = {
            id: Date.now(),
            result: JSON.parse(JSON.stringify(result)),
            paths: [...paths],
            date: new Date().toLocaleString('ru-RU'),
            favorite: false
        };
        state.history.unshift(newItem);
        if (state.history.length > 200) state.history.pop();
        saveData();
    }

    function formatPrompt(result, paths) {
        return paths.map(path => {
            const { group, cat, sub } = pathToNames(path);
            return `${group} / ${cat} / ${sub}: ${result[path]}`;
        }).join('\n');
    }

    function formatPromptShort(result, paths) {
        return paths.map(path => result[path]).join(', ');
    }

    function copyResult() {
        const text = formatPrompt(state.currentResult, state.resultPaths);
        navigator.clipboard.writeText(text).then(() => showToast('Промпт скопирован!'));
    }

    function copyResultShort() {
        const text = formatPromptShort(state.currentResult, state.resultPaths);
        navigator.clipboard.writeText(text).then(() => showToast('Кратко скопировано!'));
    }

    // ============================================================
    // ПРЕСЕТЫ
    // ============================================================

    function applyPreset(name) {
        const preset = PRESETS[name];

        for (const gKey in state.data) {
            const group = state.data[gKey];
            for (const cKey in group.categories) {
                const cat = group.categories[cKey];
                for (const sKey in cat.subcategories) {
                    const sub = cat.subcategories[sKey];
                    if (preset === null) {
                        sub.enabled = true;
                    } else {
                        // Проверяем все паттерны
                        sub.enabled = preset.some(pattern => matchPattern(pattern, gKey, cKey, sKey));
                    }
                }
            }
        }

        saveData();
        renderEditor();
        showToast(`Пресет "${name}" применён`);
    }

    function matchPattern(pattern, g, c, s) {
        const parts = pattern.split('.');
        if (parts[0] !== '*' && parts[0] !== g) return false;
        if (parts[1] !== '*' && parts[1] !== c) return false;
        if (parts[2] !== '*' && parts[2] !== s) return false;
        return true;
    }

    // ============================================================
    // ИСТОРИЯ
    // ============================================================

    function renderHistory() {
        const list = document.getElementById('historyList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = state.history.filter(item => {
            const text = formatPromptShort(item.result, item.paths).toLowerCase();
            return text.includes(query);
        });

        if (filtered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#666;">История пуста.</p>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.favorite ? 'favorite' : ''}`;
            const details = formatPromptShort(item.result, item.paths);

            div.innerHTML = `
                <div class="history-header">
                    <span class="history-date">${item.date}</span>
                    <div class="history-actions">
                        <button class="icon-btn ${item.favorite ? 'fav-active' : ''}" onclick="toggleFavorite(${item.id})">${item.favorite ? '★' : '☆'}</button>
                        <button class="icon-btn" onclick="copyHistoryItem(${item.id})">📋</button>
                        <button class="icon-btn" onclick="deleteHistoryItem(${item.id})">❌</button>
                    </div>
                </div>
                <div class="history-details">${details}</div>
            `;
            list.appendChild(div);
        });
    }

    function toggleFavorite(id) {
        const item = state.history.find(i => i.id === id);
        if (item) { item.favorite = !item.favorite; saveData(); renderHistory(); }
    }

    function deleteHistoryItem(id) {
        state.history = state.history.filter(i => i.id !== id);
        saveData(); renderHistory();
    }

    function clearHistory() {
        if (confirm('Удалить всю историю?')) {
            state.history = []; saveData(); renderHistory();
        }
    }

    function copyHistoryItem(id) {
        const item = state.history.find(i => i.id === id);
        if (item) {
            navigator.clipboard.writeText(formatPrompt(item.result, item.paths));
            showToast('Скопировано!');
        }
    }

    function exportHistoryCSV() {
        if (state.history.length === 0) { showToast('История пуста'); return; }

        // Собираем все уникальные пути
        const allPaths = new Set();
        state.history.forEach(item => item.paths.forEach(p => allPaths.add(p)));
        const pathArray = Array.from(allPaths);

        const headers = ['Дата', 'Избранное', ...pathArray.map(p => {
            const { group, cat, sub } = pathToNames(p);
            return `${group}/${cat}/${sub}`;
        })];

        const rows = state.history.map(item => {
            const row = [item.date, item.favorite ? 'Да' : 'Нет'];
            pathArray.forEach(p => row.push(item.result[p] || ''));
            return row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',');
        });

        const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
        downloadFile(csv, 'character_history.csv', 'text/csv');
        showToast('CSV скачан!');
    }

    // ============================================================
    // РЕДАКТОР (ТРЁХУРОВНЕВЫЙ)
    // ============================================================

    function renderEditor() {
        const container = document.getElementById('editorContainer');
        container.innerHTML = '';

        for (const groupKey in state.data) {
            const group = state.data[groupKey];

            // === УРОВЕНЬ 1: Группа ===
            const groupTitle = document.createElement('div');
            groupTitle.className = `group-title ${group.groupClass}`;
            groupTitle.innerHTML = `
                <span>${group.name}</span>
                <span class="toggle-icon">${group.expanded ? '▼' : '▶'}</span>
            `;
            groupTitle.onclick = () => {
                group.expanded = !group.expanded;
                saveData();
                renderEditor();
            };
            container.appendChild(groupTitle);

            const groupBody = document.createElement('div');
            groupBody.className = `group-body ${group.expanded ? '' : 'collapsed'}`;

            // === УРОВЕНЬ 2: Категория ===
            for (const catKey in group.categories) {
                const cat = group.categories[catKey];
                groupBody.appendChild(createCategoryElement(groupKey, catKey, cat));
            }

            container.appendChild(groupBody);
        }
    }

    function createCategoryElement(groupKey, catKey, cat) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        const activeSubs = Object.values(cat.subcategories).filter(s => s.enabled).length;
        const totalSubs = Object.keys(cat.subcategories).length;

        catDiv.innerHTML = `
            <div class="category-header">
                <div>
                    <h4>${cat.name}</h4>
                    <span class="counter">Подкатегорий: ${activeSubs} / ${totalSubs}</span>
                </div>
                <div class="controls">
                    <span class="toggle-icon">${cat.expanded ? '▼' : '▶'}</span>
                </div>
            </div>
        `;

        const catBody = document.createElement('div');
        catBody.className = `category-body ${cat.expanded ? '' : 'collapsed'}`;

        catDiv.querySelector('.category-header').onclick = () => {
            cat.expanded = !cat.expanded;
            saveData();
            renderEditor();
        };

        // === УРОВЕНЬ 3: Подкатегория ===
        for (const subKey in cat.subcategories) {
            const sub = cat.subcategories[subKey];
            catBody.appendChild(createSubcategoryElement(groupKey, catKey, subKey, sub));
        }

        catDiv.appendChild(catBody);
        return catDiv;
    }

    function createSubcategoryElement(groupKey, catKey, subKey, sub) {
        const subDiv = document.createElement('div');
        subDiv.className = `subcategory ${sub.enabled ? '' : 'disabled off'}`;

        const activeItems = sub.items.filter(i => i.enabled).length;
        const totalItems = sub.items.length;

        subDiv.innerHTML = `
            <div class="subcategory-header">
                <div style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" ${sub.enabled ? 'checked' : ''} style="accent-color: var(--accent-color); cursor:pointer;" onclick="event.stopPropagation(); toggleSubEnabled('${groupKey}','${catKey}','${subKey}')">
                    <span class="sub-name">${sub.name}</span>
                    <span class="sub-counter">(${activeItems}/${totalItems})</span>
                </div>
                <div class="sub-controls">
                    <button class="icon-btn" onclick="event.stopPropagation(); openEditModal('${groupKey}','${catKey}','${subKey}')" title="Редактировать список">✏️</button>
                    <button class="icon-btn" onclick="event.stopPropagation(); removeSubcategory('${groupKey}','${catKey}','${subKey}')" title="Удалить подкатегорию">🗑</button>
                    <span class="toggle-icon">${sub.expanded ? '▼' : '▶'}</span>
                </div>
            </div>
        `;

        const subBody = document.createElement('div');
        subBody.className = `subcategory-body ${sub.expanded ? '' : 'collapsed'}`;
        subBody.innerHTML = `
            <div class="value-list" id="values-${groupKey}-${catKey}-${subKey}"></div>
            <div class="add-value-row">
                <input type="text" placeholder="Добавить значение..." onkeydown="if(event.key==='Enter') addValue('${groupKey}','${catKey}','${subKey}', this)">
                <button onclick="addValue('${groupKey}','${catKey}','${subKey}', this.previousElementSibling)">+</button>
            </div>
        `;

        subDiv.querySelector('.subcategory-header').onclick = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            sub.expanded = !sub.expanded;
            saveData();
            renderEditor();
        };

        subDiv.appendChild(subBody);

        setTimeout(() => renderSubValues(groupKey, catKey, subKey), 0);
        return subDiv;
    }

    function renderSubValues(groupKey, catKey, subKey) {
        const container = document.getElementById(`values-${groupKey}-${catKey}-${subKey}`);
        if (!container) return;
        container.innerHTML = '';

        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];

        sub.items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `value-item ${item.enabled ? '' : 'disabled'}`;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = item.enabled;
            checkbox.onchange = () => toggleValue(groupKey, catKey, subKey, index);

            const textSpan = document.createElement('span');
            textSpan.className = 'value-item-text';
            textSpan.textContent = item.text;
            textSpan.onclick = () => startEditValue(groupKey, catKey, subKey, index, textSpan);

            const delBtn = document.createElement('button');
            delBtn.className = 'icon-btn';
            delBtn.textContent = '❌';
            delBtn.onclick = () => removeValue(groupKey, catKey, subKey, index);

            div.appendChild(checkbox);
            div.appendChild(textSpan);
            div.appendChild(delBtn);
            container.appendChild(div);
        });

        // Обновляем счетчик
        const header = container.closest('.subcategory').querySelector('.sub-counter');
        const activeItems = sub.items.filter(i => i.enabled).length;
        header.textContent = `(${activeItems}/${sub.items.length})`;
    }

    function toggleSubEnabled(groupKey, catKey, subKey) {
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        sub.enabled = !sub.enabled;
        saveData();
        renderEditor();
    }

    function toggleValue(groupKey, catKey, subKey, index) {
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        sub.items[index].enabled = !sub.items[index].enabled;
        saveData();
        renderSubValues(groupKey, catKey, subKey);
    }

    function startEditValue(groupKey, catKey, subKey, index, spanElement) {
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        const currentText = sub.items[index].text;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentText;
        spanElement.replaceWith(input);
        input.focus();

        const finishEdit = () => {
            const newText = input.value.trim();
            if (newText && newText !== currentText) {
                sub.items[index].text = newText;
                saveData();
            }
            renderSubValues(groupKey, catKey, subKey);
        };

        input.onblur = finishEdit;
        input.onkeydown = (e) => {
            if (e.key === 'Enter') finishEdit();
            if (e.key === 'Escape') renderSubValues(groupKey, catKey, subKey);
        };
    }

    function addValue(groupKey, catKey, subKey, inputElement) {
        const value = inputElement.value.trim();
        if (!value) return;
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        const exists = sub.items.some(i => i.text.toLowerCase() === value.toLowerCase());
        if (exists) { showToast('Уже есть!'); return; }
        sub.items.push({ text: value, enabled: true });
        inputElement.value = '';
        saveData();
        renderSubValues(groupKey, catKey, subKey);
    }

    function removeValue(groupKey, catKey, subKey, index) {
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        sub.items.splice(index, 1);
        saveData();
        renderSubValues(groupKey, catKey, subKey);
    }

    function removeSubcategory(groupKey, catKey, subKey) {
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        if (!confirm(`Удалить подкатегорию "${sub.name}"?`)) return;
        delete state.data[groupKey].categories[catKey].subcategories[subKey];
        saveData();
        renderEditor();
    }

    // ============================================================
    // МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ СПИСКА
    // ============================================================

    function openEditModal(groupKey, catKey, subKey) {
        editContext = { groupKey, catKey, subKey };
        const sub = state.data[groupKey].categories[catKey].subcategories[subKey];
        document.getElementById('editModalTitle').textContent = `Редактирование: ${sub.name}`;
        document.getElementById('editModalTextarea').value = sub.items.map(i => i.text).join('\n');
        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        editContext = null;
    }

    function saveEditModal() {
        if (!editContext) return;
        const text = document.getElementById('editModalTextarea').value;
        const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);

        const sub = state.data[editContext.groupKey].categories[editContext.catKey].subcategories[editContext.subKey];

        // Сохраняем enabled для старых элементов
        const oldMap = {};
        sub.items.forEach(i => oldMap[i.text.toLowerCase()] = i.enabled);

        sub.items = lines.map(text => ({
            text: text,
            enabled: oldMap[text.toLowerCase()] !== undefined ? oldMap[text.toLowerCase()] : true
        }));

        saveData();
        renderEditor();
        closeEditModal();
        showToast(`Сохранено: ${lines.length} элементов`);
    }

    // ============================================================
    // СВЕРНУТЬ/РАЗВЕРНУТЬ ВСЁ
    // ============================================================

    function expandAll(expand) {
        for (const gKey in state.data) {
            const group = state.data[gKey];
            group.expanded = expand;
            for (const cKey in group.categories) {
                const cat = group.categories[cKey];
                cat.expanded = expand;
                for (const sKey in cat.subcategories) {
                    cat.subcategories[sKey].expanded = expand;
                }
            }
        }
        saveData();
        renderEditor();
    }

    // ============================================================
    // ЭКСПОРТ/ИМПОРТ БАЗЫ
    // ============================================================

    function exportData() {
        const backup = {
            version: 6,
            exported: new Date().toISOString(),
            data: state.data,
            history: state.history
        };
        downloadFile(JSON.stringify(backup, null, 2), `character_generator_backup_${Date.now()}.json`, 'application/json');
        showToast('База скачана!');
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const backup = JSON.parse(e.target.result);
                if (!backup.data) throw new Error('Неверный формат');
                if (!confirm('Загрузить базу? Текущие данные будут заменены.')) return;

                state.data = backup.data;
                state.history = backup.history || [];
                saveData();
                renderEditor();
                renderHistory();
                showToast('База загружена!');
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function resetAllLists() {
        if (!confirm('Сбросить всё к стандартным? Все изменения будут потеряны.')) return;
        state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveData();
        renderEditor();
        showToast('Сброшено');
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.onload = init;
</script>

</body>
