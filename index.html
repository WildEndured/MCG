<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Персонажей + Холст v2</title>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@25.2.1/dist/bundle.js"></script>
<style>
:root {
    --bg: #1a1a2e;
    --container: #16213e;
    --accent: #e94560;
    --text: #fff;
    --secondary: #0f3460;
    --header: #0d1b2a;
    --appearance: #e94560;
    --clothes: #4a90d9;
    --race: #d9a441;
    --lists: #5cb85c;
    --rules: #9b59b6;
    --mods: #7b68ee;
    --table: #20b2aa;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; min-height: 100vh;
}
.app {
    width: 100%; max-width: 1100px;
    background: var(--container);
    border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    height: fit-content;
}
.tabs { display: flex; background: var(--header); flex-wrap: wrap; }
.tab-btn {
    flex: 1; padding: 12px 6px; background: none; border: none;
    color: #888; font-size: 0.85rem; cursor: pointer; font-weight: bold;
    border-bottom: 3px solid transparent; transition: 0.3s;
    min-width: 80px;
}
.tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
    background: var(--container);
}
.tab-content { padding: 20px; display: none; }
.tab-content.active { display: block; }

/* Генератор */
.result-box {
    background: var(--secondary); padding: 20px;
    border-radius: 10px; margin-bottom: 20px;
    max-height: 600px; overflow-y: auto;
}
.result-line {
    display: flex; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.9rem; gap: 15px; align-items: center;
}
.result-line:last-child { border-bottom: none; }
.result-cat { color: #888; font-weight: bold; font-size: 0.82rem; }
.result-val { color: #fff; font-weight: bold; text-align: right; flex-grow: 1; }
.result-line.main .result-val { color: var(--accent); font-size: 1.05rem; }
.result-line.slot .result-cat { color: var(--clothes); }
.result-line.extra .result-val { color: var(--rules); font-style: italic; }
.result-value-block {
    display: flex; align-items: center; gap: 10px;
    justify-content: flex-end; flex-grow: 1; flex-wrap: wrap;
}
.result-thumb {
    width: 40px; height: 40px; border-radius: 6px;
    object-fit: cover; cursor: pointer;
    border: 1px solid #333; transition: 0.2s; flex-shrink: 0;
}
.result-thumb:hover { border-color: var(--accent); transform: scale(1.1); }
.result-thumbs { display: flex; gap: 5px; flex-wrap: wrap; }

.btn-main {
    background: var(--accent); color: white; border: none;
    padding: 15px 30px; font-size: 1rem; border-radius: 50px;
    cursor: pointer; font-weight: bold; text-transform: uppercase;
    width: 100%; margin-bottom: 10px; transition: 0.2s;
}
.btn-main:hover { background: #ff2e63; transform: scale(1.02); }
.btn-secondary {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 9px 18px;
    border-radius: 5px; cursor: pointer; font-size: 0.85rem;
    transition: 0.2s;
}
.btn-secondary:hover { background: #1a4a7a; }
.btn-table {
    background: var(--table); color: white; border: none;
    padding: 9px 18px; border-radius: 5px; cursor: pointer;
    font-size: 0.85rem; transition: 0.2s; font-weight: bold;
}
.btn-table:hover { background: #1a9b95; }
.btn-secondary:disabled, .btn-table:disabled {
    opacity: 0.4; cursor: not-allowed;
}

.presets-bar {
    display: flex; gap: 8px; margin-bottom: 15px;
    flex-wrap: wrap; align-items: center;
}
.presets-bar span { font-size: 0.85rem; color: #888; }
.preset-btn {
    padding: 6px 12px; font-size: 0.8rem;
    border-radius: 20px; cursor: pointer;
    background: var(--secondary); color: white;
    border: 1px solid #555; transition: 0.2s;
}
.preset-btn:hover { background: var(--accent); border-color: var(--accent); }
.counter-badge {
    font-size: 0.75rem; color: #888; margin-left: auto;
    padding: 4px 10px; background: rgba(0,0,0,0.3); border-radius: 10px;
}

/* История */
.history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.search-input {
    flex-grow: 1; padding: 10px; border-radius: 5px;
    border: 1px solid #333; background: #0d1b2a; color: white;
}
.history-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 550px; overflow-y: auto;
}
.history-item {
    background: #0d1b2a; padding: 12px 15px;
    border-radius: 8px; border-left: 4px solid var(--secondary);
}
.history-item.fav { border-left-color: gold; }
.history-item.table-type { border-left-color: var(--table); }
.history-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px;
}
.history-date { font-size: 0.72rem; color: #888; }
.history-details { font-size: 0.83rem; color: #ccc; line-height: 1.5; }
.history-badge {
    font-size: 0.65rem; padding: 2px 6px; border-radius: 8px;
    background: var(--table); color: white; font-weight: bold;
    margin-right: 6px;
}
.history-actions { display: flex; gap: 4px; }
.icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.05rem; padding: 3px; opacity: 0.6;
    color: white; transition: 0.2s;
}
.icon-btn:hover { opacity: 1; transform: scale(1.1); }
.icon-btn.fav-active { opacity: 1; color: gold; }

/* Списки */
.toolbar {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
    align-items: center;
}
.list-block {
    background: #0d1b2a; border-radius: 10px;
    margin-bottom: 15px; overflow: hidden;
    border-left: 3px solid var(--lists);
}
.list-block.disabled { opacity: 0.5; }
.list-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 12px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.list-header h3 { margin: 0; font-size: 1rem; }
.list-counter { font-size: 0.72rem; color: #888; }
.list-controls { display: flex; gap: 8px; align-items: center; }
.list-body { padding: 12px 15px; display: none; }
.list-block.open .list-body { display: block; }

.add-row { display: flex; gap: 5px; margin-bottom: 10px; }
.add-row input {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.add-row button {
    padding: 6px 12px; background: var(--accent);
    color: white; border: none; border-radius: 5px;
    cursor: pointer; font-size: 0.85rem;
}
.add-row button.import-btn { background: var(--clothes); }

.item-list { max-height: 350px; overflow-y: auto; }
.item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; border-bottom: 1px solid #1a1a2e;
    font-size: 0.85rem;
}
.item.disabled { opacity: 0.4; text-decoration: line-through; }
.item-text {
    flex-grow: 1; cursor: pointer; padding: 3px;
    border-radius: 3px; word-break: break-word;
}
.item-text:hover { background: rgba(255,255,255,0.1); }
.item input[type="text"] {
    flex-grow: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.item input[type="checkbox"] {
    cursor: pointer; width: 15px; height: 15px;
    accent-color: var(--accent); flex-shrink: 0;
}

.item-thumb {
    width: 32px; height: 32px; border-radius: 4px;
    object-fit: cover; cursor: pointer;
    border: 1px solid #333; transition: 0.2s; flex-shrink: 0;
}
.item-thumb:hover { border-color: var(--accent); }
.item-thumb-placeholder {
    width: 32px; height: 32px; border-radius: 4px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.8rem; color: #555;
    border: 1px dashed #333; transition: 0.2s; flex-shrink: 0;
}
.item-thumb-placeholder:hover { color: var(--accent); border-color: var(--accent); }

/* Кнопка "на холст" */
.to-canvas-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1rem; padding: 2px 4px; opacity: 0.5;
    color: var(--table); transition: 0.2s; flex-shrink: 0;
}
.to-canvas-btn:hover { opacity: 1; transform: scale(1.2); }

/* Модули */
.group-title {
    font-size: 1rem; font-weight: bold;
    padding: 11px 15px; margin-top: 15px;
    border-radius: 8px; color: white;
    cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
}
.group-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.group-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.group-race { background: linear-gradient(90deg, var(--race), transparent); }
.group-mods { background: linear-gradient(90deg, var(--mods), transparent); }
.group-body { padding-left: 8px; }
.group-body.collapsed { display: none; }

.module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--accent);
}
.module.disabled { opacity: 0.5; }
.module-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.module-header h4 { margin: 0; font-size: 0.9rem; }
.module-counter { font-size: 0.7rem; color: #888; }
.module-controls { display: flex; gap: 8px; align-items: center; }
.module-body { padding: 10px 15px 15px; display: none; }
.module.open .module-body { display: block; }
.module-toggle {
    background: none; border: none; color: white;
    font-size: 1rem; cursor: pointer; padding: 3px; transition: 0.2s;
}
.module.open .module-toggle { transform: rotate(180deg); }

.simple-module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--mods);
}
.simple-module.disabled { opacity: 0.5; }
.simple-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.simple-header h4 { margin: 0; font-size: 0.9rem; }
.simple-body { padding: 10px 15px 15px; display: none; }
.simple-module.open .simple-body { display: block; }

.subcat {
    background: #1a1a2e; border-radius: 6px;
    margin-top: 6px; overflow: hidden;
    border-left: 2px solid var(--secondary);
}
.subcat.disabled { opacity: 0.4; }
.subcat-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    cursor: pointer; user-select: none; font-size: 0.85rem;
}
.subcat-header:hover { background: rgba(255,255,255,0.03); }
.subcat-name { font-weight: bold; }
.subcat-counter { font-size: 0.7rem; color: #888; margin-left: 8px; }
.subcat-controls { display: flex; gap: 5px; align-items: center; }
.subcat-body {
    padding: 8px 12px 12px;
    border-top: 1px solid #0d1b2a;
    display: none;
}
.subcat.open .subcat-body { display: block; }
.subcat-toggle {
    background: none; border: none; color: white;
    font-size: 0.8rem; cursor: pointer; padding: 3px; transition: 0.2s;
}
.subcat.open .subcat-toggle { transform: rotate(180deg); }

/* ТАБЛИЦА */
.table-section {
    margin-bottom: 25px; border-radius: 8px;
    overflow: hidden; border: 1px solid #0d1b2a;
}
.table-section-header {
    padding: 10px 15px; font-weight: bold;
    font-size: 0.9rem; color: white;
}
.table-section-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.table-section-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.table-section-race { background: linear-gradient(90deg, var(--race), transparent); }
.table-section-lists { background: linear-gradient(90deg, var(--lists), transparent); }

.table-grid {
    width: 100%; border-collapse: collapse; background: #0d1b2a;
}
.table-grid th {
    background: var(--header); padding: 8px 12px;
    text-align: left; font-size: 0.78rem; color: #888;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold;
}
.table-grid td {
    padding: 6px 12px; border-top: 1px solid #1a1a2e;
    font-size: 0.85rem; vertical-align: middle;
}
.table-grid td.slot-name {
    color: #ccc; font-weight: bold; width: 30%; white-space: nowrap;
}
.table-grid td.mod-cell { width: 20%; }
.table-grid td.value-cell { width: 50%; }

.table-cell-input {
    width: 100%; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem; font-family: inherit;
}
.table-cell-input:focus { outline: none; border-color: var(--table); }
.table-cell-input.filled {
    border-color: var(--table); background: rgba(32,178,170,0.08);
}
.table-cell-row { display: flex; align-items: center; gap: 8px; }
.table-cell-row input { flex-grow: 1; }
.table-cell-thumb {
    width: 32px; height: 32px; border-radius: 4px;
    object-fit: cover; cursor: pointer;
    border: 1px solid var(--table); flex-shrink: 0;
}
.table-cell-thumb:hover { transform: scale(1.1); }

.table-toolbar {
    display: flex; gap: 8px; margin-bottom: 15px;
    flex-wrap: wrap; align-items: center;
}

/* ПРАВИЛА */
.rule-card {
    background: #0d1b2a; border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
    border-left: 3px solid var(--rules);
}
.rule-card.disabled { opacity: 0.5; }
.rule-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px; background: var(--header);
}
.rule-header .rule-type {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
    background: var(--rules); color: white; font-weight: bold;
    text-transform: uppercase;
}
.rule-type-replace { background: var(--clothes); }
.rule-type-exclude { background: var(--accent); }
.rule-type-add { background: var(--race); color: #1a1a2e; }

.rule-body { padding: 12px 15px; font-size: 0.85rem; line-height: 1.6; }
.rule-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.rule-row label { font-size: 0.8rem; color: #888; min-width: 100px; }
.rule-row select, .rule-row input[type="text"] {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem; min-width: 130px;
}
.rule-row .arrow { color: var(--rules); font-weight: bold; font-size: 1.1rem; }

.condition-block {
    background: #1a1a2e; padding: 10px; border-radius: 6px;
    margin-bottom: 8px; border-left: 2px solid var(--rules);
}
.condition-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 0.8rem; color: var(--rules); font-weight: bold;
}
.condition-header button {
    background: none; border: none; color: var(--accent);
    cursor: pointer; font-size: 1rem;
}
.add-rule-form {
    background: #0d1b2a; padding: 15px;
    border-radius: 8px; border: 1px dashed var(--rules);
    margin-bottom: 15px;
}
.empty-state {
    text-align: center; color: #666; padding: 30px; font-size: 0.9rem;
}
.chain-badge {
    font-size: 0.65rem; padding: 2px 6px; border-radius: 8px;
    background: var(--race); color: #1a1a2e; font-weight: bold; margin-left: 6px;
}

/* ХОЛСТ */
.canvas-toolbar {
    display: flex; gap: 8px; margin-bottom: 15px;
    flex-wrap: wrap; align-items: center;
}
.canvas-layout {
    display: flex; gap: 15px;
    align-items: flex-start; flex-wrap: wrap;
}
.canvas-area {
    flex: 1; min-width: 300px;
    display: flex; flex-direction: column; gap: 8px;
}
.canvas-zoom-bar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.zoom-btn {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 4px 10px;
    border-radius: 4px; cursor: pointer; font-size: 0.75rem;
}
.zoom-btn.active { background: var(--accent); border-color: var(--accent); }
.zoom-btn:hover { background: #1a4a7a; }

.canvas-scroll {
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 50% / 24px 24px;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: auto;
    max-height: 600px;
    padding: 10px;
    display: block;
}
#mainCanvas {
    background: transparent;
    border: 1px solid #555;
    cursor: crosshair;
    display: block;
    /* размеры canvas задаются через JS */
}

.layers-panel {
    width: 300px;
    background: #0d1b2a;
    border-radius: 8px;
    padding: 12px;
    max-height: 700px;
    overflow-y: auto;
}
.layers-panel h4 { margin-top: 0; }
.layers-list {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 12px;
}
.layer-item {
    background: #1a1a2e;
    border-radius: 6px;
    padding: 8px;
    font-size: 0.8rem;
    border-left: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.layer-item.hidden-layer { opacity: 0.4; border-left-color: #555; }
.layer-header {
    display: flex; justify-content: space-between;
    align-items: center; gap: 6px;
}
.layer-name {
    flex-grow: 1; font-weight: bold; font-size: 0.78rem;
    color: #ccc; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
}
.layer-controls { display: flex; gap: 3px; }
.layer-controls button {
    background: none; border: none; cursor: pointer;
    font-size: 0.9rem; padding: 2px; opacity: 0.7; color: white;
}
.layer-controls button:hover { opacity: 1; }
.layer-thumb {
    width: 100%; height: 40px;
    object-fit: contain;
    background: rgba(0,0,0,0.2);
    border-radius: 4px;
}
.layer-opacity { width: 100%; accent-color: var(--table); }

/* Панель добавления слоя */
.add-layer-section {
    background: #1a1a2e;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 12px;
    border-left: 3px solid var(--table);
}
.add-layer-section h5 { margin: 0 0 8px 0; font-size: 0.85rem; color: var(--table); }
.add-layer-controls {
    display: flex; flex-direction: column; gap: 6px;
}
.add-layer-controls select {
    padding: 5px 8px; border-radius: 4px;
    border: 1px solid #333; background: #0d1b2a;
    color: white; font-size: 0.8rem;
}
.add-layer-controls button {
    padding: 6px 10px; background: var(--table); color: white;
    border: none; border-radius: 4px; cursor: pointer;
    font-size: 0.8rem; font-weight: bold;
}

/* Модальное окно */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: none; justify-content: center; align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--container); padding: 25px;
    border-radius: 12px; max-width: 550px; width: 100%;
    max-height: 85vh; overflow-y: auto;
}
.modal h3 { margin-top: 0; }
.modal textarea {
    width: 100%; height: 200px; padding: 10px;
    background: #0d1b2a; color: white;
    border: 1px solid #333; border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; resize: vertical;
}
.modal-actions {
    display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
}
.image-viewer-modal {
    max-width: 90vw; max-height: 90vh;
    background: transparent; padding: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 15px;
}
.image-viewer-modal img {
    max-width: 100%; max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 50% / 20px 20px;
}

.toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #333;
    color: white; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gen', this)">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('table', this)">📊 Таблица</button>
        <button class="tab-btn" onclick="switchTab('canvas', this)">🎨 Холст</button>
        <button class="tab-btn" onclick="switchTab('hist', this)">📜 История</button>
        <button class="tab-btn" onclick="switchTab('lists', this)">📋 Списки</button>
        <button class="tab-btn" onclick="switchTab('mod', this)">⚙️ Модули</button>
        <button class="tab-btn" onclick="switchTab('rules', this)">🔗 Правила</button>
    </div>

    <!-- ГЕНЕРАТОР -->
    <div id="tab-gen" class="tab-content active">
        <div class="presets-bar">
            <span>Пресеты:</span>

function init() {
    const savedLists = localStorage.getItem('cg_lists_v6');
    const savedMods = localStorage.getItem('cg_modifiers_v5');
    const savedModules = localStorage.getItem('cg_modules_v6');
    const savedRules = localStorage.getItem('cg_rules_v5');
    const savedHist = localStorage.getItem('cg_history_v5');
    const savedCount = localStorage.getItem('cg_gen_count_v5');
    const savedTable = localStorage.getItem('cg_table_v3');

    state.lists = savedLists ? JSON.parse(savedLists) : null;
    state.modifiers = savedMods ? JSON.parse(savedMods) : null;
    state.modules = savedModules ? JSON.parse(savedModules) : null;
    state.rules = savedRules ? JSON.parse(savedRules) : [];
    state.history = savedHist ? JSON.parse(savedHist) : [];
    state.genCount = savedCount ? parseInt(savedCount) : 0;
    state.table = savedTable ? JSON.parse(savedTable) : {};

    if (!state.lists || !isValidListStructure(state.lists)) state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    if (!state.modifiers) state.modifiers = JSON.parse(JSON.stringify(DEFAULT_MODIFIERS));
    if (!state.modules || !isValidModuleStructure(state.modules)) state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    sanitizeData();
    save();
    renderLists();
    renderModules();
    renderRules();
    renderHistory();
    renderTable();
    populateRuleSelects();
    populateAddLayerSelect();
    updateCounter();
}

function isValidListStructure(lists) {
    for (const key in lists) {
        const list = lists[key];
        if (!list || !Array.isArray(list.items)) return false;
        if (!list.items.some(i => i && typeof i.text === 'string' && i.text.length > 0)) return false;
    }
    return true;
}
function isValidModuleStructure(modules) {
    for (const gKey in modules) {
        const group = modules[gKey];
        if (!group.modules) return false;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) return false;
            for (const sKey in mod.subcategories) {
                if (!Array.isArray(mod.subcategories[sKey].items)) return false;
            }
        }
    }
    return true;
}
function sanitizeData() {
    for (const key in state.lists) {
        const list = state.lists[key];
        if (!Array.isArray(list.items)) { list.items = []; continue; }
        list.items = list.items.map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
        if (list.enabled === undefined) list.enabled = true;
        if (list.expanded === undefined) list.expanded = true;
    }
    if (state.modifiers) {
        state.modifiers.items = (state.modifiers.items || []).map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        if (!group.modules) group.modules = {};
        if (group.expanded === undefined) group.expanded = true;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) mod.subcategories = {};
            if (mod.enabled === undefined) mod.enabled = true;
            if (mod.expanded === undefined) mod.expanded = false;
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!Array.isArray(sub.items)) { sub.items = []; continue; }
                sub.items = sub.items.map(i => {
                    if (typeof i === 'string') return { text: i, enabled: true, image: null };
                    if (i && typeof i === 'object' && typeof i.text === 'string') {
                        if (i.image === undefined) i.image = null;
                        return i;
                    }
                    return null;
                }).filter(i => i && i.text.trim().length > 0);
                if (sub.enabled === undefined) sub.enabled = true;
                if (sub.expanded === undefined) sub.expanded = false;
            }
        }
    }
}
function save() {
    try {
        localStorage.setItem('cg_lists_v6', JSON.stringify(state.lists));
        localStorage.setItem('cg_modifiers_v5', JSON.stringify(state.modifiers));
        localStorage.setItem('cg_modules_v6', JSON.stringify(state.modules));
        localStorage.setItem('cg_rules_v5', JSON.stringify(state.rules));
        localStorage.setItem('cg_history_v5', JSON.stringify(state.history));
        localStorage.setItem('cg_gen_count_v5', state.genCount.toString());
        localStorage.setItem('cg_table_v3', JSON.stringify(state.table));
    } catch (e) {
        if (e.name === 'QuotaExceededError') showToast('⚠️ Память переполнена!');
    }
}
function updateCounter() {
    const el = document.getElementById('genCounter');

    imageContext = context;
    document.getElementById('imageFileInput').click();
}
document.getElementById('imageFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !imageContext) return;
    try {
        const dataUrl = await compressImage(file);
        applyImageToContext(dataUrl);
    } catch (err) { alert('Ошибка загрузки: ' + err.message); }
    e.target.value = '';
    imageContext = null;
});

// ИСПРАВЛЕНО: сохраняем PNG с прозрачностью, оригинальный размер до 2048
function compressImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const MAX = 2048;
                let { width, height } = img;

                // Если картинка маленькая — сохраняем как есть (оригинал!)
                if (width <= MAX && height <= MAX) {
                    resolve(ev.target.result);
                    return;
                }

                // Иначе уменьшаем пропорционально до MAX
                if (width > height) {
                    height = height * MAX / width;
                    width = MAX;
                } else {
                    width = width * MAX / height;
                    height = MAX;
                }

                const canvas = document.createElement('canvas');
                canvas.width = Math.round(width);
                canvas.height = Math.round(height);
                const ctx = canvas.getContext('2d');

                // НЕ заливаем белым — сохраняем прозрачность
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Определяем формат по mime-type
                const isPng = file.type === 'image/png';
                const isWebp = file.type === 'image/webp';

                let dataUrl;
                if (isPng) {
                    dataUrl = canvas.toDataURL('image/png'); // без сжатия, с альфа
                } else if (isWebp) {
                    dataUrl = canvas.toDataURL('image/webp', 0.9);
                } else {
                    dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                }
                resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
            img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function applyImageToContext(dataUrl) {
    const ctx = imageContext; if (!ctx) return;
    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;
    if (items && items[ctx.index]) {
        items[ctx.index].image = dataUrl;
        save();
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение привязано');
    }
}
function removeImage(context) {
    const ctx = context;
    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;
    if (items && items[ctx.index]) {
        items[ctx.index].image = null;
        save();
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение удалено');
    }
}
function openImageViewer(src) {
    document.getElementById('imageViewerImg').src = src;
    document.getElementById('imageViewerModal').classList.add('active');
}
function closeImageViewer() {
    document.getElementById('imageViewerModal').classList.remove('active');
}
function clearAllImages() {
    if (!confirm('Удалить ВСЕ привязанные изображения?')) return;
    for (const key in state.lists) state.lists[key].items.forEach(i => { i.image = null; });
    if (state.modifiers) state.modifiers.items.forEach(i => { i.image = null; });
    for (const gKey in state.modules) {
        for (const mKey in state.modules[gKey].modules) {
            for (const sKey in state.modules[gKey].modules[mKey].subcategories) {
                state.modules[gKey].modules[mKey].subcategories[sKey].items.forEach(i => { i.image = null; });
            }
        }
    }
    save(); renderLists(); renderModules();
    showToast('Все изображения удалены');
}

function getAllPaths() {
    const paths = [];
    paths.push({ path: 'list.races', name: '🧬 Расы', items: state.lists.races.items });
    paths.push({ path: 'list.styles', name: '👗 Стили', items: state.lists.styles.items });
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            const allItems = [];
            for (const sKey in mod.subcategories) allItems.push(...mod.subcategories[sKey].items);
            paths.push({ path: `${gKey}.${mKey}`, name: mod.name, items: allItems });
        }
    }
    return paths;
}

// ============================================================
// ГЕНЕРАЦИЯ
// ============================================================
function randItem(items) {
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}
function randItemExcluding(items, excludeList) {
    const excludeLower = excludeList.map(s => s.toLowerCase());
    const active = items.filter(i => i.enabled && i.text && !excludeLower.includes(i.text.toLowerCase()) && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}

function generate() {
    const result = {};
    const resultItems = {};
    const paths = [];
    const extraTexts = [];

    if (state.lists.races.enabled) {
        const item = randItem(state.lists.races.items);
        if (item) { result['list.races'] = item.text; resultItems['list.races'] = [item]; paths.push('list.races'); }
    }
    if (state.lists.styles.enabled) {
        const item = randItem(state.lists.styles.items);
        if (item) { result['list.styles'] = item.text; resultItems['list.styles'] = [item]; paths.push('list.styles'); }
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const slotItems = [];
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!sub.enabled) continue;
                const item = randItem(sub.items);
                if (item) slotItems.push(item);
            }
            if (slotItems.length > 0) {
                const path = `${gKey}.${mKey}`;
                result[path] = slotItems.map(i => i.text).join(', ');
                resultItems[path] = slotItems;
                paths.push(path);
            }
        }
    }
    if (state.modifiers && state.modifiers.enabled) {
        const modItem = randItem(state.modifiers.items);
        if (modItem) {
            const clothesSlots = ['clothes.headwear', 'clothes.neckwear', 'clothes.topwear1', 'clothes.bottomwear', 'clothes.legwear', 'clothes.footwear'];
            const available = clothesSlots.filter(s => result[s]);
            if (available.length > 0) {
                const target = available[Math.floor(Math.random() * available.length)];
                result[target] = `${modItem.text} ${result[target]}`;
                if (resultItems[target]) resultItems[target].unshift(modItem);
            }
        }
    }

    const activeRules = state.rules.filter(r => r.enabled);
    activeRules.filter(r => r.type === 'replace').forEach(rule => {
        if (checkConditions(rule, result)) {
            const actPath = rule.action.path;
            const actVal = rule.action.value;
            if (actPath) {
                result[actPath] = actVal;
                if (!paths.includes(actPath)) paths.push(actPath);
                const items = getItemsByPath(actPath);
                const found = items.find(i => i.text === actVal);
                resultItems[actPath] = found ? [found] : [];
            }
        }
    });
    let chainChanged = true, chainIter = 0;
    while (chainChanged && chainIter < 3) {
        chainChanged = false; chainIter++;
        activeRules.filter(r => r.type === 'replace' && r.chain).forEach(rule => {
            if (checkConditions(rule, result)) {
                const actPath = rule.action.path;
                const actVal = rule.action.value;
                if (actPath && result[actPath] !== actVal) {
                    result[actPath] = actVal;
                    if (!paths.includes(actPath)) paths.push(actPath);
                    const items = getItemsByPath(actPath);
                    const found = items.find(i => i.text === actVal);
                    resultItems[actPath] = found ? [found] : [];
                    chainChanged = true;
                }
            }
        });
    }
    activeRules.filter(r => r.type === 'exclude').forEach(rule => {
        if (checkConditions(rule, result)) {
            const exclPath = rule.action.path;
            const exclValues = rule.action.values || [];
            if (!exclPath) return;
            if (exclPath.startsWith('list.')) {
                const listKey = exclPath.split('.')[1];
                const item = randItemExcluding(state.lists[listKey].items, exclValues);
                if (item) { result[exclPath] = item.text; resultItems[exclPath] = [item]; }
            } else {
                const [gKey, mKey] = exclPath.split('.');
                const mod = state.modules[gKey] && state.modules[gKey].modules[mKey];
                if (!mod || !mod.enabled) return;
                const slotItems = [];
                for (const sKey in mod.subcategories) {
                    const sub = mod.subcategories[sKey];
                    if (!sub.enabled) continue;
                    const item = randItemExcluding(sub.items, exclValues);
                    if (item) slotItems.push(item);
                }
                if (slotItems.length > 0) {
                    result[exclPath] = slotItems.map(i => i.text).join(', ');
                    resultItems[exclPath] = slotItems;
                }
            }
        }
    });
    activeRules.filter(r => r.type === 'add').forEach(rule => {
        if (checkConditions(rule, result)) {
            if (rule.action.text) extraTexts.push(rule.action.text);
        }
    });

    if (paths.length === 0) { showToast("Все списки и модули отключены!"); return; }

    state.current = result;
    state.currentPaths = paths;
    state.currentItems = resultItems;
    state.extraText = extraTexts.join(', ');
    state.genCount++;
    save();
    updateCounter();
    renderResult(result, paths, extraTexts, resultItems);
    addHistory(result, paths, extraTexts, resultItems);
}

function checkConditions(rule, result) {
    if (!rule.conditions || rule.conditions.length === 0) return false;
    for (const cond of rule.conditions) {
        if (!matchesCondition(result, cond.path, cond.value, cond.negate)) return false;
    }
    return true;
}
function matchesCondition(result, condPath, condVal, negate) {
    if (!condPath) return false;
    const currentVal = result[condPath];
    const isEmpty = !currentVal;
    const currentParts = currentVal ? currentVal.split(',').map(s => s.trim().toLowerCase()) : [];
    const match = !isEmpty && currentParts.includes((condVal || '').toLowerCase());
    if (negate) return isEmpty || !match;
    return match;
}
function getPathName(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].name;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return path;
    return state.modules[g].modules[m].name;
}
function getItemsByPath(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].items;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    const all = [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all;
}

function renderResult(result, paths, extraTexts, resultItems) {
    const box = document.getElementById('resultBox');
    box.innerHTML = '';
    paths.forEach(path => {
        const name = getPathName(path);
        const isMain = path === 'list.races' || path === 'list.styles';
        const isSlot = !path.startsWith('list.');
        const line = document.createElement('div');
        line.className = `result-line ${isMain ? 'main' : ''} ${isSlot ? 'slot' : ''}`;
        line.innerHTML = `<span class="result-cat">${name}</span>`;
        const valueBlock = document.createElement('div');
        valueBlock.className = 'result-value-block';
        const items = resultItems[path] || [];
        const withImages = items.filter(i => i && i.image);
        const valueText = document.createElement('span');
        valueText.className = 'result-val';
        valueText.textContent = result[path];
        valueBlock.appendChild(valueText);
        if (withImages.length > 0) {
            const thumbs = document.createElement('div');
            thumbs.className = 'result-thumbs';
            withImages.forEach(item => {
                const img = document.createElement('img');
                img.className = 'result-thumb';
                img.src = item.image;
                img.title = item.text;
                img.onclick = () => openImageViewer(item.image);
                thumbs.appendChild(img);
            });
            valueBlock.appendChild(thumbs);
        }
        line.appendChild(valueBlock);
        box.appendChild(line);
    });
    if (extraTexts && extraTexts.length > 0) {
        const line = document.createElement('div');
        line.className = 'result-line extra';
        line.innerHTML = `<span class="result-cat">🔗 Дополнительно</span><span class="result-val">${extraTexts.join(', ')}</span>`;
        box.appendChild(line);
    }
}
function addHistory(result, paths, extraTexts, resultItems) {
    const itemsForHistory = {};
    for (const path in resultItems) {
        itemsForHistory[path] = resultItems[path].map(i => ({ text: i.text, image: i.image || null }));
    }
    state.history.unshift({
        id: Date.now(),
        type: 'generated',
        result: JSON.parse(JSON.stringify(result)),
        paths: [...paths],
        extraTexts: extraTexts || [],
        items: itemsForHistory,
        date: new Date().toLocaleString('ru-RU'),
        favorite: false
    });
    if (state.history.length > 200) state.history.pop();
    save();
}

function formatPrompt(result, paths, extraTexts) {
    let out = paths.map(p => `${getPathName(p)}: ${result[p]}`).join('\n');
    if (extraTexts && extraTexts.length > 0) out += `\nДополнительно: ${extraTexts.join(', ')}`;
    return out;
}
function formatShort(result, paths, extraTexts) {
    let out = paths.map(p => result[p]).join(', ');
    if (extraTexts && extraTexts.length > 0) out += `, ${extraTexts.join(', ')}`;
    return out;
}
function copyResult() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatPrompt(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));
    showToast('Скопировано!');
}
function copyShort() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatShort(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));
    showToast('Скопировано!');
}

const PRESETS = {
    all: null,
    portrait: ['list.races', 'list.styles', 'appearance.bangs', 'appearance.sidelocks', 'appearance.backHair', 'appearance.addHair', 'appearance.eyeShape', 'appearance.skinColor', 'race.trait1', 'race.trait2', 'race.trait3', 'clothes.acc1'],
    full: ['list.races', 'list.styles', 'appearance.bangs', 'appearance.sidelocks', 'appearance.backHair', 'appearance.addHair', 'appearance.eyeShape', 'appearance.skinColor', 'clothes.headwear', 'clothes.neckwear', 'clothes.handwear', 'clothes.topwear1', 'clothes.bottomwear', 'clothes.legwear', 'clothes.footwear', 'clothes.acc1', 'clothes.acc2', 'clothes.acc3', 'clothes.acc4', 'clothes.acc5', 'race.trait1', 'race.trait2', 'race.trait3'],
    race: ['list.races', 'race.trait1', 'race.trait2', 'race.trait3', 'race.trait4', 'race.trait5', 'race.trait6', 'race.trait7']
};
function applyPreset(name) {
    const preset = PRESETS[name];
    for (const key in state.lists) {
        if (preset === null) state.lists[key].enabled = true;
        else state.lists[key].enabled = preset.includes(`list.${key}`);
    }
    if (state.modifiers) {
        if (preset === null) state.modifiers.enabled = true;
        else state.modifiers.enabled = false;
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (preset === null) mod.enabled = true;
            else mod.enabled = preset.includes(`${gKey}.${mKey}`);
        }
    }
    if (name === 'full' && state.modifiers) state.modifiers.enabled = true;
    save(); renderLists(); renderModules();
    showToast(`Пресет "${name}"`);
}

function renderHistory() {
    const list = document.getElementById('historyList');
    const q = document.getElementById('search').value.toLowerCase();
    list.innerHTML = '';
    const filtered = state.history.filter(it => formatShort(it.result, it.paths, it.extraTexts || []).toLowerCase().includes(q));
    if (filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">История пуста.</p>';
        return;
    }
    filtered.forEach(it => {
        const div = document.createElement('div');
        div.className = `history-item ${it.favorite ? 'fav' : ''} ${it.type === 'table' ? 'table-type' : ''}`;
        const badge = it.type === 'table' ? '<span class="history-badge">📊 Таблица</span>' : '';
        div.innerHTML = `
            <div class="history-header">
                <span class="history-date">${badge}${it.date}</span>
                <div class="history-actions">
                    <button class="icon-btn ${it.favorite ? 'fav-active' : ''}" onclick="toggleFav(${it.id})">${it.favorite ? '★' : '☆'}</button>
                    <button class="icon-btn" onclick="copyHist(${it.id})">📋</button>
                    <button class="icon-btn" onclick="delHist(${it.id})">❌</button>
                </div>
            </div>
            <div class="history-details">${formatShort(it.result, it.paths, it.extraTexts || [])}</div>
        `;
        list.appendChild(div);
    });
}
function toggleFav(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { it.favorite = !it.favorite; save(); renderHistory(); }
}
function delHist(id) {
    state.history = state.history.filter(i => i.id !== id);
    save(); renderHistory();
}
function clearHistory() {
    if (confirm('Удалить всю историю?')) { state.history = []; save(); renderHistory(); }
}
function copyHist(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { navigator.clipboard.writeText(formatPrompt(it.result, it.paths, it.extraTexts || [])); showToast('Скопировано!'); }
}

function renderLists() {
    const container = document.getElementById('listsContainer');
    container.innerHTML = '';
    for (const key in state.lists) container.appendChild(createListBlock(key, state.lists[key]));
}
function createListBlock(key, list) {
    const div = document.createElement('div');
    div.className = `list-block ${list.enabled ? '' : 'disabled'} ${list.expanded ? 'open' : ''}`;
    const active = list.items.filter(i => i.enabled).length;
    const withImages = list.items.filter(i => i.image).length;
    div.innerHTML = `
        <div class="list-header">
            <div>
                <h3>${list.name}</h3>
                <span class="list-counter">Активно: ${active} / ${list.items.length}${withImages ? ` · 🖼️ ${withImages}` : ''}</span>
            </div>
            <div class="list-controls">
                <label style="font-size:0.75rem; cursor:pointer;">
                    <input type="checkbox" ${list.enabled ? 'checked' : ''} onchange="toggleList('${key}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="icon-btn" onclick="event.stopPropagation(); openEditList('${key}')">✏️</button>
                <span style="font-size:0.9rem;">${list.expanded ? '▼' : '▶'}</span>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'list-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addListItem('${key}', this)">
            <button onclick="addListItem('${key}', this.previousElementSibling)">+</button>
            <button class="import-btn" onclick="openBulkImport('list','${key}')">📥</button>
        </div>
        <div class="item-list" id="list-values-${key}"></div>
    `;
    div.querySelector('.list-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        list.expanded = !list.expanded; save(); renderLists();
    };
    div.appendChild(body);
    setTimeout(() => renderListItems(key), 0);
    return div;
}
function renderListItems(key) {
    const container = document.getElementById(`list-values-${key}`);
    if (!container) return;
    container.innerHTML = '';
    const list = state.lists[key];
    list.items.forEach((item, idx) => {
        if (!item || !item.text) return;
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderListItems(key); };
        const thumbWrap = document.createElement('div');
        if (item.image) {
            const img = document.createElement('img');
            img.className = 'item-thumb'; img.src = item.image;
            img.onclick = () => openImageViewer(item.image);
            img.oncontextmenu = (e) => { e.preventDefault(); removeImage({ type: 'list', key, index: idx }); };
            thumbWrap.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'item-thumb-placeholder'; ph.textContent = '🖼️';
            ph.onclick = () => pickImage({ type: 'list', key, index: idx });
            thumbWrap.appendChild(ph);
        }
        const txt = document.createElement('span');
        txt.className = 'item-text'; txt.textContent = item.text;
        txt.onclick = () => startEditListItem(key, idx, txt);
        // НОВОЕ: кнопка "на холст"
        const toCanvasBtn = document.createElement('button');
        toCanvasBtn.className = 'to-canvas-btn';
        toCanvasBtn.textContent = '🎨';
        toCanvasBtn.title = 'Отправить на холст';
        toCanvasBtn.onclick = (e) => { e.stopPropagation(); sendToCanvas('list.' + key, item); };
        const del = document.createElement('button');
        del.className = 'icon-btn'; del.textContent = '❌';
        del.onclick = () => { list.items.splice(idx, 1); save(); renderListItems(key); };
        row.appendChild(cb); row.appendChild(thumbWrap); row.appendChild(txt); row.appendChild(toCanvasBtn); row.appendChild(del);
        container.appendChild(row);
    });
    const header = container.closest('.list-block').querySelector('.list-counter');

function renderModules() {
    const container = document.getElementById('modulesContainer');
    container.innerHTML = '';
    const q = (document.getElementById('moduleSearch').value || '').toLowerCase();

    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        const visibleModules = {};
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!q) { visibleModules[mKey] = mod; continue; }
            const modMatch = mod.name.toLowerCase().includes(q);
            let subMatch = false;
            for (const sKey in mod.subcategories) {
                if (mod.subcategories[sKey].name.toLowerCase().includes(q)) { subMatch = true; break; }
                for (const item of mod.subcategories[sKey].items) {
                    if (item.text.toLowerCase().includes(q)) { subMatch = true; break; }
                }
                if (subMatch) break;
            }
            if (modMatch || subMatch) visibleModules[mKey] = mod;
        }
        if (Object.keys(visibleModules).length === 0 && q) continue;
        const title = document.createElement('div');
        title.className = `group-title ${group.groupClass}`;
        title.innerHTML = `<span>${group.name}</span><span>${group.expanded ? '▼' : '▶'}</span>`;
        title.onclick = () => { group.expanded = !group.expanded; save(); renderModules(); };
        container.appendChild(title);
        const body = document.createElement('div');
        body.className = `group-body ${group.expanded ? '' : 'collapsed'}`;
        for (const mKey in visibleModules) body.appendChild(createModule(gKey, mKey, visibleModules[mKey]));
        container.appendChild(body);
    }
    if (state.modifiers && (!q || state.modifiers.name.toLowerCase().includes(q) || state.modifiers.items.some(i => i.text.toLowerCase().includes(q)))) {
        const title = document.createElement('div');
        title.className = 'group-title group-mods';
        title.innerHTML = `<span>✨ Модификаторы одежды</span><span>${state.modifiers.expanded ? '▼' : '▶'}</span>`;
        title.onclick = () => { state.modifiers.expanded = !state.modifiers.expanded; save(); renderModules(); };

function onRuleActModuleChange() {

function addRule() {
    const type = document.getElementById('newRuleType').value;
    const conditions = [];
    const condRows = document.querySelectorAll('#conditionsContainer .rule-row');
    condRows.forEach(row => {
        const path = row.querySelector('.cond-module').value;
        const value = row.querySelector('.cond-value').value;
        const negate = row.querySelector('.cond-negate').checked;
        if (path && value) conditions.push({ path, value, negate });
    });
    if (conditions.length === 0) { showToast('Добавьте условие!'); return; }
    const rule = { id: Date.now(), type, conditions, action: {}, enabled: true, chain: document.getElementById('newRuleChain').checked };
    if (type === 'replace') {
        const actPath = document.getElementById('newRuleActModule').value;
        const actValue = document.getElementById('newRuleActValue').value;
        if (!actPath || !actValue) { showToast('Заполните!'); return; }
        rule.action = { path: actPath, value: actValue };
    } else if (type === 'exclude') {
        const actPath = document.getElementById('newRuleExclModule').value;
        const actValues = document.getElementById('newRuleExclValue').value.split(',').map(s => s.trim()).filter(s => s);
        if (!actPath || actValues.length === 0) { showToast('Заполните!'); return; }
        rule.action = { path: actPath, values: actValues };
    } else if (type === 'add') {
        const text = document.getElementById('newRuleAddText').value.trim();
        if (!text) { showToast('Введите текст!'); return; }
        rule.action = { text };
    }
    state.rules.push(rule);
    save(); renderRules();
    showToast('Правило добавлено');
    document.getElementById('newRuleExclValue').value = '';
    document.getElementById('newRuleAddText').value = '';
    document.getElementById('conditionsContainer').innerHTML = '';
    document.getElementById('newRuleChain').checked = false;
    addCondition();
}

        let condText = rule.conditions.map(c => {
            const name = getPathName(c.path) || c.path;
            return `${name} ${c.negate ? '≠' : '='} <b style="color:var(--rules);">${c.value}</b>`;
        }).join(' <b>И</b> ');
        let actionText = '';
        if (rule.type === 'replace') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `<b>${actName}</b> = <b style="color:var(--clothes);">${rule.action.value}</b>`;
        } else if (rule.type === 'exclude') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `убрать из <b>${actName}</b>: <b style="color:var(--accent);">${rule.action.values.join(', ')}</b>`;
        } else {
            actionText = `добавить текст: <b style="color:var(--race);">${rule.action.text}</b>`;
        }
        const chainBadge = rule.chain ? '<span class="chain-badge">🔗 ЦЕПОЧКА</span>' : '';
        div.innerHTML = `
            <div class="rule-header">
                <span class="rule-type ${typeClass}">${typeLabel}${chainBadge}</span>
                <div style="display:flex; gap:8px; align-items:center;">
                    <label style="font-size:0.75rem; cursor:pointer;">
                        <input type="checkbox" ${rule.enabled ? 'checked' : ''} onchange="toggleRule(${rule.id})" style="accent-color: var(--rules);"> Вкл
                    </label>
                    <button class="icon-btn" onclick="deleteRule(${rule.id})">❌</button>
                </div>
            </div>
            <div class="rule-body">
                <b>Если</b> ${condText}<br>
                <b>Тогда</b> ${actionText}
            </div>
        `;
        container.appendChild(div);
    });
}
function toggleRule(id) { const r = state.rules.find(x => x.id === id); if (r) { r.enabled = !r.enabled; save(); renderRules(); } }
function deleteRule(id) { state.rules = state.rules.filter(x => x.id !== id); save(); renderRules(); }
function exportRules() {
    const data = JSON.stringify({ version: 3, rules: state.rules }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rules_${Date.now()}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Правила экспортированы');
}
function importRules(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.rules || !Array.isArray(data.rules)) throw new Error('Неверный формат');
            if (!confirm(`Загрузить ${data.rules.length} правил?`)) return;
            state.rules = data.rules;
            save(); renderRules();
            showToast(`Загружено: ${data.rules.length}`);
        } catch (err) { alert('Ошибка: ' + err.message); }
        event.target.value = '';
    };
    reader.readAsText(file);
}

    if (!editContext) return;
    const text = document.getElementById('editTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (editContext.type === 'list') target = state.lists[editContext.key].items;
    else if (editContext.type === 'modifier') target = state.modifiers.items;
    else target = state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items;
    const oldMap = {};
    target.forEach(i => { if (i && i.text) oldMap[i.text.toLowerCase()] = { enabled: i.enabled, image: i.image || null }; });
    const newItems = lines.map(t => {
        const old = oldMap[t.toLowerCase()];
        return { text: t, enabled: old ? old.enabled : true, image: old ? old.image : null };
    });
    if (editContext.type === 'list') state.lists[editContext.key].items = newItems;
    else if (editContext.type === 'modifier') state.modifiers.items = newItems;
    else state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items = newItems;

function getTableRows() {
    const sections = {
        lists:      { name: "📋 Списки (основное)",     class: "table-section-lists",      rows: [] },
        appearance: { name: "🎨 Модуль базовой внешности", class: "table-section-appearance", rows: [] },
        clothes:    { name: "👗 Модуль одежды",           class: "table-section-clothes",    rows: [] },
        race:       { name: "🧬 Модуль расы",             class: "table-section-race",       rows: [] }
    };
    sections.lists.rows.push({ path: 'list.races', name: "🧬 Расы", items: state.lists.races.items.filter(i => i.enabled), isClothes: false });
    sections.lists.rows.push({ path: 'list.styles', name: "👗 Стили одежды", items: state.lists.styles.items.filter(i => i.enabled), isClothes: false });
    for (const mKey in state.modules.race.modules) {
        const mod = state.modules.race.modules[mKey];
        const path = `race.${mKey}`;
        sections.race.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: false });
    }
    for (const mKey in state.modules.appearance.modules) {
        const mod = state.modules.appearance.modules[mKey];
        const path = `appearance.${mKey}`;
        sections.appearance.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: false });
    }
    for (const mKey in state.modules.clothes.modules) {
        const mod = state.modules.clothes.modules[mKey];
        const path = `clothes.${mKey}`;
        sections.clothes.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: true });
    }
    return sections;
}
function collectItems(path) {
    const all = [];
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].items;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all.filter(i => i.enabled);
}

const CANVAS_SIZE = 4096;

let canvasState = {
    layers: [],
    zoom: 1,
    eraser: false,
    history: [],
    historyIndex: -1
};

let mainCanvas = null;
let ctx = null;

const LAYER_ORDER = {
    'list.races': 1, 'list.styles': 2,
    'race.trait1': 3, 'race.trait2': 4, 'race.trait3': 5,
    'race.trait4': 6, 'race.trait5': 7, 'race.trait6': 8, 'race.trait7': 9,
    'appearance.bangs': 10, 'appearance.sidelocks': 11,
    'appearance.backHair': 12, 'appearance.addHair': 13,
    'appearance.eyeShape': 14, 'appearance.skinColor': 15,
    'clothes.bottomwear': 20, 'clothes.legwear': 21,
    'clothes.topwear1': 22, 'clothes.handwear': 23,
    'clothes.neckwear': 24, 'clothes.headwear': 25,
    'clothes.acc1': 30, 'clothes.acc2': 31, 'clothes.acc3': 32,
    'clothes.acc4': 33, 'clothes.acc5': 34
};

function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });
}

// НОВОЕ: отправка элемента на холст вручную
async function sendToCanvas(path, item) {
    if (!item || !item.image) {
        showToast('У элемента нет привязанной картинки');
        return;
    }
    if (!canvasInitialized) {
        canvasInitialized = true;
        mainCanvas = document.getElementById('mainCanvas');
        ctx = mainCanvas.getContext('2d');
        mainCanvas.width = CANVAS_SIZE;
        mainCanvas.height = CANVAS_SIZE;
        attachCanvasEvents();
        setZoom(1, document.querySelector('.zoom-btn.active'));
    }
    try {
        const img = await loadImage(item.image);
        canvasState.layers.push({
            path: path,
            name: getPathName(path),
            item: item.text,
            image: img,
            visible: true,
            opacity: 1,
            flipH: false,
            flipV: false,
            eraseStrokes: []
        });
        // Сортируем по LAYER_ORDER
        canvasState.layers.sort((a, b) => (LAYER_ORDER[a.path] || 100) - (LAYER_ORDER[b.path] || 100));
        renderLayers();
        redrawCanvas();
        pushHistory();
        showToast(`"${item.text}" → на холст`);
    } catch (e) {
        showToast('Не удалось загрузить картинку');
    }
}

// НОВОЕ: добавление слоя из панели справа

async function buildLayersFromPaths(result, resultItems) {
    canvasState.layers = [];
    const paths = Object.keys(result).filter(p => resultItems[p] && resultItems[p].some(i => i.image));
    paths.sort((a, b) => (LAYER_ORDER[a] || 100) - (LAYER_ORDER[b] || 100));

    for (const path of paths) {
        const items = resultItems[path].filter(i => i.image);
        if (items.length === 0) continue;
        const item = items[0];
        try {
            const img = await loadImage(item.image);
            canvasState.layers.push({
                path: path,
                name: getPathName(path),
                item: item.text,
                image: img,
                visible: true,
                opacity: 1,
                flipH: false,
                flipV: false,
                eraseStrokes: []
            });
        } catch (e) {
            console.warn('Не удалось загрузить изображение для', path);
        }
    }
    renderLayers();
    redrawCanvas();
    pushHistory();
}

function loadFromLastGeneration() {
    if (!state.currentPaths || state.currentPaths.length === 0) {
        showToast('Сначала сгенерируйте!');
        return;
    }
    if (!canvasInitialized) {
        canvasInitialized = true;
        mainCanvas = document.getElementById('mainCanvas');
        ctx = mainCanvas.getContext('2d');
        mainCanvas.width = CANVAS_SIZE;
        mainCanvas.height = CANVAS_SIZE;
        attachCanvasEvents();
        setZoom(1, document.querySelector('.zoom-btn.active'));
    }
    buildLayersFromPaths(state.current, state.currentItems).then(() => {
        showToast('Загружено из генерации');
    });
}

function loadFromTable() {
    const filled = Object.keys(state.table).filter(k => state.table[k].value);
    if (filled.length === 0) { showToast('Таблица пуста!'); return; }
    if (!canvasInitialized) {
        canvasInitialized = true;
        mainCanvas = document.getElementById('mainCanvas');
        ctx = mainCanvas.getContext('2d');
        mainCanvas.width = CANVAS_SIZE;
        mainCanvas.height = CANVAS_SIZE;
        attachCanvasEvents();
        setZoom(1, document.querySelector('.zoom-btn.active'));
    }
    const result = {};
    const resultItems = {};
    filled.forEach(path => {
        const entry = state.table[path];
        let value = entry.value;
        if (entry.modifier) value = `${entry.modifier} ${value}`;
        result[path] = value;
        const items = collectItems(path);
        const found = items.find(i => i.text === entry.value);
        resultItems[path] = found ? [found] : [];
    });
    buildLayersFromPaths(result, resultItems).then(() => {
        showToast('Загружено из таблицы');
    });
}

function redrawCanvas() {
    if (!ctx) return;
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    canvasState.layers.forEach(layer => {
        if (!layer.visible) return;
        drawLayer(layer);
    });
}

function drawLayer(layer) {
    const img = layer.image;
    if (!img) return;
    const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = (CANVAS_SIZE - w) / 2;
    const y = (CANVAS_SIZE - h) / 2;
    ctx.save();
    ctx.globalAlpha = layer.opacity;
    let drawX = x, drawY = y;
    let drawW = w, drawH = h;
    if (layer.flipH) { drawX = x + w; drawW = -w; }
    if (layer.flipV) { drawY = y + h; drawH = -h; }
    ctx.drawImage(img, drawX, drawY, drawW, drawH);
    if (layer.eraseStrokes.length > 0) {
        ctx.globalCompositeOperation = 'destination-out';
        layer.eraseStrokes.forEach(stroke => {
            ctx.beginPath();
            ctx.arc(stroke.x, stroke.y, stroke.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
}

function renderLayers() {
    const container = document.getElementById('layersList');
    if (!container) return;
    container.innerHTML = '';
    if (canvasState.layers.length === 0) {
        container.innerHTML = '<p style="color:#666; font-size:0.85rem; text-align:center;">Холст пуст.<br>Используй «➕ Добавить слой» выше или кнопки 🎨 в модулях.</p>';
        return;
    }
    const reversed = [...canvasState.layers].reverse();
    reversed.forEach((layer, revIdx) => {
        const realIdx = canvasState.layers.length - 1 - revIdx;
        const div = document.createElement('div');
        div.className = `layer-item ${layer.visible ? '' : 'hidden-layer'}`;
        div.innerHTML = `
            <div class="layer-header">
                <span class="layer-name" title="${layer.name}: ${layer.item}">${layer.name}</span>
                <div class="layer-controls">
                    <button onclick="toggleLayerVisibility(${realIdx})" title="Видимость">${layer.visible ? '👁' : '🚫'}</button>
                    <button onclick="flipLayerH(${realIdx})" title="Отразить по горизонтали">↔️</button>
                    <button onclick="flipLayerV(${realIdx})" title="Отразить по вертикали">↕️</button>
                    <button onclick="clearEraseStrokes(${realIdx})" title="Очистить ластик">🧹</button>
                    <button onclick="removeLayer(${realIdx})" title="Удалить слой">🗑</button>
                </div>
            </div>
            <img class="layer-thumb" src="${layer.image.src}" alt="${layer.name}">
            <input type="range" class="layer-opacity" min="0" max="100" value="${Math.round(layer.opacity * 100)}" oninput="setLayerOpacity(${realIdx}, this.value)">
            <div style="font-size:0.7rem; color:#888;">${layer.item}</div>
        `;
        container.appendChild(div);
    });
}

function toggleLayerVisibility(idx) {
    canvasState.layers[idx].visible = !canvasState.layers[idx].visible;
    renderLayers(); redrawCanvas();
}
function flipLayerH(idx) {
    canvasState.layers[idx].flipH = !canvasState.layers[idx].flipH;
    redrawCanvas(); pushHistory();
}
function flipLayerV(idx) {
    canvasState.layers[idx].flipV = !canvasState.layers[idx].flipV;
    redrawCanvas(); pushHistory();
}
function setLayerOpacity(idx, val) {
    canvasState.layers[idx].opacity = val / 100;
    redrawCanvas();
}
function clearEraseStrokes(idx) {
    canvasState.layers[idx].eraseStrokes = [];
    redrawCanvas(); pushHistory();
}
function removeLayer(idx) {
    canvasState.layers.splice(idx, 1);
    renderLayers(); redrawCanvas(); pushHistory();
}
function flipCanvasHorizontal() {
    canvasState.layers.forEach(l => l.flipH = !l.flipH);
    redrawCanvas(); pushHistory();
    showToast('Холст отражён по горизонтали');
}
function flipCanvasVertical() {
    canvasState.layers.forEach(l => l.flipV = !l.flipV);
    redrawCanvas(); pushHistory();
    showToast('Холст отражён по вертикали');
}
function clearCanvas() {
    if (canvasState.layers.length === 0) return;
    if (!confirm('Очистить холст? Все слои будут удалены.')) return;
    canvasState.layers = [];
    renderLayers(); redrawCanvas(); pushHistory();
}

function toggleEraser() {
    canvasState.eraser = !canvasState.eraser;
    const btn = document.getElementById('eraserBtn');
    btn.textContent = `🧽 Ластик: ${canvasState.eraser ? 'ВКЛ' : 'ВЫКЛ'}`;
    btn.classList.toggle('btn-table', canvasState.eraser);
    document.getElementById('eraserSizeLabel').style.display = canvasState.eraser ? 'inline' : 'none';
    if (mainCanvas) mainCanvas.style.cursor = canvasState.eraser ? 'cell' : 'crosshair';
}

let isDrawingEraser = false;
let currentEraseLayerIdx = -1;

function attachCanvasEvents() {
    mainCanvas.addEventListener('mousedown', (e) => {
        if (!canvasState.eraser) return;
        if (canvasState.layers.length === 0) return;
        isDrawingEraser = true;
        currentEraseLayerIdx = canvasState.layers.length - 1;
        eraseAt(e, currentEraseLayerIdx);
    });
    mainCanvas.addEventListener('mousemove', (e) => {
        if (!isDrawingEraser) return;
        eraseAt(e, currentEraseLayerIdx);
    });
    mainCanvas.addEventListener('mouseup', () => {
        if (isDrawingEraser) { isDrawingEraser = false; pushHistory(); }
    });
    mainCanvas.addEventListener('mouseleave', () => {
        if (isDrawingEraser) { isDrawingEraser = false; pushHistory(); }
    });
}

function eraseAt(e, layerIdx) {
    const rect = mainCanvas.getBoundingClientRect();
    const canvasX = (e.clientX - rect.left) / rect.width * CANVAS_SIZE;
    const canvasY = (e.clientY - rect.top) / rect.height * CANVAS_SIZE;
    // Компенсируем zoom: чем меньше масштаб, тем больше реальный радиус
    const zoomCompensation = 1 / canvasState.zoom;
    const size = parseInt(document.getElementById('eraserSize').value) * zoomCompensation;
    canvasState.layers[layerIdx].eraseStrokes.push({
        x: canvasX, y: canvasY, r: size / 2
    });
    redrawCanvas();
}

// ИСПРАВЛЕНО: масштаб работает правильно, 100% = 4096px CSS
function setZoom(z, btn) {
    canvasState.zoom = z;
    // 25% = 1024, 50% = 2048, 100% = 4096, 200% = 8192
    const cssSize = CANVAS_SIZE * z;
    mainCanvas.style.width = cssSize + 'px';
    mainCanvas.style.height = cssSize + 'px';
    document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
}

function pushHistory() {
    canvasState.history = canvasState.history.slice(0, canvasState.historyIndex + 1);
    const snapshot = canvasState.layers.map(l => ({
        path: l.path, visible: l.visible, opacity: l.opacity,
        flipH: l.flipH, flipV: l.flipV,
        eraseStrokes: JSON.parse(JSON.stringify(l.eraseStrokes))
    }));
    canvasState.history.push(snapshot);
    canvasState.historyIndex = canvasState.history.length - 1;
    if (canvasState.history.length > 30) {
        canvasState.history.shift();
        canvasState.historyIndex--;
    }
    updateUndoRedoButtons();
}
function updateUndoRedoButtons() {
    const u = document.getElementById('undoBtn');
    const r = document.getElementById('redoBtn');
    if (u) u.disabled = canvasState.historyIndex <= 0;
    if (r) r.disabled = canvasState.historyIndex >= canvasState.history.length - 1;
}
function undoCanvas() {
    if (canvasState.historyIndex <= 0) return;
    canvasState.historyIndex--;
    restoreHistorySnapshot(canvasState.history[canvasState.historyIndex]);
    showToast('Отменено');
}
function redoCanvas() {
    if (canvasState.historyIndex >= canvasState.history.length - 1) return;
    canvasState.historyIndex++;
    restoreHistorySnapshot(canvasState.history[canvasState.historyIndex]);
    showToast('Повторено');
}
function restoreHistorySnapshot(snapshot) {
    snapshot.forEach((s, idx) => {
        if (canvasState.layers[idx]) {
            canvasState.layers[idx].visible = s.visible;
            canvasState.layers[idx].opacity = s.opacity;
            canvasState.layers[idx].flipH = s.flipH;
            canvasState.layers[idx].flipV = s.flipV;
            canvasState.layers[idx].eraseStrokes = JSON.parse(JSON.stringify(s.eraseStrokes));
        }
    });
    renderLayers(); redrawCanvas(); updateUndoRedoButtons();
}

function exportPNG() {
    if (canvasState.layers.length === 0) { showToast('Холст пуст!'); return; }
    redrawCanvas();
    mainCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `character_${Date.now()}_4096x4096_300dpi.png`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('PNG скачан');
    }, 'image/png');
}

function exportPSD() {
    if (canvasState.layers.length === 0) { showToast('Холст пуст!'); return; }
    if (typeof agPsd === 'undefined') { showToast('Библиотека PSD не загружена'); return; }
    try {
        const psdLayers = canvasState.layers.filter(l => l.visible).map(layer => {
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = CANVAS_SIZE;
            layerCanvas.height = CANVAS_SIZE;
            const lctx = layerCanvas.getContext('2d');
            const img = layer.image;
            const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (CANVAS_SIZE - w) / 2;
            const y = (CANVAS_SIZE - h) / 2;
            let drawX = x, drawY = y;
            let drawW = w, drawH = h;
            if (layer.flipH) { drawX = x + w; drawW = -w; }
            if (layer.flipV) { drawY = y + h; drawH = -h; }
            lctx.globalAlpha = layer.opacity;
            lctx.drawImage(img, drawX, drawY, drawW, drawH);
            if (layer.eraseStrokes.length > 0) {
                lctx.globalCompositeOperation = 'destination-out';
                layer.eraseStrokes.forEach(stroke => {
                    lctx.beginPath();
                    lctx.arc(stroke.x, stroke.y, stroke.r, 0, Math.PI * 2);
                    lctx.fill();
                });
                lctx.globalCompositeOperation = 'source-over';
            }
            return {
                name: `${layer.name} - ${layer.item}`.substring(0, 60),
                canvas: layerCanvas,
                opacity: layer.opacity
            };
        });
        const psd = { width: CANVAS_SIZE, height: CANVAS_SIZE, children: psdLayers };
        agPsd.writePsd(psd, (buffer) => {
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `character_${Date.now()}.psd`;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('PSD скачан');
        });
    } catch (e) {
        console.error(e);
        showToast('Ошибка PSD: ' + e.message);
    }
}

function initCanvasIfNeeded() {
    if (canvasInitialized) {
        redrawCanvas();
        renderLayers();
        return;
    }
    canvasInitialized = true;
    mainCanvas = document.getElementById('mainCanvas');
    ctx = mainCanvas.getContext('2d');
    mainCanvas.width = CANVAS_SIZE;
    mainCanvas.height = CANVAS_SIZE;
    attachCanvasEvents();
    setZoom(1, document.querySelector('.zoom-btn.active'));
    redrawCanvas();
    renderLayers();
    updateUndoRedoButtons();
}

window.onload = init;
</script>
