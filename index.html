<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор Персонажа</title>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@25.2.1/dist/bundle.js"></script>
<style>
:root {
    --bg: #1a1a2e;
    --container: #16213e;
    --accent: #e94560;
    --text: #fff;
    --secondary: #0f3460;
    --header: #0d1b2a;
    --appearance: #e94560;
    --clothes: #4a90d9;
    --race: #d9a441;
    --lists: #5cb85c;
    --rules: #9b59b6;
    --mods: #7b68ee;
    --table: #20b2aa;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 10px;
    display: flex; justify-content: center; min-height: 100vh;
}
.app {
    width: 100%; max-width: 1400px;
    background: var(--container);
    border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    height: fit-content;
}
.tabs { display: flex; background: var(--header); flex-wrap: wrap; }
.tab-btn {
    flex: 1; padding: 12px 6px; background: none; border: none;
    color: #888; font-size: 0.85rem; cursor: pointer; font-weight: bold;
    border-bottom: 3px solid transparent; transition: 0.3s;
    min-width: 70px;
}
.tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
    background: var(--container);
}
.tab-content { padding: 15px; display: none; }
.tab-content.active { display: block; }

/* Кнопки */
.btn-main {
    background: var(--accent); color: white; border: none;
    padding: 12px 24px; font-size: 0.9rem; border-radius: 8px;
    cursor: pointer; font-weight: bold; transition: 0.2s;
}
.btn-main:hover { background: #ff2e63; transform: scale(1.02); }
.btn-secondary {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 9px 16px;
    border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    transition: 0.2s;
}
.btn-secondary:hover { background: #1a4a7a; }
.btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-table {
    background: var(--table); color: white; border: none;
    padding: 9px 16px; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; transition: 0.2s; font-weight: bold;
}
.btn-table:hover { background: #1a9b95; }

/* ============ КОНСТРУКТОР ============ */
.builder-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 15px;
    align-items: start;
}
@media (max-width: 900px) {
    .builder-layout { grid-template-columns: 1fr; }
}

.builder-canvas-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: sticky;
    top: 10px;
}

.builder-toolbar {
    display: flex; gap: 6px; flex-wrap: wrap;
    align-items: center;
}

.canvas-frame {
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 50% / 20px 20px;
    border: 1px solid #333;
    border-radius: 10px;
    aspect-ratio: 1 / 1;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}
#mainCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    image-rendering: auto;
}

/* ============ ПАНЕЛЬ КАТЕГОРИЙ ============ */
.builder-panel {
    background: #0d1b2a;
    border-radius: 10px;
    padding: 10px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
}
.builder-panel h3 {
    margin: 0 0 10px 0; font-size: 1rem;
}

.cat-group {
    background: #1a1a2e;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
    border-left: 3px solid var(--accent);
}
.cat-group.group-appearance { border-left-color: var(--appearance); }
.cat-group.group-clothes { border-left-color: var(--clothes); }
.cat-group.group-race { border-left-color: var(--race); }
.cat-group.group-mods { border-left-color: var(--mods); }
.cat-group.group-lists { border-left-color: var(--lists); }

.cat-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    cursor: pointer; user-select: none;
    font-size: 0.85rem; font-weight: bold;
    background: rgba(255,255,255,0.02);
}
.cat-header:hover { background: rgba(255,255,255,0.05); }
.cat-header .counter { font-size: 0.7rem; color: #888; font-weight: normal; }

.cat-body {
    padding: 8px 10px;
    border-top: 1px solid #0d1b2a;
    display: none;
}
.cat-group.open .cat-body { display: block; }

/* Слот (модуль) */
.slot {
    background: #0d1b2a;
    border-radius: 6px;
    margin-bottom: 6px;
    overflow: hidden;
}
.slot-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 6px 10px;
    cursor: pointer; user-select: none;
    font-size: 0.78rem;
}
.slot-header:hover { background: rgba(255,255,255,0.03); }
.slot-name { font-weight: bold; color: #ccc; }
.slot-current {
    font-size: 0.68rem; color: var(--table);
    max-width: 130px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
.slot-body {
    padding: 6px 8px 8px;
    border-top: 1px solid #1a1a2e;
    display: none;
}
.slot.open .slot-body { display: block; }
.slot.open .slot-header .slot-current { display: none; }

/* Сетка плиток */
.tiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 5px;
}

.tile {
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 4px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-height: 70px;
    overflow: hidden;
}
.tile:hover {
    background: rgba(255,255,255,0.08);
    border-color: #555;
}
.tile.active {
    border-color: var(--table);
    background: rgba(32,178,170,0.1);
}
.tile.no-image {
    opacity: 0.7;
}
.tile-thumb {
    width: 100%;
    height: 50px;
    object-fit: contain;
    background: rgba(0,0,0,0.15);
    border-radius: 3px;
}
.tile-no-thumb {
    width: 100%;
    height: 50px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.15);
    border-radius: 3px;
    font-size: 1.5rem; color: #444;
}
.tile-text {
    font-size: 0.62rem;
    text-align: center;
    line-height: 1.1;
    color: #bbb;
    word-break: break-word;
    max-height: 22px;
    overflow: hidden;
    width: 100%;
}
.tile.active .tile-text { color: #fff; font-weight: bold; }

/* Кнопка убрать */
.tile-remove-row {
    margin-bottom: 6px;
    display: flex; gap: 6px;
}
.tile-remove-btn {
    background: rgba(233,69,96,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 0.7rem;
    cursor: pointer;
    transition: 0.2s;
}
.tile-remove-btn:hover {
    background: var(--accent); color: white;
}

/* ============ ОСТАЛЬНЫЕ ВКЛАДКИ (сокращённо) ============ */
.result-box {
    background: var(--secondary); padding: 15px;
    border-radius: 10px; margin-bottom: 15px;
    max-height: 500px; overflow-y: auto;
}
.result-line {
    display: flex; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.85rem; gap: 10px; align-items: center;
}
.result-line:last-child { border-bottom: none; }
.result-cat { color: #888; font-weight: bold; font-size: 0.78rem; }
.result-val { color: #fff; font-weight: bold; text-align: right; flex-grow: 1; }
.result-value-block {
    display: flex; align-items: center; gap: 8px;
    justify-content: flex-end; flex-grow: 1; flex-wrap: wrap;
}
.result-thumb {
    width: 36px; height: 36px; border-radius: 5px;
    object-fit: contain; cursor: pointer;
    border: 1px solid #333;
    background: rgba(0,0,0,0.2);
}
.result-thumbs { display: flex; gap: 4px; flex-wrap: wrap; }

.presets-bar {
    display: flex; gap: 6px; margin-bottom: 12px;
    flex-wrap: wrap; align-items: center;
}
.presets-bar span { font-size: 0.8rem; color: #888; }
.preset-btn {
    padding: 5px 10px; font-size: 0.75rem;
    border-radius: 15px; cursor: pointer;
    background: var(--secondary); color: white;
    border: 1px solid #555;
}
.preset-btn:hover { background: var(--accent); border-color: var(--accent); }
.counter-badge {
    font-size: 0.72rem; color: #888; margin-left: auto;
    padding: 3px 8px; background: rgba(0,0,0,0.3); border-radius: 10px;
}

.history-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.search-input {
    flex-grow: 1; padding: 8px; border-radius: 5px;
    border: 1px solid #333; background: #0d1b2a; color: white;
    font-size: 0.85rem;
}
.history-list { display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
.history-item {
    background: #0d1b2a; padding: 10px 12px;
    border-radius: 8px; border-left: 4px solid var(--secondary);
}
.history-item.fav { border-left-color: gold; }
.history-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 5px;
}
.history-date { font-size: 0.7rem; color: #888; }
.history-details { font-size: 0.8rem; color: #ccc; line-height: 1.4; }
.history-actions { display: flex; gap: 3px; }
.icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1rem; padding: 3px; opacity: 0.6;
    color: white; transition: 0.2s;
}
.icon-btn:hover { opacity: 1; transform: scale(1.1); }
.icon-btn.fav-active { opacity: 1; color: gold; }

.list-block {
    background: #0d1b2a; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
    border-left: 3px solid var(--lists);
}
.list-block.disabled { opacity: 0.5; }
.list-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 12px;
    background: var(--header); cursor: pointer; user-select: none;
}
.list-header h3 { margin: 0; font-size: 0.95rem; }
.list-counter { font-size: 0.7rem; color: #888; }
.list-controls { display: flex; gap: 6px; align-items: center; }
.list-body { padding: 10px 12px; display: none; }
.list-block.open .list-body { display: block; }

.add-row { display: flex; gap: 4px; margin-bottom: 8px; }
.add-row input {
    flex-grow: 1; padding: 5px 8px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.8rem;
}
.add-row button {
    padding: 5px 10px; background: var(--accent);
    color: white; border: none; border-radius: 5px;
    cursor: pointer; font-size: 0.8rem;
}
.add-row button.import-btn { background: var(--clothes); }

.item-list { max-height: 300px; overflow-y: auto; }
.item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 0; border-bottom: 1px solid #1a1a2e;
    font-size: 0.82rem;
}
.item.disabled { opacity: 0.4; text-decoration: line-through; }
.item-text { flex-grow: 1; cursor: pointer; padding: 3px; border-radius: 3px; word-break: break-word; }
.item-text:hover { background: rgba(255,255,255,0.1); }
.item input[type="text"] {
    flex-grow: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); background: #1a1a2e;
    color: white; font-size: 0.82rem;
}
.item input[type="checkbox"] {
    cursor: pointer; width: 14px; height: 14px;
    accent-color: var(--accent); flex-shrink: 0;
}
.item-thumb {
    width: 30px; height: 30px; border-radius: 4px;
    object-fit: contain; cursor: pointer;
    border: 1px solid #333; flex-shrink: 0;
    background: rgba(0,0,0,0.2);
}
.item-thumb-placeholder {
    width: 30px; height: 30px; border-radius: 4px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.75rem; color: #555;
    border: 1px dashed #333; flex-shrink: 0;
}
.item-thumb-placeholder:hover { color: var(--accent); border-color: var(--accent); }

.group-title {
    font-size: 0.95rem; font-weight: bold;
    padding: 10px 12px; margin-top: 12px;
    border-radius: 8px; color: white;
    cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
}
.group-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.group-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.group-race { background: linear-gradient(90deg, var(--race), transparent); }
.group-mods { background: linear-gradient(90deg, var(--mods), transparent); }
.group-body { padding-left: 6px; }
.group-body.collapsed { display: none; }

.module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 6px; overflow: hidden;
    border-left: 3px solid var(--accent);
}
.module.disabled { opacity: 0.5; }
.module-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    background: var(--header); cursor: pointer; user-select: none;
}
.module-header h4 { margin: 0; font-size: 0.85rem; }
.module-counter { font-size: 0.68rem; color: #888; }
.module-controls { display: flex; gap: 6px; align-items: center; }
.module-body { padding: 8px 12px 12px; display: none; }
.module.open .module-body { display: block; }
.module-toggle {
    background: none; border: none; color: white;
    font-size: 0.9rem; cursor: pointer; padding: 3px; transition: 0.2s;
}
.module.open .module-toggle { transform: rotate(180deg); }

.subcat {
    background: #1a1a2e; border-radius: 6px;
    margin-top: 5px; overflow: hidden;
    border-left: 2px solid var(--secondary);
}
.subcat.disabled { opacity: 0.4; }
.subcat-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 7px 10px;
    cursor: pointer; user-select: none; font-size: 0.8rem;
}
.subcat-header:hover { background: rgba(255,255,255,0.03); }
.subcat-name { font-weight: bold; }
.subcat-counter { font-size: 0.68rem; color: #888; margin-left: 6px; }
.subcat-controls { display: flex; gap: 4px; align-items: center; }
.subcat-body {
    padding: 6px 10px 10px;
    border-top: 1px solid #0d1b2a;
    display: none;
}
.subcat.open .subcat-body { display: block; }
.subcat-toggle {
    background: none; border: none; color: white;
    font-size: 0.75rem; cursor: pointer; padding: 3px; transition: 0.2s;
}
.subcat.open .subcat-toggle { transform: rotate(180deg); }

.simple-module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 6px; overflow: hidden;
    border-left: 3px solid var(--mods);
}
.simple-module.disabled { opacity: 0.5; }
.simple-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    background: var(--header); cursor: pointer; user-select: none;
}
.simple-header h4 { margin: 0; font-size: 0.85rem; }
.simple-body { padding: 8px 12px 12px; display: none; }
.simple-module.open .simple-body { display: block; }

/* Правила */
.rule-card {
    background: #0d1b2a; border-radius: 8px;
    margin-bottom: 8px; overflow: hidden;
    border-left: 3px solid var(--rules);
}
.rule-card.disabled { opacity: 0.5; }
.rule-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    background: var(--header);
}
.rule-header .rule-type {
    font-size: 0.68rem; padding: 2px 8px; border-radius: 10px;
    background: var(--rules); color: white; font-weight: bold;
    text-transform: uppercase;
}
.rule-type-replace { background: var(--clothes); }
.rule-type-exclude { background: var(--accent); }
.rule-type-add { background: var(--race); color: #1a1a2e; }
.rule-body { padding: 10px 12px; font-size: 0.82rem; line-height: 1.5; }
.rule-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.rule-row label { font-size: 0.78rem; color: #888; min-width: 90px; }
.rule-row select, .rule-row input[type="text"] {
    flex-grow: 1; padding: 5px 8px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.82rem; min-width: 110px;
}
.rule-row .arrow { color: var(--rules); font-weight: bold; }
.condition-block {
    background: #1a1a2e; padding: 8px; border-radius: 6px;
    margin-bottom: 6px; border-left: 2px solid var(--rules);
}
.condition-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 0.78rem; color: var(--rules); font-weight: bold;
}
.condition-header button {
    background: none; border: none; color: var(--accent);
    cursor: pointer; font-size: 1rem;
}
.add-rule-form {
    background: #0d1b2a; padding: 12px;
    border-radius: 8px; border: 1px dashed var(--rules);
    margin-bottom: 12px;
}
.empty-state {
    text-align: center; color: #666; padding: 25px; font-size: 0.85rem;
}
.chain-badge {
    font-size: 0.62rem; padding: 2px 6px; border-radius: 8px;
    background: var(--race); color: #1a1a2e; font-weight: bold;
    margin-left: 6px;
}

/* Таблица */
.table-section { margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #0d1b2a; }
.table-section-header { padding: 8px 12px; font-weight: bold; font-size: 0.85rem; }
.table-section-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.table-section-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.table-section-race { background: linear-gradient(90deg, var(--race), transparent); }
.table-section-lists { background: linear-gradient(90deg, var(--lists), transparent); }
.table-grid { width: 100%; border-collapse: collapse; background: #0d1b2a; }
.table-grid th {
    background: var(--header); padding: 6px 10px; text-align: left;
    font-size: 0.72rem; color: #888; text-transform: uppercase;
}
.table-grid td { padding: 5px 10px; border-top: 1px solid #1a1a2e; font-size: 0.82rem; }
.table-grid td.slot-name { color: #ccc; font-weight: bold; width: 30%; }
.table-cell-input {
    width: 100%; padding: 5px 8px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.82rem;
}
.table-cell-input:focus { outline: none; border-color: var(--table); }
.table-cell-row { display: flex; align-items: center; gap: 6px; }
.table-cell-thumb {
    width: 28px; height: 28px; border-radius: 4px;
    object-fit: contain; cursor: pointer;
    border: 1px solid var(--table); background: rgba(0,0,0,0.2);
}

.table-toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

/* Модалки */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: none; justify-content: center; align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--container); padding: 20px;
    border-radius: 12px; max-width: 500px; width: 100%;
    max-height: 85vh; overflow-y: auto;
}
.modal h3 { margin-top: 0; }
.modal textarea {
    width: 100%; height: 180px; padding: 8px;
    background: #0d1b2a; color: white;
    border: 1px solid #333; border-radius: 8px;
    font-family: inherit; font-size: 0.85rem; resize: vertical;
}
.modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
.image-viewer-modal {
    max-width: 90vw; max-height: 90vh;
    background: transparent; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.image-viewer-modal img {
    max-width: 100%; max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    background: repeating-conic-gradient(#2a2a3e 0% 25%, #1a1a2e 0% 50%) 50% / 20px 20px;
}

.toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #333;
    color: white; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
    font-size: 0.85rem;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('builder', this)">🎨 Конструктор</button>
        <button class="tab-btn" onclick="switchTab('gen', this)">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('hist', this)">📜 История</button>
        <button class="tab-btn" onclick="switchTab('lists', this)">📋 Списки</button>
        <button class="tab-btn" onclick="switchTab('mod', this)">⚙️ Модули</button>
        <button class="tab-btn" onclick="switchTab('rules', this)">🔗 Правила</button>
    </div>

    <!-- ================== КОНСТРУКТОР ================== -->

    outfit: {}
};

// ============================================================
// INIT
// ============================================================
function init() {
    const savedLists = localStorage.getItem('cg_lists_v7');
    const savedMods = localStorage.getItem('cg_modifiers_v6');
    const savedModules = localStorage.getItem('cg_modules_v7');
    const savedRules = localStorage.getItem('cg_rules_v6');
    const savedHist = localStorage.getItem('cg_history_v6');
    const savedCount = localStorage.getItem('cg_gen_count_v6');
    const savedTable = localStorage.getItem('cg_table_v4');
    const savedOutfit = localStorage.getItem('cg_outfit');

    state.lists = savedLists ? JSON.parse(savedLists) : null;
    state.modifiers = savedMods ? JSON.parse(savedMods) : null;
    state.modules = savedModules ? JSON.parse(savedModules) : null;
    state.rules = savedRules ? JSON.parse(savedRules) : [];
    state.history = savedHist ? JSON.parse(savedHist) : [];
    state.genCount = savedCount ? parseInt(savedCount) : 0;
    state.table = savedTable ? JSON.parse(savedTable) : {};
    state.outfit = savedOutfit ? JSON.parse(savedOutfit) : {};

    if (!state.lists || !isValidListStructure(state.lists)) state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    if (!state.modifiers) state.modifiers = JSON.parse(JSON.stringify(DEFAULT_MODIFIERS));
    if (!state.modules || !isValidModuleStructure(state.modules)) state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    sanitizeData();
    save();
    renderLists();
    renderModules();
    renderRules();
    renderHistory();
    renderTable();
    populateRuleSelects();
    updateCounter();
    // Инициализируем конструктор сразу
    renderBuilder();
    initCanvasIfNeeded();
}

function isValidListStructure(lists) {
    for (const key in lists) {
        const list = lists[key];
        if (!list || !Array.isArray(list.items)) return false;
        if (!list.items.some(i => i && typeof i.text === 'string' && i.text.length > 0)) return false;
    }
    return true;
}
function isValidModuleStructure(modules) {
    for (const gKey in modules) {
        const group = modules[gKey];
        if (!group.modules) return false;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) return false;
            for (const sKey in mod.subcategories) {
                if (!Array.isArray(mod.subcategories[sKey].items)) return false;
            }
        }
    }
    return true;
}
function sanitizeData() {
    for (const key in state.lists) {
        const list = state.lists[key];
        if (!Array.isArray(list.items)) { list.items = []; continue; }
        list.items = list.items.map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
        if (list.enabled === undefined) list.enabled = true;
        if (list.expanded === undefined) list.expanded = true;
    }
    if (state.modifiers) {
        state.modifiers.items = (state.modifiers.items || []).map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        if (!group.modules) group.modules = {};
        if (group.expanded === undefined) group.expanded = true;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) mod.subcategories = {};
            if (mod.enabled === undefined) mod.enabled = true;
            if (mod.expanded === undefined) mod.expanded = false;
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!Array.isArray(sub.items)) { sub.items = []; continue; }
                sub.items = sub.items.map(i => {
                    if (typeof i === 'string') return { text: i, enabled: true, image: null };
                    if (i && typeof i === 'object' && typeof i.text === 'string') {
                        if (i.image === undefined) i.image = null;
                        return i;
                    }
                    return null;
                }).filter(i => i && i.text.trim().length > 0);
                if (sub.enabled === undefined) sub.enabled = true;
                if (sub.expanded === undefined) sub.expanded = false;
            }
        }
    }
}
function save() {
    try {
        localStorage.setItem('cg_lists_v7', JSON.stringify(state.lists));
        localStorage.setItem('cg_modifiers_v6', JSON.stringify(state.modifiers));
        localStorage.setItem('cg_modules_v7', JSON.stringify(state.modules));
        localStorage.setItem('cg_rules_v6', JSON.stringify(state.rules));
        localStorage.setItem('cg_history_v6', JSON.stringify(state.history));
        localStorage.setItem('cg_gen_count_v6', state.genCount.toString());
        localStorage.setItem('cg_table_v4', JSON.stringify(state.table));
        localStorage.setItem('cg_outfit', JSON.stringify(state.outfit));
    } catch (e) {
        if (e.name === 'QuotaExceededError') showToast('⚠️ Память переполнена!');
    }
}
function updateCounter() {
    const el = document.getElementById('genCounter');

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    btn.classList.add('active');
    if (name === 'hist') renderHistory();
    if (name === 'rules') { populateRuleSelects(); renderRules(); }
    if (name === 'lists') renderLists();
    if (name === 'mod') renderModules();
    if (name === 'builder') {
        renderBuilder();
        setTimeout(() => { initCanvasIfNeeded(); redrawCanvas(); }, 50);
    }
}

function renderBuilder() {
    const container = document.getElementById('builderCategories');
    if (!container) return;
    container.innerHTML = '';

    // Списки (Расы, Стили) как отдельные группы
    const listsGroup = document.createElement('div');
    listsGroup.className = 'cat-group group-lists';
    listsGroup.innerHTML = `
        <div class="cat-header">
            <span>📋 Списки</span>
            <span class="counter">▼</span>
        </div>
    `;
    const listsBody = document.createElement('div');
    listsBody.className = 'cat-body';
    // Расы
    listsBody.appendChild(createBuilderSlot('list.races', state.lists.races.name, state.lists.races.items));
    // Стили
    listsBody.appendChild(createBuilderSlot('list.styles', state.lists.styles.name, state.lists.styles.items));
    listsGroup.appendChild(listsBody);
    listsGroup.querySelector('.cat-header').onclick = () => listsGroup.classList.toggle('open');
    listsGroup.classList.add('open');
    container.appendChild(listsGroup);

    // Модули: группируем по группам
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        const groupDiv = document.createElement('div');
        groupDiv.className = 'cat-group ' + (group.groupClass || '');
        groupDiv.innerHTML = `
            <div class="cat-header">
                <span>${group.name}</span>
                <span class="counter">▼</span>
            </div>
        `;
        const groupBody = document.createElement('div');
        groupBody.className = 'cat-body';
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            groupBody.appendChild(createBuilderSlot(`${gKey}.${mKey}`, mod.name, collectAllItemsForModule(gKey, mKey)));
        }
        groupDiv.appendChild(groupBody);
        groupDiv.querySelector('.cat-header').onclick = () => groupDiv.classList.toggle('open');
        groupDiv.classList.add('open');
        container.appendChild(groupDiv);
    }

    // Модификаторы
    const modsGroup = document.createElement('div');
    modsGroup.className = 'cat-group group-mods';
    modsGroup.innerHTML = `
        <div class="cat-header">
            <span>✨ ${state.modifiers.name}</span>
            <span class="counter">▼</span>
        </div>
    `;
    const modsBody = document.createElement('div');
    modsBody.className = 'cat-body';
    modsBody.appendChild(createBuilderSlot('modifiers', state.modifiers.name, state.modifiers.items));
    modsGroup.appendChild(modsBody);
    modsGroup.querySelector('.cat-header').onclick = () => modsGroup.classList.toggle('open');
    modsGroup.classList.add('open');
    container.appendChild(modsGroup);
}

function collectAllItemsForModule(gKey, mKey) {
    const all = [];
    if (!state.modules[gKey] || !state.modules[gKey].modules[mKey]) return all;
    const mod = state.modules[gKey].modules[mKey];
    for (const sKey in mod.subcategories) {
        all.push(...mod.subcategories[sKey].items.filter(i => i.enabled));
    }
    return all;
}

function createBuilderSlot(path, name, items) {
    const slot = document.createElement('div');
    slot.className = 'slot';

    const currentItem = state.outfit[path];
    const currentText = currentItem ? currentItem.text : '—';
    const enabledItems = items.filter(i => i.enabled);

    slot.innerHTML = `
        <div class="slot-header">
            <span class="slot-name">${name}</span>
            <span class="slot-current">${currentText}</span>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'slot-body';

    // Кнопка убрать
    const removeRow = document.createElement('div');
    removeRow.className = 'tile-remove-row';
    const removeBtn = document.createElement('button');
    removeBtn.className = 'tile-remove-btn';
    removeBtn.textContent = '🚫 Убрать слой';
    removeBtn.onclick = (e) => { e.stopPropagation(); removeFromOutfit(path); };
    removeRow.appendChild(removeBtn);
    body.appendChild(removeRow);

    // Сетка плиток
    const grid = document.createElement('div');
    grid.className = 'tiles-grid';

    enabledItems.forEach(item => {
        const tile = document.createElement('div');
        const isActive = state.outfit[path] && state.outfit[path].text === item.text;
        tile.className = 'tile' + (isActive ? ' active' : '') + (item.image ? '' : ' no-image');
        tile.title = item.text;

        if (item.image) {
            const img = document.createElement('img');
            img.className = 'tile-thumb';
            img.src = item.image;
            img.alt = item.text;
            tile.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'tile-no-thumb';
            ph.textContent = '🖼️';
            tile.appendChild(ph);
        }
        const txt = document.createElement('div');
        txt.className = 'tile-text';
        txt.textContent = item.text;
        tile.appendChild(txt);

        tile.onclick = () => selectForOutfit(path, item);
        grid.appendChild(tile);
    });

    body.appendChild(grid);
    slot.appendChild(body);

    // Заголовок — раскрытие
    slot.querySelector('.slot-header').onclick = () => slot.classList.toggle('open');

    return slot;
}

// ============================================================
// КОНСТРУКТОР — выбор слоя
// ============================================================
async function selectForOutfit(path, item) {
    // Обновляем outfit
    if (state.outfit[path] && state.outfit[path].text === item.text) {
        // Тот же — убираем
        delete state.outfit[path];
    } else {
        state.outfit[path] = item;
    }
    save();
    // Обновляем UI плиток
    renderBuilder();
    // Обновляем холст
    await rebuildCanvasFromOutfit();
}

async function removeFromOutfit(path) {
    delete state.outfit[path];
    save();
    renderBuilder();
    await rebuildCanvasFromOutfit();
}

async function randomizeAll() {
    // Проходим по всем слотам и выбираем случайное
    // Списки
    if (state.lists.races.enabled) {
        const active = state.lists.races.items.filter(i => i.enabled);
        if (active.length) state.outfit['list.races'] = active[Math.floor(Math.random() * active.length)];
    }
    if (state.lists.styles.enabled) {
        const active = state.lists.styles.items.filter(i => i.enabled);
        if (active.length) state.outfit['list.styles'] = active[Math.floor(Math.random() * active.length)];
    }
    // Модули
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const path = `${gKey}.${mKey}`;
            // Собираем активные items из всех подкатегорий
            const all = [];
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!sub.enabled) continue;
                all.push(...sub.items.filter(i => i.enabled && i.text !== 'Отсутствует' && i.text !== 'None'));
            }
            if (all.length) {
                state.outfit[path] = all[Math.floor(Math.random() * all.length)];
            }
        }
    }
    // Модификатор
    if (state.modifiers && state.modifiers.enabled) {
        const active = state.modifiers.items.filter(i => i.enabled);
        if (active.length) state.outfit['modifiers'] = active[Math.floor(Math.random() * active.length)];
    }
    save();
    renderBuilder();
    await rebuildCanvasFromOutfit();
    showToast('🎲 Рандомизация');
}

function clearCanvas() {
    if (!confirm('Очистить холст?')) return;
    state.outfit = {};
    save();
    renderBuilder();
    rebuildCanvasFromOutfit();
    pushHistory();
}

// ============================================================
// ХОЛСТ — построение из outfit
// ============================================================
const CANVAS_SIZE = 4096;

let canvasState = {
    layers: [],
    zoom: 1,
    eraser: false,
    history: [],
    historyIndex: -1
};

let mainCanvas = null;
let ctx = null;
let canvasInitialized = false;

const LAYER_ORDER = {
    'list.races': 1, 'list.styles': 2,
    'race.trait1': 3, 'race.trait2': 4, 'race.trait3': 5,
    'race.trait4': 6, 'race.trait5': 7, 'race.trait6': 8, 'race.trait7': 9,
    'appearance.bangs': 10, 'appearance.sidelocks': 11,
    'appearance.backHair': 12, 'appearance.addHair': 13,
    'appearance.eyeShape': 14, 'appearance.skinColor': 15,
    'clothes.bottomwear': 20, 'clothes.legwear': 21,
    'clothes.topwear1': 22, 'clothes.handwear': 23,
    'clothes.neckwear': 24, 'clothes.headwear': 25,
    'clothes.acc1': 30, 'clothes.acc2': 31, 'clothes.acc3': 32,
    'clothes.acc4': 33, 'clothes.acc5': 34,
    'modifiers': 40
};

function loadImage(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
    });
}

async function rebuildCanvasFromOutfit() {
    if (!canvasInitialized) initCanvasIfNeeded();

    // Собираем массив слоёв из state.outfit (только те, у которых есть картинка)
    const newLayers = [];
    for (const path in state.outfit) {
        const item = state.outfit[path];
        if (!item || !item.image) continue;
        try {
            const img = await loadImage(item.image);
            newLayers.push({
                path: path,
                name: getPathName(path),
                item: item.text,
                image: img,
                visible: true,
                opacity: 1,
                flipH: false,
                flipV: false,
                eraseStrokes: []
            });
        } catch (e) {
            console.warn('Не удалось загрузить', path);
        }
    }
    // Сортируем по LAYER_ORDER
    newLayers.sort((a, b) => (LAYER_ORDER[a.path] || 100) - (LAYER_ORDER[b.path] || 100));
    canvasState.layers = newLayers;
    renderLayers();
    redrawCanvas();
    pushHistory();
}

function redrawCanvas() {
    if (!ctx) return;
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    canvasState.layers.forEach(layer => {
        if (!layer.visible) return;
        drawLayer(layer);
    });
}

function drawLayer(layer) {
    const img = layer.image;
    if (!img) return;
    const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
    const w = img.width * scale;
    const h = img.height * scale;
    const x = (CANVAS_SIZE - w) / 2;
    const y = (CANVAS_SIZE - h) / 2;
    ctx.save();
    ctx.globalAlpha = layer.opacity;
    let drawX = x, drawY = y;
    let drawW = w, drawH = h;
    if (layer.flipH) { drawX = x + w; drawW = -w; }
    if (layer.flipV) { drawY = y + h; drawH = -h; }
    ctx.drawImage(img, drawX, drawY, drawW, drawH);
    if (layer.eraseStrokes.length > 0) {
        ctx.globalCompositeOperation = 'destination-out';
        layer.eraseStrokes.forEach(stroke => {
            ctx.beginPath();
            ctx.arc(stroke.x, stroke.y, stroke.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
}

function renderLayers() {
    // В конструкторе панель слоёв не показываем — только холст.
    // Функция оставлена для совместимости, ничего не рисует.
}

function getPathName(path) {
    if (path === 'modifiers') return state.modifiers.name;
    if (path.startsWith('list.')) {
        const k = path.split('.')[1];
        return state.lists[k] ? state.lists[k].name : path;
    }
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return path;
    return state.modules[g].modules[m].name;
}
function getItemsByPath(path) {
    if (path === 'modifiers') return state.modifiers.items;
    if (path.startsWith('list.')) {
        const k = path.split('.')[1];
        return state.lists[k] ? state.lists[k].items : [];
    }
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    const all = [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all;
}

// ============================================================
// ЛАСТИК
// ============================================================
let isDrawingEraser = false;
let currentEraseLayerIdx = -1;

function toggleEraser() {
    canvasState.eraser = !canvasState.eraser;
    const btn = document.getElementById('eraserBtn');
    btn.textContent = canvasState.eraser ? '🧽 ВКЛ' : '🧽';
    btn.classList.toggle('btn-table', canvasState.eraser);
    document.getElementById('eraserSizeLabel').style.display = canvasState.eraser ? 'inline-flex' : 'none';
    if (mainCanvas) mainCanvas.style.cursor = canvasState.eraser ? 'cell' : 'crosshair';
}

function attachCanvasEvents() {
    mainCanvas.addEventListener('mousedown', (e) => {
        if (!canvasState.eraser) return;
        if (canvasState.layers.length === 0) return;
        isDrawingEraser = true;
        currentEraseLayerIdx = canvasState.layers.length - 1;
        eraseAt(e, currentEraseLayerIdx);
    });
    mainCanvas.addEventListener('mousemove', (e) => {
        if (!isDrawingEraser) return;
        eraseAt(e, currentEraseLayerIdx);
    });
    mainCanvas.addEventListener('mouseup', () => {
        if (isDrawingEraser) { isDrawingEraser = false; pushHistory(); }
    });
    mainCanvas.addEventListener('mouseleave', () => {
        if (isDrawingEraser) { isDrawingEraser = false; pushHistory(); }
    });
}

function eraseAt(e, layerIdx) {
    const rect = mainCanvas.getBoundingClientRect();
    const canvasX = (e.clientX - rect.left) / rect.width * CANVAS_SIZE;
    const canvasY = (e.clientY - rect.top) / rect.height * CANVAS_SIZE;
    const size = parseInt(document.getElementById('eraserSize').value);
    canvasState.layers[layerIdx].eraseStrokes.push({
        x: canvasX, y: canvasY, r: size / 2
    });
    redrawCanvas();
}

// ============================================================
// ИСТОРИЯ (undo/redo)
// ============================================================
function pushHistory() {
    canvasState.history = canvasState.history.slice(0, canvasState.historyIndex + 1);
    const snapshot = canvasState.layers.map(l => ({
        path: l.path, item: l.item, image: l.image.src,
        visible: l.visible, opacity: l.opacity,
        flipH: l.flipH, flipV: l.flipV,
        eraseStrokes: JSON.parse(JSON.stringify(l.eraseStrokes))
    }));
    canvasState.history.push(snapshot);
    canvasState.historyIndex = canvasState.history.length - 1;
    if (canvasState.history.length > 30) {
        canvasState.history.shift();
        canvasState.historyIndex--;
    }
    updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
    const u = document.getElementById('undoBtn');
    const r = document.getElementById('redoBtn');
    if (u) u.disabled = canvasState.historyIndex <= 0;
    if (r) r.disabled = canvasState.historyIndex >= canvasState.history.length - 1;
}

async function undoCanvas() {
    if (canvasState.historyIndex <= 0) return;
    canvasState.historyIndex--;
    await restoreHistorySnapshot(canvasState.history[canvasState.historyIndex]);
    showToast('Отменено');
}
async function redoCanvas() {
    if (canvasState.historyIndex >= canvasState.history.length - 1) return;
    canvasState.historyIndex++;
    await restoreHistorySnapshot(canvasState.history[canvasState.historyIndex]);
    showToast('Повторено');
}
async function restoreHistorySnapshot(snapshot) {
    const newLayers = [];
    for (const s of snapshot) {
        try {
            const img = await loadImage(s.image);
            newLayers.push({
                path: s.path, name: getPathName(s.path), item: s.item,
                image: img,
                visible: s.visible, opacity: s.opacity,
                flipH: s.flipH, flipV: s.flipV,
                eraseStrokes: JSON.parse(JSON.stringify(s.eraseStrokes))
            });
        } catch (e) {}
    }
    canvasState.layers = newLayers;
    redrawCanvas();
    updateUndoRedoButtons();
}

// ============================================================
// ЭКСПОРТ
// ============================================================
function exportPNG() {
    if (canvasState.layers.length === 0) { showToast('Холст пуст!'); return; }
    redrawCanvas();
    mainCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `character_${Date.now()}_4096x4096.png`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('PNG скачан');
    }, 'image/png');
}

function exportPSD() {
    if (canvasState.layers.length === 0) { showToast('Холст пуст!'); return; }
    if (typeof agPsd === 'undefined') { showToast('Библиотека PSD не загружена'); return; }
    try {
        const psdLayers = canvasState.layers.filter(l => l.visible).map(layer => {
            const layerCanvas = document.createElement('canvas');
            layerCanvas.width = CANVAS_SIZE;
            layerCanvas.height = CANVAS_SIZE;
            const lctx = layerCanvas.getContext('2d');
            const img = layer.image;
            const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (CANVAS_SIZE - w) / 2;
            const y = (CANVAS_SIZE - h) / 2;
            let drawX = x, drawY = y;
            let drawW = w, drawH = h;
            if (layer.flipH) { drawX = x + w; drawW = -w; }
            if (layer.flipV) { drawY = y + h; drawH = -h; }
            lctx.globalAlpha = layer.opacity;
            lctx.drawImage(img, drawX, drawY, drawW, drawH);
            if (layer.eraseStrokes.length > 0) {
                lctx.globalCompositeOperation = 'destination-out';
                layer.eraseStrokes.forEach(stroke => {
                    lctx.beginPath();
                    lctx.arc(stroke.x, stroke.y, stroke.r, 0, Math.PI * 2);
                    lctx.fill();
                });
                lctx.globalCompositeOperation = 'source-over';
            }
            return {
                name: `${layer.name} - ${layer.item}`.substring(0, 60),
                canvas: layerCanvas,
                opacity: layer.opacity
            };
        });
        const psd = { width: CANVAS_SIZE, height: CANVAS_SIZE, children: psdLayers };
        agPsd.writePsd(psd, (buffer) => {
            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `character_${Date.now()}.psd`;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('PSD скачан');
        });
    } catch (e) {
        console.error(e);
        showToast('Ошибка PSD: ' + e.message);
    }
}

function saveOutfit() {
    const data = JSON.stringify({ version: 1, outfit: state.outfit }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `outfit_${Date.now()}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Образ сохранён');
}

function loadOutfitFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.outfit) throw new Error('Неверный формат');
            state.outfit = data.outfit;
            save();
            renderBuilder();
            rebuildCanvasFromOutfit();
            showToast('Образ загружен');
        } catch (err) {
            alert('Ошибка: ' + err.message);
        }
        event.target.value = '';
    };
    reader.readAsText(file);
}

function initCanvasIfNeeded() {
    if (canvasInitialized) return;
    canvasInitialized = true;
    mainCanvas = document.getElementById('mainCanvas');
    ctx = mainCanvas.getContext('2d');
    mainCanvas.width = CANVAS_SIZE;
    mainCanvas.height = CANVAS_SIZE;
    attachCanvasEvents();
    redrawCanvas();
    renderLayers();
    updateUndoRedoButtons();
}

// ============================================================
// ГЕНЕРАЦИЯ (оставлена)
// ============================================================
function randItem(items) {
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}
function randItemExcluding(items, excludeList) {
    const excludeLower = excludeList.map(s => s.toLowerCase());
    const active = items.filter(i => i.enabled && i.text && !excludeLower.includes(i.text.toLowerCase()) && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}

function generate() {
    const result = {};
    const resultItems = {};
    const paths = [];
    const extraTexts = [];

    if (state.lists.races.enabled) {
        const item = randItem(state.lists.races.items);
        if (item) { result['list.races'] = item.text; resultItems['list.races'] = [item]; paths.push('list.races'); }
    }
    if (state.lists.styles.enabled) {
        const item = randItem(state.lists.styles.items);
        if (item) { result['list.styles'] = item.text; resultItems['list.styles'] = [item]; paths.push('list.styles'); }
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const slotItems = [];
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!sub.enabled) continue;
                const item = randItem(sub.items);
                if (item) slotItems.push(item);
            }
            if (slotItems.length > 0) {
                const path = `${gKey}.${mKey}`;
                result[path] = slotItems.map(i => i.text).join(', ');
                resultItems[path] = slotItems;
                paths.push(path);
            }
        }
    }
    if (state.modifiers && state.modifiers.enabled) {
        const modItem = randItem(state.modifiers.items);
        if (modItem) {
            const clothesSlots = ['clothes.headwear', 'clothes.neckwear', 'clothes.topwear1', 'clothes.bottomwear', 'clothes.legwear', 'clothes.footwear'];
            const available = clothesSlots.filter(s => result[s]);
            if (available.length > 0) {
                const target = available[Math.floor(Math.random() * available.length)];
                result[target] = `${modItem.text} ${result[target]}`;
                if (resultItems[target]) resultItems[target].unshift(modItem);
            }
        }
    }

    const activeRules = state.rules.filter(r => r.enabled);
    activeRules.filter(r => r.type === 'replace').forEach(rule => {
        if (checkConditions(rule, result)) {
            const actPath = rule.action.path;
            const actVal = rule.action.value;
            if (actPath) {
                result[actPath] = actVal;
                if (!paths.includes(actPath)) paths.push(actPath);
                const items = getItemsByPath(actPath);
                const found = items.find(i => i.text === actVal);
                resultItems[actPath] = found ? [found] : [];
            }
        }
    });
    activeRules.filter(r => r.type === 'exclude').forEach(rule => {
        if (checkConditions(rule, result)) {
            const exclPath = rule.action.path;
            const exclValues = rule.action.values || [];
            if (!exclPath) return;
            if (exclPath.startsWith('list.')) {
                const listKey = exclPath.split('.')[1];
                const item = randItemExcluding(state.lists[listKey].items, exclValues);
                if (item) { result[exclPath] = item.text; resultItems[exclPath] = [item]; }
            } else {
                const [gKey, mKey] = exclPath.split('.');
                const mod = state.modules[gKey] && state.modules[gKey].modules[mKey];
                if (!mod || !mod.enabled) return;
                const slotItems = [];
                for (const sKey in mod.subcategories) {
                    const sub = mod.subcategories[sKey];
                    if (!sub.enabled) continue;
                    const item = randItemExcluding(sub.items, exclValues);
                    if (item) slotItems.push(item);
                }
                if (slotItems.length > 0) {
                    result[exclPath] = slotItems.map(i => i.text).join(', ');
                    resultItems[exclPath] = slotItems;
                }
            }
        }
    });
    activeRules.filter(r => r.type === 'add').forEach(rule => {
        if (checkConditions(rule, result)) {
            if (rule.action.text) extraTexts.push(rule.action.text);
        }
    });

    if (paths.length === 0) { showToast("Все списки и модули отключены!"); return; }

    state.current = result;
    state.currentPaths = paths;
    state.currentItems = resultItems;
    state.extraText = extraTexts.join(', ');
    state.genCount++;
    save();
    updateCounter();
    renderResult(result, paths, extraTexts, resultItems);
    addHistory(result, paths, extraTexts, resultItems);
}

function checkConditions(rule, result) {
    if (!rule.conditions || rule.conditions.length === 0) return false;
    for (const cond of rule.conditions) {
        if (!matchesCondition(result, cond.path, cond.value, cond.negate)) return false;
    }
    return true;
}
function matchesCondition(result, condPath, condVal, negate) {
    if (!condPath) return false;
    const currentVal = result[condPath];
    const isEmpty = !currentVal;
    const currentParts = currentVal ? currentVal.split(',').map(s => s.trim().toLowerCase()) : [];
    const match = !isEmpty && currentParts.includes((condVal || '').toLowerCase());
    if (negate) return isEmpty || !match;
    return match;
}

function renderResult(result, paths, extraTexts, resultItems) {

}
function addHistory(result, paths, extraTexts, resultItems) {
    const itemsForHistory = {};
    for (const path in resultItems) {
        itemsForHistory[path] = resultItems[path].map(i => ({ text: i.text, image: i.image || null }));
    }
    state.history.unshift({
        id: Date.now(), type: 'generated',
        result: JSON.parse(JSON.stringify(result)),
        paths: [...paths], extraTexts: extraTexts || [],
        items: itemsForHistory,
        date: new Date().toLocaleString('ru-RU'), favorite: false
    });
    if (state.history.length > 200) state.history.pop();

function formatPrompt(result, paths, extraTexts) {
    let out = paths.map(p => `${getPathName(p)}: ${result[p]}`).join('\n');
    if (extraTexts && extraTexts.length > 0) out += `\nДополнительно: ${extraTexts.join(', ')}`;
    return out;
}
function formatShort(result, paths, extraTexts) {
    let out = paths.map(p => result[p]).join(', ');
    if (extraTexts && extraTexts.length > 0) out += `, ${extraTexts.join(', ')}`;
    return out;
}

function pickImage(context) {
    imageContext = context;
    document.getElementById('imageFileInput').click();
}
document.getElementById('imageFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !imageContext) return;
    try {
        const dataUrl = await compressImage(file);
        applyImageToContext(dataUrl);
    } catch (err) { alert('Ошибка загрузки: ' + err.message); }
    e.target.value = '';
    imageContext = null;
});

function compressImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const MAX = 2048;
                let { width, height } = img;
                if (width <= MAX && height <= MAX) { resolve(ev.target.result); return; }
                if (width > height) { height = height * MAX / width; width = MAX; }
                else { width = width * MAX / height; height = MAX; }
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(width);
                canvas.height = Math.round(height);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const isPng = file.type === 'image/png';
                const isWebp = file.type === 'image/webp';
                let dataUrl;
                if (isPng) dataUrl = canvas.toDataURL('image/png');
                else if (isWebp) dataUrl = canvas.toDataURL('image/webp', 0.9);
                else dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
            img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function applyImageToContext(dataUrl) {
    const ctx = imageContext; if (!ctx) return;
    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;
    if (items && items[ctx.index]) {
        items[ctx.index].image = dataUrl;
        save();
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение привязано');
    }
}
function removeImage(context) {
    const ctx = context;
    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;
    if (items && items[ctx.index]) {
        items[ctx.index].image = null;
        save();
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение удалено');
    }
}
