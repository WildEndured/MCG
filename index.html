<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Персонажей v3 + Модули</title>
<style>
:root {
    --bg: #1a1a2e;
    --container: #16213e;
    --accent: #e94560;
    --text: #fff;
    --secondary: #0f3460;
    --header: #0d1b2a;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; min-height: 100vh;
}
.app {
    width: 100%; max-width: 900px;
    background: var(--container);
    border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    height: fit-content;
}
.tabs { display: flex; background: var(--header); }
.tab-btn {
    flex: 1; padding: 15px; background: none; border: none;
    color: #888; font-size: 1rem; cursor: pointer; font-weight: bold;
    border-bottom: 3px solid transparent; transition: 0.3s;
}
.tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
    background: var(--container);
}
.tab-content { padding: 20px; display: none; }
.tab-content.active { display: block; }

/* Генератор */
.result-box {
    background: var(--secondary); padding: 20px;
    border-radius: 10px; margin-bottom: 20px;
    max-height: 450px; overflow-y: auto;
    text-align: center;
}
.result-line {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.95rem; gap: 15px;
}
.result-line:last-child { border-bottom: none; }
.result-cat { color: #888; font-weight: bold; font-size: 0.85rem; }
.result-val { color: #fff; font-weight: bold; text-align: right; }

.btn-main {
    background: var(--accent); color: white; border: none;
    padding: 15px 30px; font-size: 1rem; border-radius: 50px;
    cursor: pointer; font-weight: bold; text-transform: uppercase;
    width: 100%; margin-bottom: 10px; transition: 0.2s;
}
.btn-main:hover { background: #ff2e63; transform: scale(1.02); }
.btn-secondary {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 10px 20px;
    border-radius: 5px; cursor: pointer; font-size: 0.9rem;
    transition: 0.2s;
}
.btn-secondary:hover { background: #1a4a7a; }

/* История */
.history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.search-input {
    flex-grow: 1; padding: 10px; border-radius: 5px;
    border: 1px solid #333; background: #0d1b2a; color: white;
}
.history-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 500px; overflow-y: auto;
}
.history-item {
    background: #0d1b2a; padding: 15px;
    border-radius: 8px; border-left: 4px solid var(--secondary);
}
.history-item.fav { border-left-color: gold; }
.history-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 8px;
}
.history-date { font-size: 0.75rem; color: #888; }
.history-details { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
.history-actions { display: flex; gap: 5px; }
.icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.1rem; padding: 3px; opacity: 0.6;
    color: white; transition: 0.2s;
}
.icon-btn:hover { opacity: 1; transform: scale(1.1); }
.icon-btn.fav-active { opacity: 1; color: gold; }

/* Модули */
.toolbar {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
}
.group-title {
    font-size: 1rem; font-weight: bold;
    padding: 10px 15px; margin-top: 15px;
    border-radius: 8px; color: white;
    background: linear-gradient(90deg, var(--accent), transparent);
    cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
}
.group-clothes { background: linear-gradient(90deg, #4a90d9, transparent); }
.group-race { background: linear-gradient(90deg, #d9a441, transparent); }

.group-body { padding-left: 8px; }
.group-body.collapsed { display: none; }

.module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--accent);
}
.module.disabled { opacity: 0.5; }

.module-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer;
    user-select: none;
}
.module-header h4 { margin: 0; font-size: 0.9rem; }
.module-counter { font-size: 0.7rem; color: #888; }
.module-controls { display: flex; gap: 8px; align-items: center; }

.module-body { padding: 10px 15px 15px; display: none; }
.module.open .module-body { display: block; }
.module.open .module-toggle { transform: rotate(180deg); }

.module-toggle {
    background: none; border: none; color: white;
    font-size: 1rem; cursor: pointer; padding: 3px;
    transition: 0.2s;
}

.add-row { display: flex; gap: 5px; margin-bottom: 10px; }
.add-row input {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.8rem;
}
.add-row button {
    padding: 6px 12px; background: var(--accent);
    color: white; border: none; border-radius: 5px;
    cursor: pointer; font-size: 0.8rem;
}

.item-list { max-height: 200px; overflow-y: auto; }
.item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; border-bottom: 1px solid #1a1a2e;
    font-size: 0.85rem;
}
.item.disabled { opacity: 0.4; text-decoration: line-through; }
.item-text {
    flex-grow: 1; cursor: pointer; padding: 3px;
    border-radius: 3px;
}
.item-text:hover { background: rgba(255,255,255,0.1); }
.item input[type="text"] {
    flex-grow: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.item input[type="checkbox"] {
    cursor: pointer; width: 15px; height: 15px;
    accent-color: var(--accent);
}

.toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #333;
    color: white; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gen')">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('hist')">📜 История</button>
        <button class="tab-btn" onclick="switchTab('mod')">⚙️ Модули</button>
    </div>

    <!-- ГЕНЕРАТОР -->
    <div id="tab-gen" class="tab-content active">
        <div class="result-box" id="resultBox">
            <p style="color:#888;">Нажмите «Сгенерировать»</p>
        </div>
        <button class="btn-main" onclick="generate()">Сгенерировать!</button>
        <button class="btn-secondary" style="width:100%;" onclick="copyResult()">📋 Скопировать</button>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="tab-hist" class="tab-content">
        <div class="history-controls">
            <input type="text" id="search" class="search-input" placeholder="Поиск..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <!-- МОДУЛИ -->
    <div id="tab-mod" class="tab-content">
        <div class="toolbar">
            <button class="btn-secondary" onclick="sortAll()">🔤 Сортировать</button>
            <button class="btn-secondary" onclick="resetAll()">↺ Сброс</button>
        </div>
        <div id="modulesContainer"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// СТРУКТУРА: ГРУППЫ → МОДУЛИ (подкатегории) → ЗНАЧЕНИЯ
// ============================================================
const DEFAULT = {
    appearance: {
        name: "🎨 Модуль базовой внешности",
        groupClass: "",
        expanded: true,
        modules: {
            bangs:      { name: "Bangs",           enabled: true, items: ["Прямая", "Косая", "Рваная"] },
            sidelocks:  { name: "Sidelocks",       enabled: true, items: ["Короткие", "Длинные"] },
            backHair:   { name: "Back hair",       enabled: true, items: ["Хвост", "Косички", "Распущенные"] },
            addHair:    { name: "Additional hair", enabled: true, items: ["Ахоге", "Пучок"] },
            eyeShape:   { name: "Форма глаз",      enabled: true, items: ["Большие", "Узкие", "Круглые"] },
            eyeColor:   { name: "Цвет глаз",       enabled: true, items: ["Голубые", "Карие", "Зелёные", "Красные"] },
            breastSize: { name: "Размер груди",    enabled: true, items: ["Плоская", "Средняя", "Большая"] },
            skinColor:  { name: "Цвет кожи",       enabled: true, items: ["Бледная", "Загорелая", "Тёмная"] }
        }
    },
    clothes: {
        name: "👗 Модуль одежды",
        groupClass: "group-clothes",
        expanded: true,
        modules: {
            style:      { name: "Стиль одежды",   enabled: true, items: ["Casual", "Streetwear", "Punk", "Y2K", "Gothic"] },
            headwear:   { name: "Headwear",       enabled: true, items: ["Шляпа", "Капюшон", "Ободок", "Отсутствует"] },
            neckwear:   { name: "Neckwear",       enabled: true, items: ["Чокер", "Шарф", "Ожерелье", "Отсутствует"] },
            topwear:    { name: "Topwear",        enabled: true, items: ["Футболка", "Худи", "Кроп-топ", "Куртка", "Отсутствует"] },
            bottomwear: { name: "Bottomwear",     enabled: true, items: ["Юбка", "Джинсы", "Шорты", "Карго", "Отсутствует"] },
            legwear:    { name: "Legwear",        enabled: true, items: ["Чулки", "Носки", "Колготки", "Отсутствует"] },
            footwear:   { name: "Footwear",       enabled: true, items: ["Кроссовки", "Ботинки", "Каблуки", "Отсутствует"] },
            acc1:       { name: "Accessory 1",    enabled: true, items: ["Серьги", "Очки", "Браслет", "Отсутствует"] },
            acc2:       { name: "Accessory 2",    enabled: true, items: ["Сумка", "Зонт", "Оружие", "Отсутствует"] },
            acc3:       { name: "Accessory 3",    enabled: true, items: ["Шарф", "Платок", "Пояс", "Отсутствует"] },
            acc4:       { name: "Accessory 4",    enabled: true, items: ["Перчатки", "Часы", "Кольцо", "Отсутствует"] },
            acc5:       { name: "Accessory 5",    enabled: true, items: ["Корона", "Вуаль", "Маска", "Отсутствует"] }
        }
    },
    race: {
        name: "🧬 Модуль расы",
        groupClass: "group-race",
        expanded: true,
        modules: {
            race:    { name: "Раса",          enabled: true, items: ["Cat girl", "Elf", "Demon girl", "Dragon girl", "Vampire girl", "Slime girl", "Zombie girl"] },
            raceT1:  { name: "Расовая черта 1", enabled: true, items: ["Animal ears", "Horns", "Tail", "Wings", "Halos"] },
            raceT2:  { name: "Расовая черта 2", enabled: true, items: ["Fangs", "Claws", "Glowing eyes", "Scales"] },
            raceT3:  { name: "Расовая черта 3", enabled: true, items: ["Magic aura", "Tattoos", "Freckles", "Scars"] },
            raceT4:  { name: "Расовая черта 4", enabled: true, items: ["Отсутствует"] },
            raceT5:  { name: "Расовая черта 5", enabled: true, items: ["Отсутствует"] },
            raceT6:  { name: "Расовая черта 6", enabled: true, items: ["Отсутствует"] },
            raceT7:  { name: "Расовая черта 7", enabled: true, items: ["Отсутствует"] }
        }
    }
};

let state = {
    data: null,
    history: [],
    current: {},
    currentPaths: []
};

// ============================================================
// INIT
// ============================================================
function init() {
    const saved = localStorage.getItem('cg_data_v8');
    const hist = localStorage.getItem('cg_hist_v8');
    state.data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT));
    state.history = hist ? JSON.parse(hist) : [];
    save();
    renderModules();
    renderHistory();
}

function save() {
    localStorage.setItem('cg_data_v8', JSON.stringify(state.data));
    localStorage.setItem('cg_hist_v8', JSON.stringify(state.history));
}

function switchTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    const btns = document.querySelectorAll('.tab-btn');
    if (name === 'gen')  btns[0].classList.add('active');
    if (name === 'hist') btns[1].classList.add('active');
    if (name === 'mod')  btns[2].classList.add('active');
    if (name === 'hist') renderHistory();
}

// ============================================================
// ГЕНЕРАЦИЯ
// ============================================================
function randItem(items) {
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)].text;
}

function generate() {
    const result = {};
    const paths = [];

    // Порядок: сначала раса, потом внешность, потом одежда
    const groupOrder = ['race', 'appearance', 'clothes'];

    for (const gKey of groupOrder) {
        const group = state.data[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const value = randItem(mod.items);
            if (value) {
                const path = `${gKey}.${mKey}`;
                result[path] = value;
                paths.push(path);
            }
        }
    }

    if (paths.length === 0) { showToast("Все модули отключены!"); return; }

    state.current = result;
    state.currentPaths = paths;
    renderResult(result, paths);
    addHistory(result, paths);
}

function renderResult(result, paths) {
    const box = document.getElementById('resultBox');
    box.innerHTML = '';
    paths.forEach(path => {
        const [g, m] = path.split('.');
        const mod = state.data[g].modules[m];
        const line = document.createElement('div');
        line.className = 'result-line';
        line.innerHTML = `<span class="result-cat">${mod.name}</span><span class="result-val">${result[path]}</span>`;
        box.appendChild(line);
    });
}

function addHistory(result, paths) {
    state.history.unshift({
        id: Date.now(),
        result: JSON.parse(JSON.stringify(result)),
        paths: [...paths],
        date: new Date().toLocaleString('ru-RU'),
        favorite: false
    });
    if (state.history.length > 200) state.history.pop();
    save();
}

function formatPrompt(result, paths) {
    return paths.map(p => {
        const [g, m] = p.split('.');
        const mod = state.data[g].modules[m];
        return `${mod.name}: ${result[p]}`;
    }).join('\n');
}

function formatShort(result, paths) {
    return paths.map(p => result[p]).join(', ');
}

function copyResult() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatPrompt(state.current, state.currentPaths));
    showToast('Скопировано!');
}

// ============================================================
// ИСТОРИЯ
// ============================================================
function renderHistory() {
    const list = document.getElementById('historyList');
    const q = document.getElementById('search').value.toLowerCase();
    list.innerHTML = '';

    const filtered = state.history.filter(it => formatShort(it.result, it.paths).toLowerCase().includes(q));

    if (filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">История пуста.</p>';
        return;
    }

    filtered.forEach(it => {
        const div = document.createElement('div');
        div.className = `history-item ${it.favorite ? 'fav' : ''}`;
        div.innerHTML = `
            <div class="history-header">
                <span class="history-date">${it.date}</span>
                <div class="history-actions">
                    <button class="icon-btn ${it.favorite ? 'fav-active' : ''}" onclick="toggleFav(${it.id})">${it.favorite ? '★' : '☆'}</button>
                    <button class="icon-btn" onclick="copyHist(${it.id})">📋</button>
                    <button class="icon-btn" onclick="delHist(${it.id})">❌</button>
                </div>
            </div>
            <div class="history-details">${formatShort(it.result, it.paths)}</div>
        `;
        list.appendChild(div);
    });
}

function toggleFav(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { it.favorite = !it.favorite; save(); renderHistory(); }
}
function delHist(id) {
    state.history = state.history.filter(i => i.id !== id);
    save(); renderHistory();
}
function clearHistory() {
    if (confirm('Удалить всю историю?')) {
        state.history = []; save(); renderHistory();
    }
}
function copyHist(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { navigator.clipboard.writeText(formatPrompt(it.result, it.paths)); showToast('Скопировано!'); }
}

// ============================================================
// РЕДАКТОР МОДУЛЕЙ
// ============================================================
function renderModules() {
    const container = document.getElementById('modulesContainer');
    container.innerHTML = '';

    for (const gKey in state.data) {
        const group = state.data[gKey];

        // Группа
        const title = document.createElement('div');
        title.className = `group-title ${group.groupClass || ''}`;
        title.innerHTML = `<span>${group.name}</span><span>${group.expanded ? '▼' : '▶'}</span>`;
        title.onclick = () => { group.expanded = !group.expanded; save(); renderModules(); };
        container.appendChild(title);

        const body = document.createElement('div');
        body.className = `group-body ${group.expanded ? '' : 'collapsed'}`;

        for (const mKey in group.modules) {
            body.appendChild(createModule(gKey, mKey, group.modules[mKey]));
        }
        container.appendChild(body);
    }
}

function createModule(gKey, mKey, mod) {
    const div = document.createElement('div');
    div.className = `module ${mod.enabled ? '' : 'disabled'}`;

    const active = mod.items.filter(i => i.enabled).length;

    div.innerHTML = `
        <div class="module-header">
            <div>
                <h4>${mod.name}</h4>
                <span class="module-counter">Активно: ${active} / ${mod.items.length}</span>
            </div>
            <div class="module-controls">
                <label style="font-size:0.8rem; cursor:pointer;">
                    <input type="checkbox" ${mod.enabled ? 'checked' : ''} onchange="toggleModule('${gKey}','${mKey}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="module-toggle">▼</button>
            </div>
        </div>
    `;

    const body = document.createElement('div');
    body.className = 'module-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addItem('${gKey}','${mKey}', this)">
            <button onclick="addItem('${gKey}','${mKey}', this.previousElementSibling)">+</button>
        </div>
        <div class="item-list" id="list-${gKey}-${mKey}"></div>
    `;

    div.querySelector('.module-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        div.classList.toggle('open');
    };
    div.querySelector('.module-toggle').onclick = (e) => {
        e.stopPropagation();
        div.classList.toggle('open');
    };

    div.appendChild(body);
    setTimeout(() => renderItems(gKey, mKey), 0);
    return div;
}

function renderItems(gKey, mKey) {
    const container = document.getElementById(`list-${gKey}-${mKey}`);
    if (!container) return;
    container.innerHTML = '';
    const mod = state.data[gKey].modules[mKey];

    mod.items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderItems(gKey, mKey); };

        const txt = document.createElement('span');
        txt.className = 'item-text';
        txt.textContent = item.text;
        txt.onclick = () => startEdit(gKey, mKey, idx, txt);

        const del = document.createElement('button');
        del.className = 'icon-btn';
        del.textContent = '❌';
        del.onclick = () => { mod.items.splice(idx, 1); save(); renderItems(gKey, mKey); };

        row.appendChild(cb);
        row.appendChild(txt);
        row.appendChild(del);
        container.appendChild(row);
    });

    const header = container.closest('.module').querySelector('.module-counter');
    const active = mod.items.filter(i => i.enabled).length;
    header.textContent = `Активно: ${active} / ${mod.items.length}`;
}

function toggleModule(gKey, mKey) {
    state.data[gKey].modules[mKey].enabled = !state.data[gKey].modules[mKey].enabled;
    save(); renderModules();
}

function startEdit(gKey, mKey, idx, span) {
    const mod = state.data[gKey].modules[mKey];
    const old = mod.items[idx].text;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = old;
    span.replaceWith(inp);
    inp.focus();

    const finish = () => {
        const v = inp.value.trim();
        if (v && v !== old) { mod.items[idx].text = v; save(); }
        renderItems(gKey, mKey);
    };
    inp.onblur = finish;
    inp.onkeydown = (e) => {
        if (e.key === 'Enter') finish();
        if (e.key === 'Escape') renderItems(gKey, mKey);
    };
}

function addItem(gKey, mKey, inputEl) {
    const v = inputEl.value.trim();
    if (!v) return;
    const mod = state.data[gKey].modules[mKey];
    if (mod.items.some(i => i.text.toLowerCase() === v.toLowerCase())) {
        showToast('Уже есть!'); return;
    }
    mod.items.push({ text: v, enabled: true });
    inputEl.value = '';
    save(); renderItems(gKey, mKey);
}

// ============================================================
// СОРТИРОВКА / СБРОС
// ============================================================
function sortAll() {
    for (const g in state.data) {
        for (const m in state.data[g].modules) {
            state.data[g].modules[m].items.sort((a, b) => a.text.localeCompare(b.text));
        }
    }
    save(); renderModules();
    showToast('Отсортировано');
}

function resetAll() {
    if (!confirm('Сбросить к стандартным?')) return;
    state.data = JSON.parse(JSON.stringify(DEFAULT));
    save(); renderModules();
    showToast('Сброшено');
}

// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = init;
</script>
</body>
</html>
