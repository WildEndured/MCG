<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Персонажей + Правила</title>
<style>
:root {
    --bg: #1a1a2e;
    --container: #16213e;
    --accent: #e94560;
    --text: #fff;
    --secondary: #0f3460;
    --header: #0d1b2a;
    --appearance: #e94560;
    --clothes: #4a90d9;
    --race: #d9a441;
    --lists: #5cb85c;
    --rules: #9b59b6;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; min-height: 100vh;
}
.app {
    width: 100%; max-width: 950px;
    background: var(--container);
    border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    height: fit-content;
}
.tabs { display: flex; background: var(--header); flex-wrap: wrap; }
.tab-btn {
    flex: 1; padding: 12px 6px; background: none; border: none;
    color: #888; font-size: 0.85rem; cursor: pointer; font-weight: bold;
    border-bottom: 3px solid transparent; transition: 0.3s;
    min-width: 90px;
}
.tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
    background: var(--container);
}
.tab-content { padding: 20px; display: none; }
.tab-content.active { display: block; }

/* Генератор */
.result-box {
    background: var(--secondary); padding: 20px;
    border-radius: 10px; margin-bottom: 20px;
    max-height: 500px; overflow-y: auto;
}
.result-line {
    display: flex; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.9rem; gap: 15px;
}
.result-line:last-child { border-bottom: none; }
.result-cat { color: #888; font-weight: bold; font-size: 0.82rem; }
.result-val { color: #fff; font-weight: bold; text-align: right; }
.result-line.main .result-val { color: var(--accent); font-size: 1.05rem; }
.result-line.slot .result-cat { color: var(--clothes); }
.result-line.extra .result-val { color: var(--rules); font-style: italic; }

.btn-main {
    background: var(--accent); color: white; border: none;
    padding: 15px 30px; font-size: 1rem; border-radius: 50px;
    cursor: pointer; font-weight: bold; text-transform: uppercase;
    width: 100%; margin-bottom: 10px; transition: 0.2s;
}
.btn-main:hover { background: #ff2e63; transform: scale(1.02); }
.btn-secondary {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 9px 18px;
    border-radius: 5px; cursor: pointer; font-size: 0.85rem;
    transition: 0.2s;
}
.btn-secondary:hover { background: #1a4a7a; }

/* История */
.history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.search-input {
    flex-grow: 1; padding: 10px; border-radius: 5px;
    border: 1px solid #333; background: #0d1b2a; color: white;
}
.history-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 550px; overflow-y: auto;
}
.history-item {
    background: #0d1b2a; padding: 12px 15px;
    border-radius: 8px; border-left: 4px solid var(--secondary);
}
.history-item.fav { border-left-color: gold; }
.history-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px;
}
.history-date { font-size: 0.72rem; color: #888; }
.history-details { font-size: 0.83rem; color: #ccc; line-height: 1.5; }
.history-actions { display: flex; gap: 4px; }
.icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.05rem; padding: 3px; opacity: 0.6;
    color: white; transition: 0.2s;
}
.icon-btn:hover { opacity: 1; transform: scale(1.1); }
.icon-btn.fav-active { opacity: 1; color: gold; }

/* Списки */
.toolbar {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
    align-items: center;
}
.list-block {
    background: #0d1b2a; border-radius: 10px;
    margin-bottom: 15px; overflow: hidden;
    border-left: 3px solid var(--lists);
}
.list-block.disabled { opacity: 0.5; }
.list-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 12px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.list-header h3 { margin: 0; font-size: 1rem; }
.list-counter { font-size: 0.72rem; color: #888; }
.list-controls { display: flex; gap: 8px; align-items: center; }
.list-body { padding: 12px 15px; display: none; }
.list-block.open .list-body { display: block; }

.add-row { display: flex; gap: 5px; margin-bottom: 10px; }
.add-row input {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.add-row button {
    padding: 6px 12px; background: var(--accent);
    color: white; border: none; border-radius: 5px;
    cursor: pointer; font-size: 0.85rem;
}
.add-row button.import-btn { background: var(--clothes); }

.item-list { max-height: 300px; overflow-y: auto; }
.item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; border-bottom: 1px solid #1a1a2e;
    font-size: 0.85rem;
}
.item.disabled { opacity: 0.4; text-decoration: line-through; }
.item-text {
    flex-grow: 1; cursor: pointer; padding: 3px;
    border-radius: 3px; word-break: break-word;
}
.item-text:hover { background: rgba(255,255,255,0.1); }
.item input[type="text"] {
    flex-grow: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.item input[type="checkbox"] {
    cursor: pointer; width: 15px; height: 15px;
    accent-color: var(--accent); flex-shrink: 0;
}

/* Модули */
.group-title {
    font-size: 1rem; font-weight: bold;
    padding: 11px 15px; margin-top: 15px;
    border-radius: 8px; color: white;
    cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
}
.group-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.group-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.group-race { background: linear-gradient(90deg, var(--race), transparent); }
.group-body { padding-left: 8px; }
.group-body.collapsed { display: none; }

.module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--accent);
}
.module.disabled { opacity: 0.5; }
.module-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.module-header h4 { margin: 0; font-size: 0.9rem; }
.module-counter { font-size: 0.7rem; color: #888; }
.module-controls { display: flex; gap: 8px; align-items: center; }
.module-body { padding: 10px 15px 15px; display: none; }
.module.open .module-body { display: block; }
.module-toggle {
    background: none; border: none; color: white;
    font-size: 1rem; cursor: pointer; padding: 3px;
    transition: 0.2s;
}
.module.open .module-toggle { transform: rotate(180deg); }

/* Подкатегория */
.subcat {
    background: #1a1a2e; border-radius: 6px;
    margin-top: 6px; overflow: hidden;
    border-left: 2px solid var(--secondary);
}
.subcat.disabled { opacity: 0.4; }
.subcat-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    cursor: pointer; user-select: none; font-size: 0.85rem;
}
.subcat-header:hover { background: rgba(255,255,255,0.03); }
.subcat-name { font-weight: bold; }
.subcat-counter { font-size: 0.7rem; color: #888; margin-left: 8px; }
.subcat-controls { display: flex; gap: 5px; align-items: center; }
.subcat-body {
    padding: 8px 12px 12px;
    border-top: 1px solid #0d1b2a;
    display: none;
}
.subcat.open .subcat-body { display: block; }
.subcat-toggle {
    background: none; border: none; color: white;
    font-size: 0.8rem; cursor: pointer; padding: 3px;
    transition: 0.2s;
}
.subcat.open .subcat-toggle { transform: rotate(180deg); }

/* ПРАВИЛА */
.rule-card {
    background: #0d1b2a; border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
    border-left: 3px solid var(--rules);
}
.rule-card.disabled { opacity: 0.5; }
.rule-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header);
}
.rule-header .rule-type {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
    background: var(--rules); color: white; font-weight: bold;
    text-transform: uppercase;
}
.rule-type-replace { background: var(--clothes); }
.rule-type-exclude { background: var(--accent); }
.rule-type-add { background: var(--race); color: #1a1a2e; }

.rule-body { padding: 12px 15px; font-size: 0.85rem; line-height: 1.6; }
.rule-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.rule-row label { font-size: 0.8rem; color: #888; min-width: 80px; }
.rule-row select, .rule-row input[type="text"] {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem;
    min-width: 150px;
}
.rule-row .arrow { color: var(--rules); font-weight: bold; font-size: 1.1rem; }

.rule-actions {
    display: flex; gap: 5px; margin-top: 10px;
    justify-content: flex-end;
}

.add-rule-form {
    background: #0d1b2a; padding: 15px;
    border-radius: 8px; border: 1px dashed var(--rules);
    margin-bottom: 15px;
}

.empty-state {
    text-align: center; color: #666; padding: 30px;
    font-size: 0.9rem;
}

/* Модальное окно */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); z-index: 1000;
    display: none; justify-content: center; align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--container); padding: 25px;
    border-radius: 12px; max-width: 500px; width: 100%;
    max-height: 85vh; overflow-y: auto;
}
.modal h3 { margin-top: 0; }
.modal textarea {
    width: 100%; height: 200px; padding: 10px;
    background: #0d1b2a; color: white;
    border: 1px solid #333; border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; resize: vertical;
}
.modal-actions {
    display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
}

.toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #333;
    color: white; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gen', this)">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('hist', this)">📜 История</button>
        <button class="tab-btn" onclick="switchTab('lists', this)">📋 Списки</button>
        <button class="tab-btn" onclick="switchTab('mod', this)">⚙️ Модули</button>
        <button class="tab-btn" onclick="switchTab('rules', this)">🔗 Правила</button>
    </div>

    <div id="tab-gen" class="tab-content active">
        <div class="result-box" id="resultBox">
            <p style="text-align:center; color:#888;">Нажмите «Сгенерировать»</p>
        </div>
        <button class="btn-main" onclick="generate()">Сгенерировать!</button>
        <button class="btn-secondary" style="width:100%; margin-bottom:8px;" onclick="copyResult()">📋 Скопировать промпт</button>
        <button class="btn-secondary" style="width:100%;" onclick="copyShort()">📋 Скопировать кратко</button>
    </div>

    <div id="tab-hist" class="tab-content">
        <div class="history-controls">
            <input type="text" id="search" class="search-input" placeholder="Поиск..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div id="tab-lists" class="tab-content">
        <div class="toolbar">
            <button class="btn-secondary" onclick="sortLists()">🔤 Сортировать</button>
            <button class="btn-secondary" onclick="resetAll()">↺ Сброс</button>
        </div>
        <div id="listsContainer"></div>
    </div>

    <div id="tab-mod" class="tab-content">
        <div class="toolbar">
            <button class="btn-secondary" onclick="sortModules()">🔤 Сортировать</button>
            <button class="btn-secondary" onclick="resetAll()">↺ Сброс</button>
        </div>
        <div id="modulesContainer"></div>
    </div>

    <div id="tab-rules" class="tab-content">
        <div class="add-rule-form">
            <h4 style="margin-top:0;">➕ Новое правило</h4>
            <div class="rule-row">
                <label>Тип:</label>
                <select id="newRuleType" onchange="onRuleTypeChange()">
                    <option value="replace">🔵 Замена (если X → Y)</option>
                    <option value="exclude">🔴 Исключение (если X → убрать Y)</option>
                    <option value="add">🟡 Добавить текст (если X → +текст)</option>
                </select>
            </div>
            <div class="rule-row">
                <label>Условие:</label>
                <select id="newRuleCondModule"></select>
                <span class="arrow">=</span>
                <select id="newRuleCondValue"></select>
            </div>
            <div class="rule-row" id="actionReplaceRow">
                <label>Действие:</label>
                <select id="newRuleActModule"></select>
                <span class="arrow">=</span>
                <select id="newRuleActValue"></select>
            </div>
            <div class="rule-row" id="actionExcludeRow" style="display:none;">
                <label>Убрать:</label>
                <select id="newRuleExclModule"></select>
                <input type="text" id="newRuleExclValue" placeholder="Значение (через запятую)">
            </div>
            <div class="rule-row" id="actionAddRow" style="display:none;">
                <label>Текст:</label>
                <input type="text" id="newRuleAddText" placeholder="torn clothes, pale skin">
            </div>
            <button class="btn-main" style="width:auto; margin:10px 0 0 0; padding:10px 20px; font-size:0.85rem;" onclick="addRule()">Добавить правило</button>
        </div>
        <div id="rulesContainer"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="editTitle">Редактирование</h3>
        <p style="color:#888; font-size:0.85rem;">Один элемент на строку (или через запятую).</p>
        <textarea id="editTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEdit()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="saveEdit()">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="bulkImportModal">
    <div class="modal">
        <h3 id="bulkImportTitle">Массовый импорт</h3>
        <p style="color:#888; font-size:0.85rem;">Вставьте значения: одно на строку или через запятую.</p>
        <textarea id="bulkImportTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeBulkImport()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="confirmBulkImport()">Добавить</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

let state = {
    lists: null,
    modules: null,
    rules: [],   // { id, type: 'replace'|'exclude'|'add', condition: {path, value}, action: {...}, enabled: true }
    history: [],
    current: {},
    currentPaths: [],
    extraText: ''   // текст от правил-add, добавляется к промпту
};

let editContext = null;
let bulkContext = null;

// ============================================================
// INIT
// ============================================================
function init() {
    const savedLists = localStorage.getItem('cg_lists_v2');
    const savedModules = localStorage.getItem('cg_modules_v2');
    const savedRules = localStorage.getItem('cg_rules');
    const savedHist = localStorage.getItem('cg_history');

    state.lists = savedLists ? JSON.parse(savedLists) : null;
    state.modules = savedModules ? JSON.parse(savedModules) : null;
    state.rules = savedRules ? JSON.parse(savedRules) : [];
    state.history = savedHist ? JSON.parse(savedHist) : [];

    if (!state.lists || !isValidListStructure(state.lists)) {
        state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    }
    if (!state.modules || !isValidModuleStructure(state.modules)) {
        state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    }
    sanitizeData();
    save();
    renderLists();
    renderModules();
    renderRules();
    renderHistory();
    populateRuleSelects();
}

function isValidListStructure(lists) {
    for (const key in lists) {
        const list = lists[key];
        if (!list || !Array.isArray(list.items)) return false;
        const hasText = list.items.some(i => i && typeof i.text === 'string' && i.text.length > 0);
        if (!hasText) return false;
    }
    return true;
}
function isValidModuleStructure(modules) {
    for (const gKey in modules) {
        const group = modules[gKey];
        if (!group.modules) return false;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) return false;
            for (const sKey in mod.subcategories) {
                if (!Array.isArray(mod.subcategories[sKey].items)) return false;
            }
        }
    }
    return true;
}
function sanitizeData() {
    for (const key in state.lists) {
        const list = state.lists[key];
        if (!Array.isArray(list.items)) { list.items = []; continue; }
        list.items = list.items.map(i => {
            if (typeof i === 'string') return { text: i, enabled: true };
            if (i && typeof i === 'object' && typeof i.text === 'string') return i;
            return null;
        }).filter(i => i && i.text.trim().length > 0);
        if (list.enabled === undefined) list.enabled = true;
        if (list.expanded === undefined) list.expanded = true;
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        if (!group.modules) group.modules = {};
        if (group.expanded === undefined) group.expanded = true;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) mod.subcategories = {};
            if (mod.enabled === undefined) mod.enabled = true;
            if (mod.expanded === undefined) mod.expanded = false;
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!Array.isArray(sub.items)) { sub.items = []; continue; }
                sub.items = sub.items.map(i => {
                    if (typeof i === 'string') return { text: i, enabled: true };
                    if (i && typeof i === 'object' && typeof i.text === 'string') return i;
                    return null;
                }).filter(i => i && i.text.trim().length > 0);
                if (sub.enabled === undefined) sub.enabled = true;
                if (sub.expanded === undefined) sub.expanded = false;
            }
        }
    }
}
function save() {
    localStorage.setItem('cg_lists_v2', JSON.stringify(state.lists));
    localStorage.setItem('cg_modules_v2', JSON.stringify(state.modules));
    localStorage.setItem('cg_rules', JSON.stringify(state.rules));
    localStorage.setItem('cg_history', JSON.stringify(state.history));
}

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');

    if (name === 'rules') { populateRuleSelects(); renderRules(); }

// ============================================================
// СПИСОК ВСЕХ ВОЗМОЖНЫХ ПУТЕЙ (для правил)
// ============================================================
function getAllPaths() {
    const paths = [];
    // Списки
    paths.push({ path: 'list.races', name: 'Расы', items: state.lists.races.items });
    paths.push({ path: 'list.styles', name: 'Стили', items: state.lists.styles.items });
    // Модули
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            const allItems = [];
            for (const sKey in mod.subcategories) {
                allItems.push(...mod.subcategories[sKey].items);
            }
            paths.push({
                path: `${gKey}.${mKey}`,
                name: `${group.name.replace(/^[^\s]+\s/, '')} → ${mod.name}`,
                items: allItems
            });
        }
    }
    return paths;
}

// ============================================================
// ГЕНЕРАЦИЯ С ПРАВИЛАМИ
// ============================================================
function randItem(items) {
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)].text;
}
function randItemExcluding(items, excludeList) {
    const excludeLower = excludeList.map(s => s.toLowerCase());
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None" && !excludeLower.includes(i.text.toLowerCase()));
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)].text;
}

function generate() {
    const result = {};
    const paths = [];
    const extraTexts = [];

    // === 1. Первый проход: генерируем всё как обычно ===
    if (state.lists.races.enabled) {
        const race = randItem(state.lists.races.items);
        if (race) { result['list.races'] = race; paths.push('list.races'); }
    }
    if (state.lists.styles.enabled) {
        const style = randItem(state.lists.styles.items);
        if (style) { result['list.styles'] = style; paths.push('list.styles'); }
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const slotValues = [];
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!sub.enabled) continue;
                const v = randItem(sub.items);
                if (v) slotValues.push(v);
            }
            if (slotValues.length > 0) {
                const path = `${gKey}.${mKey}`;
                result[path] = slotValues.join(', ');
                paths.push(path);
            }
        }
    }

    // === 2. Применяем правила ===
    const activeRules = state.rules.filter(r => r.enabled);

    // 2.1 Замены
    activeRules.filter(r => r.type === 'replace').forEach(rule => {
        const condPath = rule.condition.path;
        const condVal = rule.condition.value;
        // Проверяем условие: если в текущем результате есть это значение
        if (matchesCondition(result, condPath, condVal)) {
            // Применяем: заменяем целое значение action.path на action.value
            const actPath = rule.action.path;
            const actVal = rule.action.value;
            if (actPath) {
                result[actPath] = actVal;
                if (!paths.includes(actPath)) paths.push(actPath);
            }
        }
    });

    // 2.2 Исключения (перегенерируем те модули, где есть исключения)
    const excludeRules = activeRules.filter(r => r.type === 'exclude');
    excludeRules.forEach(rule => {
        if (matchesCondition(result, rule.condition.path, rule.condition.value)) {
            const exclPath = rule.action.path;
            const exclValues = rule.action.values || [];
            if (!exclPath) return;

            // Если это простой путь модуля — перегенерируем
            if (exclPath.startsWith('list.')) {
                const listKey = exclPath.split('.')[1];
                const newVal = randItemExcluding(state.lists[listKey].items, exclValues);
                if (newVal) result[exclPath] = newVal;
            } else {
                const [gKey, mKey] = exclPath.split('.');
                const mod = state.modules[gKey] && state.modules[gKey].modules[mKey];
                if (!mod || !mod.enabled) return;
                // Идём по подкатегориям и перегенерируем
                const slotValues = [];
                for (const sKey in mod.subcategories) {
                    const sub = mod.subcategories[sKey];
                    if (!sub.enabled) continue;
                    const v = randItemExcluding(sub.items, exclValues);
                    if (v) slotValues.push(v);
                }
                if (slotValues.length > 0) result[exclPath] = slotValues.join(', ');
            }
        }
    });

    // 2.3 Добавление текста
    activeRules.filter(r => r.type === 'add').forEach(rule => {
        if (matchesCondition(result, rule.condition.path, rule.condition.value)) {
            if (rule.action.text) extraTexts.push(rule.action.text);
        }
    });

    if (paths.length === 0) { showToast("Все списки и модули отключены!"); return; }

    state.current = result;
    state.currentPaths = paths;
    state.extraText = extraTexts.join(', ');
    renderResult(result, paths, extraTexts);
    addHistory(result, paths, extraTexts);
}

function matchesCondition(result, condPath, condVal) {
    if (!condPath || !condVal) return false;
    const currentVal = result[condPath];
    if (!currentVal) return false;
    // Проверяем совпадение (в т.ч. если в значении несколько через запятую)
    const currentParts = currentVal.split(',').map(s => s.trim().toLowerCase());
    return currentParts.includes(condVal.toLowerCase());
}

function getPathName(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].name;
    const [g, m] = path.split('.');
    return state.modules[g].modules[m].name;
}

function renderResult(result, paths, extraTexts) {
    const box = document.getElementById('resultBox');
    box.innerHTML = '';
    paths.forEach(path => {
        const name = getPathName(path);
        const isMain = path === 'list.races' || path === 'list.styles';
        const isSlot = !path.startsWith('list.');
        const line = document.createElement('div');
        line.className = `result-line ${isMain ? 'main' : ''} ${isSlot ? 'slot' : ''}`;
        line.innerHTML = `<span class="result-cat">${name}</span><span class="result-val">${result[path]}</span>`;
        box.appendChild(line);
    });
    if (extraTexts && extraTexts.length > 0) {
        const line = document.createElement('div');
        line.className = 'result-line extra';
        line.innerHTML = `<span class="result-cat">🔗 Дополнительно</span><span class="result-val">${extraTexts.join(', ')}</span>`;
        box.appendChild(line);
    }
}

function addHistory(result, paths, extraTexts) {
    state.history.unshift({
        id: Date.now(),
        result: JSON.parse(JSON.stringify(result)),
        paths: [...paths],
        extraTexts: extraTexts || [],
        date: new Date().toLocaleString('ru-RU'),
        favorite: false
    });
    if (state.history.length > 200) state.history.pop();
    save();
}

function formatPrompt(result, paths, extraTexts) {
    let out = paths.map(p => `${getPathName(p)}: ${result[p]}`).join('\n');
    if (extraTexts && extraTexts.length > 0) out += `\nДополнительно: ${extraTexts.join(', ')}`;
    return out;
}
function formatShort(result, paths, extraTexts) {
    let out = paths.map(p => result[p]).join(', ');
    if (extraTexts && extraTexts.length > 0) out += `, ${extraTexts.join(', ')}`;
    return out;
}
function copyResult() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatPrompt(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));
    showToast('Скопировано!');
}
function copyShort() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatShort(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));
    showToast('Скопировано!');
}

// ИСТОРИЯ
// ============================================================
function renderHistory() {
    const list = document.getElementById('historyList');
    const q = document.getElementById('search').value.toLowerCase();
    list.innerHTML = '';
    const filtered = state.history.filter(it => formatShort(it.result, it.paths, it.extraTexts || []).toLowerCase().includes(q));
    if (filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#666;">История пуста.</p>';
        return;
    }
    filtered.forEach(it => {
        const div = document.createElement('div');
        div.className = `history-item ${it.favorite ? 'fav' : ''}`;
        div.innerHTML = `
            <div class="history-header">
                <span class="history-date">${it.date}</span>
                <div class="history-actions">
                    <button class="icon-btn ${it.favorite ? 'fav-active' : ''}" onclick="toggleFav(${it.id})">${it.favorite ? '★' : '☆'}</button>
                    <button class="icon-btn" onclick="copyHist(${it.id})">📋</button>
                    <button class="icon-btn" onclick="delHist(${it.id})">❌</button>
                </div>
            </div>
            <div class="history-details">${formatShort(it.result, it.paths, it.extraTexts || [])}</div>
        `;
        list.appendChild(div);
    });
}
function toggleFav(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { it.favorite = !it.favorite; save(); renderHistory(); }
}
function delHist(id) {
    state.history = state.history.filter(i => i.id !== id);
    save(); renderHistory();
}
function clearHistory() {
    if (confirm('Удалить всю историю?')) {
        state.history = []; save(); renderHistory();
    }
}
function copyHist(id) {
    const it = state.history.find(i => i.id === id);
    if (it) { navigator.clipboard.writeText(formatPrompt(it.result, it.paths, it.extraTexts || [])); showToast('Скопировано!'); }
}

// ============================================================
// ПРАВИЛА — UI
// ============================================================
function populateRuleSelects() {
    const paths = getAllPaths();
    const selects = ['newRuleCondModule', 'newRuleActModule', 'newRuleExclModule'];
    selects.forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '';
        paths.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.path;
            opt.textContent = p.name;
            sel.appendChild(opt);
        });
        if (currentVal) sel.value = currentVal;
    });
    onRuleCondModuleChange();
    onRuleActModuleChange();
    onRuleExclModuleChange();
}

function getItemsByPath(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].items;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    const all = [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all;
}

function onRuleCondModuleChange() {
    const sel = document.getElementById('newRuleCondModule');
    const valSel = document.getElementById('newRuleCondValue');
    if (!sel || !valSel) return;
    const items = getItemsByPath(sel.value);
    valSel.innerHTML = '';
    items.filter(i => i.enabled).forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.text;
        opt.textContent = i.text;
        valSel.appendChild(opt);
    });
}
function onRuleActModuleChange() {
    const sel = document.getElementById('newRuleActModule');
    const valSel = document.getElementById('newRuleActValue');
    if (!sel || !valSel) return;
    const items = getItemsByPath(sel.value);
    valSel.innerHTML = '';
    items.filter(i => i.enabled).forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.text;
        opt.textContent = i.text;
        valSel.appendChild(opt);
    });
}
function onRuleExclModuleChange() {
    // для исключений вводится текст вручную
}

function onRuleTypeChange() {
    const t = document.getElementById('newRuleType').value;
    document.getElementById('actionReplaceRow').style.display = t === 'replace' ? 'flex' : 'none';
    document.getElementById('actionExcludeRow').style.display = t === 'exclude' ? 'flex' : 'none';
    document.getElementById('actionAddRow').style.display = t === 'add' ? 'flex' : 'none';
}

function addRule() {
    const type = document.getElementById('newRuleType').value;
    const condPath = document.getElementById('newRuleCondModule').value;
    const condValue = document.getElementById('newRuleCondValue').value;

    if (!condPath || !condValue) { showToast('Заполните условие!'); return; }

    const rule = {
        id: Date.now(),
        type: type,
        condition: { path: condPath, value: condValue },
        action: {},
        enabled: true
    };

    if (type === 'replace') {
        const actPath = document.getElementById('newRuleActModule').value;
        const actValue = document.getElementById('newRuleActValue').value;
        if (!actPath || !actValue) { showToast('Заполните действие!'); return; }
        rule.action = { path: actPath, value: actValue };
    } else if (type === 'exclude') {
        const actPath = document.getElementById('newRuleExclModule').value;
        const actValues = document.getElementById('newRuleExclValue').value.split(',').map(s => s.trim()).filter(s => s);
        if (!actPath || actValues.length === 0) { showToast('Заполните действие!'); return; }
        rule.action = { path: actPath, values: actValues };
    } else if (type === 'add') {
        const text = document.getElementById('newRuleAddText').value.trim();
        if (!text) { showToast('Введите текст!'); return; }
        rule.action = { text: text };
    }

    state.rules.push(rule);
    save();
    renderRules();
    showToast('Правило добавлено');

    // Очистка
    document.getElementById('newRuleExclValue').value = '';
    document.getElementById('newRuleAddText').value = '';
}

function renderRules() {
    const container = document.getElementById('rulesContainer');
    if (!container) return;
    container.innerHTML = '';

    if (state.rules.length === 0) {
        container.innerHTML = '<div class="empty-state">Пока нет правил.<br>Создайте первое — например, «Если раса = Dragon girl → добавить Scales».</div>';
        return;
    }

    state.rules.forEach(rule => {
        const div = document.createElement('div');
        div.className = `rule-card ${rule.enabled ? '' : 'disabled'}`;

        const typeLabel = rule.type === 'replace' ? '🔵 Замена' : rule.type === 'exclude' ? '🔴 Исключение' : '🟡 Добавить';
        const typeClass = rule.type === 'replace' ? 'rule-type-replace' : rule.type === 'exclude' ? 'rule-type-exclude' : 'rule-type-add';

        const condName = getPathName(rule.condition.path) || rule.condition.path;

        let actionText = '';
        if (rule.type === 'replace') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `<b>${actName}</b> = <b style="color:var(--clothes);">${rule.action.value}</b>`;
        } else if (rule.type === 'exclude') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `убрать из <b>${actName}</b>: <b style="color:var(--accent);">${rule.action.values.join(', ')}</b>`;
        } else if (rule.type === 'add') {
            actionText = `добавить текст: <b style="color:var(--race);">${rule.action.text}</b>`;
        }

        div.innerHTML = `
            <div class="rule-header">
                <span class="rule-type ${typeClass}">${typeLabel}</span>
                <div style="display:flex; gap:8px; align-items:center;">
                    <label style="font-size:0.75rem; cursor:pointer;">
                        <input type="checkbox" ${rule.enabled ? 'checked' : ''} onchange="toggleRule(${rule.id})" style="accent-color: var(--rules);"> Вкл
                    </label>
                    <button class="icon-btn" onclick="deleteRule(${rule.id})">❌</button>
                </div>
            </div>
            <div class="rule-body">
                <b>Если</b> ${condName} = <b style="color:var(--rules);">${rule.condition.value}</b><br>
                <b>Тогда</b> ${actionText}
            </div>
        `;
        container.appendChild(div);
    });
}

function toggleRule(id) {
    const r = state.rules.find(x => x.id === id);
    if (r) { r.enabled = !r.enabled; save(); renderRules(); }
}
function deleteRule(id) {
    state.rules = state.rules.filter(x => x.id !== id);
    save(); renderRules();
}

// ============================================================
// СПИСКИ / МОДУЛИ / РЕНДЕР (те же функции, что и раньше)
// ============================================================
function renderLists() {
    const container = document.getElementById('listsContainer');
    container.innerHTML = '';
    for (const key in state.lists) container.appendChild(createListBlock(key, state.lists[key]));
}
function createListBlock(key, list) {
    const div = document.createElement('div');
    div.className = `list-block ${list.enabled ? '' : 'disabled'} ${list.expanded ? 'open' : ''}`;
    const active = list.items.filter(i => i.enabled).length;
    div.innerHTML = `
        <div class="list-header">
            <div><h3>${list.name}</h3><span class="list-counter">Активно: ${active} / ${list.items.length}</span></div>
            <div class="list-controls">
                <label style="font-size:0.75rem; cursor:pointer;">
                    <input type="checkbox" ${list.enabled ? 'checked' : ''} onchange="toggleList('${key}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="icon-btn" onclick="event.stopPropagation(); openEditList('${key}')">✏️</button>
                <span style="font-size:0.9rem;">${list.expanded ? '▼' : '▶'}</span>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'list-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addListItem('${key}', this)">
            <button onclick="addListItem('${key}', this.previousElementSibling)">+</button>
            <button class="import-btn" onclick="openBulkImport('list','${key}')">📥</button>
        </div>
        <div class="item-list" id="list-values-${key}"></div>
    `;
    div.querySelector('.list-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        list.expanded = !list.expanded; save(); renderLists();
    };
    div.appendChild(body);
    setTimeout(() => renderListItems(key), 0);
    return div;
}
function renderListItems(key) {
    const container = document.getElementById(`list-values-${key}`);
    if (!container) return;
    container.innerHTML = '';
    const list = state.lists[key];
    list.items.forEach((item, idx) => {
        if (!item || !item.text) return;
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderListItems(key); };
        const txt = document.createElement('span');
        txt.className = 'item-text'; txt.textContent = item.text;
        txt.onclick = () => startEditListItem(key, idx, txt);
        const del = document.createElement('button');
        del.className = 'icon-btn'; del.textContent = '❌';
        del.onclick = () => { list.items.splice(idx, 1); save(); renderListItems(key); };
        row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
        container.appendChild(row);
    });
    const header = container.closest('.list-block').querySelector('.list-counter');
    const active = list.items.filter(i => i.enabled).length;
    header.textContent = `Активно: ${active} / ${list.items.length}`;
}
function toggleList(key) { state.lists[key].enabled = !state.lists[key].enabled; save(); renderLists(); }
function startEditListItem(key, idx, span) {
    const list = state.lists[key]; const old = list.items[idx].text;
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = old;
    span.replaceWith(inp); inp.focus();
    const finish = () => { const v = inp.value.trim(); if (v && v !== old) { list.items[idx].text = v; save(); } renderListItems(key); };
    inp.onblur = finish;
    inp.onkeydown = (e) => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') renderListItems(key); };
}
function addListItem(key, inputEl) {
    const v = inputEl.value.trim(); if (!v) return;
    const list = state.lists[key];
    if (list.items.some(i => i.text.toLowerCase() === v.toLowerCase())) { showToast('Уже есть!'); return; }
    list.items.push({ text: v, enabled: true }); inputEl.value = '';
    save(); renderListItems(key);
}
function sortLists() {
    for (const key in state.lists) state.lists[key].items.sort((a, b) => a.text.localeCompare(b.text));
    save(); renderLists(); showToast('Отсортировано');
}
function openEditList(key) {
    editContext = { type: 'list', key };
    const list = state.lists[key];
    document.getElementById('editTitle').textContent = `Редактирование: ${list.name}`;
    document.getElementById('editTextarea').value = list.items.map(i => i.text).join('\n');
    document.getElementById('editModal').classList.add('active');
}

// МОДУЛИ
function renderModules() {
    const container = document.getElementById('modulesContainer');
    container.innerHTML = '';
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        const title = document.createElement('div');
        title.className = `group-title ${group.groupClass}`;
        title.innerHTML = `<span>${group.name}</span><span>${group.expanded ? '▼' : '▶'}</span>`;
        title.onclick = () => { group.expanded = !group.expanded; save(); renderModules(); };
        container.appendChild(title);
        const body = document.createElement('div');
        body.className = `group-body ${group.expanded ? '' : 'collapsed'}`;
        for (const mKey in group.modules) body.appendChild(createModule(gKey, mKey, group.modules[mKey]));
        container.appendChild(body);
    }
}
function createModule(gKey, mKey, mod) {
    const div = document.createElement('div');
    div.className = `module ${mod.enabled ? '' : 'disabled'} ${mod.expanded ? 'open' : ''}`;
    let activeSubs = 0, totalSubs = 0, totalActive = 0, totalItems = 0;
    for (const sKey in mod.subcategories) {
        const sub = mod.subcategories[sKey];
        totalSubs++; if (sub.enabled) activeSubs++;
        totalItems += sub.items.length;
        totalActive += sub.items.filter(i => i.enabled).length;
    }
    div.innerHTML = `
        <div class="module-header">
            <div>
                <h4>${mod.name}</h4>
                <span class="module-counter">Подкатегорий: ${activeSubs}/${totalSubs} · Значений: ${totalActive}/${totalItems}</span>
            </div>
            <div class="module-controls">
                <label style="font-size:0.75rem; cursor:pointer;">
                    <input type="checkbox" ${mod.enabled ? 'checked' : ''} onchange="toggleModule('${gKey}','${mKey}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="module-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'module-body';
    for (const sKey in mod.subcategories) body.appendChild(createSubcat(gKey, mKey, sKey, mod.subcategories[sKey]));
    div.querySelector('.module-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        mod.expanded = !mod.expanded; save(); renderModules();
    };
    div.querySelector('.module-toggle').onclick = (e) => { e.stopPropagation(); mod.expanded = !mod.expanded; save(); renderModules(); };
    div.appendChild(body);
    return div;
}
function createSubcat(gKey, mKey, sKey, sub) {
    const div = document.createElement('div');
    div.className = `subcat ${sub.enabled ? '' : 'disabled'} ${sub.expanded ? 'open' : ''}`;
    const active = sub.items.filter(i => i.enabled).length;
    div.innerHTML = `
        <div class="subcat-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" ${sub.enabled ? 'checked' : ''} style="accent-color: var(--accent); cursor:pointer;" onclick="event.stopPropagation(); toggleSubcat('${gKey}','${mKey}','${sKey}')">
                <span class="subcat-name">${sub.name}</span>
                <span class="subcat-counter">(${active}/${sub.items.length})</span>
            </div>
            <div class="subcat-controls">
                <button class="icon-btn" onclick="event.stopPropagation(); openEditSubcat('${gKey}','${mKey}','${sKey}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); openBulkImport('subcat','${gKey}','${mKey}','${sKey}')">📥</button>
                <button class="subcat-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'subcat-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addSubcatItem('${gKey}','${mKey}','${sKey}', this)">
            <button onclick="addSubcatItem('${gKey}','${mKey}','${sKey}', this.previousElementSibling)">+</button>
        </div>
        <div class="item-list" id="sub-values-${gKey}-${mKey}-${sKey}"></div>
    `;
    div.querySelector('.subcat-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        sub.expanded = !sub.expanded; save(); renderModules();
    };
    div.querySelector('.subcat-toggle').onclick = (e) => { e.stopPropagation(); sub.expanded = !sub.expanded; save(); renderModules(); };
    div.appendChild(body);
    setTimeout(() => renderSubcatItems(gKey, mKey, sKey), 0);
    return div;
}
function renderSubcatItems(gKey, mKey, sKey) {
    const container = document.getElementById(`sub-values-${gKey}-${mKey}-${sKey}`);
    if (!container) return;
    container.innerHTML = '';
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    sub.items.forEach((item, idx) => {
        if (!item || !item.text) return;
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderSubcatItems(gKey, mKey, sKey); };
        const txt = document.createElement('span');
        txt.className = 'item-text'; txt.textContent = item.text;
        txt.onclick = () => startEditSubcatItem(gKey, mKey, sKey, idx, txt);
        const del = document.createElement('button');
        del.className = 'icon-btn'; del.textContent = '❌';
        del.onclick = () => { sub.items.splice(idx, 1); save(); renderSubcatItems(gKey, mKey, sKey); };
        row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
        container.appendChild(row);
    });
    const header = container.closest('.subcat').querySelector('.subcat-counter');
    const active = sub.items.filter(i => i.enabled).length;
    header.textContent = `(${active}/${sub.items.length})`;
}
function toggleModule(gKey, mKey) { state.modules[gKey].modules[mKey].enabled = !state.modules[gKey].modules[mKey].enabled; save(); renderModules(); }
function toggleSubcat(gKey, mKey, sKey) { state.modules[gKey].modules[mKey].subcategories[sKey].enabled = !state.modules[gKey].modules[mKey].subcategories[sKey].enabled; save(); renderModules(); }
function startEditSubcatItem(gKey, mKey, sKey, idx, span) {
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    const old = sub.items[idx].text;
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = old;
    span.replaceWith(inp); inp.focus();
    const finish = () => { const v = inp.value.trim(); if (v && v !== old) { sub.items[idx].text = v; save(); } renderSubcatItems(gKey, mKey, sKey); };
    inp.onblur = finish;
    inp.onkeydown = (e) => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') renderSubcatItems(gKey, mKey, sKey); };
}
function addSubcatItem(gKey, mKey, sKey, inputEl) {
    const v = inputEl.value.trim(); if (!v) return;
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    if (sub.items.some(i => i.text.toLowerCase() === v.toLowerCase())) { showToast('Уже есть!'); return; }
    sub.items.push({ text: v, enabled: true });
    inputEl.value = '';
    save(); renderSubcatItems(gKey, mKey, sKey);
}
function sortModules() {
    for (const g in state.modules) {
        for (const m in state.modules[g].modules) {
            for (const s in state.modules[g].modules[m].subcategories) {
                state.modules[g].modules[m].subcategories[s].items.sort((a, b) => a.text.localeCompare(b.text));
            }
        }
    }
    save(); renderModules(); showToast('Отсортировано');
}
function openEditSubcat(gKey, mKey, sKey) {
    editContext = { type: 'subcat', gKey, mKey, sKey };
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    document.getElementById('editTitle').textContent = `Редактирование: ${sub.name}`;
    document.getElementById('editTextarea').value = sub.items.map(i => i.text).join('\n');
    document.getElementById('editModal').classList.add('active');
}

// ============================================================
// МОДАЛЬНЫЕ ОКНА
// ============================================================
function closeEdit() { document.getElementById('editModal').classList.remove('active'); editContext = null; }
function saveEdit() {
    if (!editContext) return;
    const text = document.getElementById('editTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (editContext.type === 'list') target = state.lists[editContext.key].items;
    else target = state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items;
    const oldMap = {};
    target.forEach(i => { if (i && i.text) oldMap[i.text.toLowerCase()] = i.enabled; });
    const newItems = lines.map(t => ({ text: t, enabled: oldMap[t.toLowerCase()] !== undefined ? oldMap[t.toLowerCase()] : true }));
    if (editContext.type === 'list') state.lists[editContext.key].items = newItems;
    else state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items = newItems;
    save(); renderLists(); renderModules();
    closeEdit(); showToast(`Сохранено: ${lines.length}`);
}
function openBulkImport(type, key, mKey, sKey) {
    bulkContext = { type, key, mKey, sKey };
    let title = '';
    if (type === 'list') title = state.lists[key].name;
    else if (type === 'subcat') title = state.modules[key].modules[mKey].subcategories[sKey].name;
    document.getElementById('bulkImportTitle').textContent = `Импорт: ${title}`;
    document.getElementById('bulkImportTextarea').value = '';
    document.getElementById('bulkImportModal').classList.add('active');
}
function closeBulkImport() { document.getElementById('bulkImportModal').classList.remove('active'); bulkContext = null; }
function confirmBulkImport() {
    if (!bulkContext) return;
    const text = document.getElementById('bulkImportTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (bulkContext.type === 'list') target = state.lists[bulkContext.key].items;
    else target = state.modules[bulkContext.key].modules[bulkContext.mKey].subcategories[bulkContext.sKey].items;
    let added = 0, skipped = 0;
    lines.forEach(line => {
        if (target.some(i => i.text.toLowerCase() === line.toLowerCase())) skipped++;
        else { target.push({ text: line, enabled: true }); added++; }
    });
    save(); renderLists(); renderModules();
    closeBulkImport();
    showToast(`Добавлено: ${added}${skipped ? `, пропущено: ${skipped}` : ''}`);
}
function resetAll() {
    if (!confirm('Сбросить списки и модули? Правила сохранятся.')) return;
    state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    save(); renderLists(); renderModules();
    showToast('Сброшено');
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = init;
</script>
</body>
