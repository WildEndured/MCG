    document.getElementById('editTitle').textContent = `Редактирование: ${state.modifiers.name}`;
    document.getElementById('editTextarea').value = state.modifiers.items.map(i => i.text).join('\n');
    document.getElementById('editModal').classList.add('active');
}
function createModule(gKey, mKey, mod) {
    const div = document.createElement('div');
    div.className = `module ${mod.enabled ? '' : 'disabled'} ${mod.expanded ? 'open' : ''}`;
    let activeSubs = 0, totalSubs = 0, totalActive = 0, totalItems = 0;
    for (const sKey in mod.subcategories) {
        const sub = mod.subcategories[sKey];
        totalSubs++; if (sub.enabled) activeSubs++;
        totalItems += sub.items.length;
        totalActive += sub.items.filter(i => i.enabled).length;
    }
    div.innerHTML = `
        <div class="module-header">
            <div><h4>${mod.name}</h4><span class="module-counter">${totalActive}/${totalItems}</span></div>
            <div class="module-controls">
                <label style="font-size:0.72rem; cursor:pointer;">
                    <input type="checkbox" ${mod.enabled ? 'checked' : ''} onchange="toggleModule('${gKey}','${mKey}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="module-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'module-body';
    for (const sKey in mod.subcategories) body.appendChild(createSubcat(gKey, mKey, sKey, mod.subcategories[sKey]));
    div.querySelector('.module-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        mod.expanded = !mod.expanded; save(); renderModules();
    };
    div.querySelector('.module-toggle').onclick = (e) => { e.stopPropagation(); mod.expanded = !mod.expanded; save(); renderModules(); };
    div.appendChild(body);
    return div;
}
function createSubcat(gKey, mKey, sKey, sub) {
    const div = document.createElement('div');
    div.className = `subcat ${sub.enabled ? '' : 'disabled'} ${sub.expanded ? 'open' : ''}`;
    const active = sub.items.filter(i => i.enabled).length;
    const withImages = sub.items.filter(i => i.image).length;
    div.innerHTML = `
        <div class="subcat-header">
            <div style="display:flex; align-items:center; gap:6px;">
                <input type="checkbox" ${sub.enabled ? 'checked' : ''} style="accent-color: var(--accent); cursor:pointer;" onclick="event.stopPropagation(); toggleSubcat('${gKey}','${mKey}','${sKey}')">
                <span class="subcat-name">${sub.name}</span>
                <span class="subcat-counter">(${active}/${sub.items.length}${withImages ? ` · 🖼️${withImages}` : ''})</span>
            </div>
            <div class="subcat-controls">
                <button class="icon-btn" onclick="event.stopPropagation(); openEditSubcat('${gKey}','${mKey}','${sKey}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); openBulkImport('subcat','${gKey}','${mKey}','${sKey}')">📥</button>
                <button class="subcat-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'subcat-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addSubcatItem('${gKey}','${mKey}','${sKey}', this)">
            <button onclick="addSubcatItem('${gKey}','${mKey}','${sKey}', this.previousElementSibling)">+</button>
        </div>
        <div class="item-list" id="sub-values-${gKey}-${mKey}-${sKey}"></div>
    `;
    div.querySelector('.subcat-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        sub.expanded = !sub.expanded; save(); renderModules();
    };
    div.querySelector('.subcat-toggle').onclick = (e) => { e.stopPropagation(); sub.expanded = !sub.expanded; save(); renderModules(); };
    div.appendChild(body);
    setTimeout(() => renderSubcatItems(gKey, mKey, sKey), 0);
    return div;
}
function renderSubcatItems(gKey, mKey, sKey) {
    const container = document.getElementById(`sub-values-${gKey}-${mKey}-${sKey}`);
    if (!container) return;
    container.innerHTML = '';
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    sub.items.forEach((item, idx) => {
        if (!item || !item.text) return;
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderSubcatItems(gKey, mKey, sKey); };
        const thumbWrap = document.createElement('div');
        if (item.image) {
            const img = document.createElement('img');
            img.className = 'item-thumb'; img.src = item.image;
            img.onclick = () => openImageViewer(item.image);
            img.oncontextmenu = (e) => { e.preventDefault(); removeImage({ type: 'subcat', gKey, mKey, sKey, index: idx }); };
            thumbWrap.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'item-thumb-placeholder'; ph.textContent = '🖼️';
            ph.onclick = () => pickImage({ type: 'subcat', gKey, mKey, sKey, index: idx });
            thumbWrap.appendChild(ph);
        }
        const txt = document.createElement('span');
        txt.className = 'item-text'; txt.textContent = item.text;
        txt.onclick = () => startEditSubcatItem(gKey, mKey, sKey, idx, txt);
        const del = document.createElement('button');
        del.className = 'icon-btn'; del.textContent = '❌';
        del.onclick = () => { sub.items.splice(idx, 1); save(); renderSubcatItems(gKey, mKey, sKey); };
        row.appendChild(cb); row.appendChild(thumbWrap); row.appendChild(txt); row.appendChild(del);
        container.appendChild(row);
    });
}
function toggleModule(gKey, mKey) { state.modules[gKey].modules[mKey].enabled = !state.modules[gKey].modules[mKey].enabled; save(); renderModules(); renderBuilder(); }
function toggleSubcat(gKey, mKey, sKey) { state.modules[gKey].modules[mKey].subcategories[sKey].enabled = !state.modules[gKey].modules[mKey].subcategories[sKey].enabled; save(); renderModules(); renderBuilder(); }
function startEditSubcatItem(gKey, mKey, sKey, idx, span) {
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    const old = sub.items[idx].text;
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = old;
    span.replaceWith(inp); inp.focus();
    const finish = () => { const v = inp.value.trim(); if (v && v !== old) { sub.items[idx].text = v; save(); } renderSubcatItems(gKey, mKey, sKey); };
    inp.onblur = finish;
    inp.onkeydown = (e) => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') renderSubcatItems(gKey, mKey, sKey); };
}
function addSubcatItem(gKey, mKey, sKey, inputEl) {
    const v = inputEl.value.trim(); if (!v) return;
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    if (sub.items.some(i => i.text.toLowerCase() === v.toLowerCase())) { showToast('Уже есть!'); return; }
    sub.items.push({ text: v, enabled: true, image: null });
    inputEl.value = '';
    save(); renderSubcatItems(gKey, mKey, sKey);
}
function sortModules() {
    for (const g in state.modules) {
        for (const m in state.modules[g].modules) {
            for (const s in state.modules[g].modules[m].subcategories) {
                state.modules[g].modules[m].subcategories[s].items.sort((a, b) => a.text.localeCompare(b.text));
            }
        }
    }
    if (state.modifiers) state.modifiers.items.sort((a, b) => a.text.localeCompare(b.text));
    save(); renderModules(); showToast('Отсортировано');
}
function openEditSubcat(gKey, mKey, sKey) {
    editContext = { type: 'subcat', gKey, mKey, sKey };
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    document.getElementById('editTitle').textContent = `Редактирование: ${sub.name}`;
    document.getElementById('editTextarea').value = sub.items.map(i => i.text).join('\n');
    document.getElementById('editModal').classList.add('active');
}

// ============================================================
// ПРАВИЛА
// ============================================================
function getAllPaths() {
    const paths = [];
    paths.push({ path: 'list.races', name: '🧬 Расы', items: state.lists.races.items });
    paths.push({ path: 'list.styles', name: '👗 Стили', items: state.lists.styles.items });
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            const allItems = [];
            for (const sKey in mod.subcategories) allItems.push(...mod.subcategories[sKey].items);
            paths.push({ path: `${gKey}.${mKey}`, name: mod.name, items: allItems });
        }
    }
    return paths;
}
function populateRuleSelects() {
    const paths = getAllPaths();
    const selects = ['newRuleActModule', 'newRuleExclModule'];
    selects.forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '';
        paths.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.path; opt.textContent = p.name;
            sel.appendChild(opt);
        });
        if (currentVal) sel.value = currentVal;
    });
    onRuleActModuleChange();
    if (document.getElementById('conditionsContainer').children.length === 0) addCondition();
}
function createConditionRow(cond) {
    const div = document.createElement('div');
    div.className = 'rule-row';
    const paths = getAllPaths();
    const moduleSelect = document.createElement('select');
    moduleSelect.className = 'cond-module';
    paths.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.path; opt.textContent = p.name;
        if (cond && cond.path === p.path) opt.selected = true;
        moduleSelect.appendChild(opt);
    });
    const arrow = document.createElement('span');
    arrow.className = 'arrow'; arrow.textContent = '=';
    const valueSelect = document.createElement('select');
    valueSelect.className = 'cond-value';
    const fillValues = () => {
        valueSelect.innerHTML = '';
        const items = getItemsByPath(moduleSelect.value);
        items.filter(i => i.enabled).forEach(i => {
            const opt = document.createElement('option');
            opt.value = i.text; opt.textContent = i.text;
            if (cond && cond.value === i.text) opt.selected = true;
            valueSelect.appendChild(opt);
        });
    };
    fillValues();
    moduleSelect.onchange = fillValues;
    const negateLabel = document.createElement('label');
    negateLabel.style.fontSize = '0.72rem';
    negateLabel.style.display = 'flex';
    negateLabel.style.alignItems = 'center';
    negateLabel.style.gap = '4px';
    const negateCb = document.createElement('input');
    negateCb.type = 'checkbox';
    negateCb.className = 'cond-negate';
    if (cond && cond.negate) negateCb.checked = true;
    negateLabel.appendChild(negateCb);
    negateLabel.appendChild(document.createTextNode('НЕ'));
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '❌';
    removeBtn.style.background = 'none';
    removeBtn.style.border = 'none';
    removeBtn.style.color = 'var(--accent)';
    removeBtn.style.cursor = 'pointer';
    removeBtn.onclick = () => div.remove();
    div.appendChild(moduleSelect); div.appendChild(arrow); div.appendChild(valueSelect);
    div.appendChild(negateLabel); div.appendChild(removeBtn);
    return div;
}
function addCondition() {
    document.getElementById('conditionsContainer').appendChild(createConditionRow(null));
}
function onRuleTypeChange() {
    const t = document.getElementById('newRuleType').value;
    document.getElementById('actionReplaceRow').style.display = t === 'replace' ? 'flex' : 'none';
    document.getElementById('actionExcludeRow').style.display = t === 'exclude' ? 'flex' : 'none';
    document.getElementById('actionAddRow').style.display = t === 'add' ? 'flex' : 'none';
}
function onRuleActModuleChange() {
    const sel = document.getElementById('newRuleActModule');
    const valSel = document.getElementById('newRuleActValue');
    if (!sel || !valSel) return;
    const items = getItemsByPath(sel.value);
    valSel.innerHTML = '';
    items.filter(i => i.enabled).forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.text; opt.textContent = i.text;
        valSel.appendChild(opt);
    });
}
function addRule() {
    const type = document.getElementById('newRuleType').value;
    const conditions = [];
    const condRows = document.querySelectorAll('#conditionsContainer .rule-row');
    condRows.forEach(row => {
        const path = row.querySelector('.cond-module').value;
        const value = row.querySelector('.cond-value').value;
        const negate = row.querySelector('.cond-negate').checked;
        if (path && value) conditions.push({ path, value, negate });
    });
    if (conditions.length === 0) { showToast('Добавьте условие!'); return; }
    const rule = { id: Date.now(), type, conditions, action: {}, enabled: true, chain: document.getElementById('newRuleChain').checked };
    if (type === 'replace') {
        const actPath = document.getElementById('newRuleActModule').value;
        const actValue = document.getElementById('newRuleActValue').value;
        if (!actPath || !actValue) { showToast('Заполните!'); return; }
        rule.action = { path: actPath, value: actValue };
    } else if (type === 'exclude') {
        const actPath = document.getElementById('newRuleExclModule').value;
        const actValues = document.getElementById('newRuleExclValue').value.split(',').map(s => s.trim()).filter(s => s);
        if (!actPath || actValues.length === 0) { showToast('Заполните!'); return; }
        rule.action = { path: actPath, values: actValues };
    } else if (type === 'add') {
        const text = document.getElementById('newRuleAddText').value.trim();
        if (!text) { showToast('Введите текст!'); return; }
        rule.action = { text };
    }
    state.rules.push(rule);
    save(); renderRules();
    showToast('Правило добавлено');
    document.getElementById('newRuleExclValue').value = '';
    document.getElementById('newRuleAddText').value = '';
    document.getElementById('conditionsContainer').innerHTML = '';
    document.getElementById('newRuleChain').checked = false;
    addCondition();
}
function renderRules() {
    const container = document.getElementById('rulesContainer');
    if (!container) return;
    container.innerHTML = '';
    if (state.rules.length === 0) {
        container.innerHTML = '<div class="empty-state">Пока нет правил.</div>';
        return;
    }
    state.rules.forEach(rule => {
        const div = document.createElement('div');
        div.className = `rule-card ${rule.enabled ? '' : 'disabled'}`;
        const typeLabel = rule.type === 'replace' ? '🔵 Замена' : rule.type === 'exclude' ? '🔴 Искл' : '🟡 Текст';
        const typeClass = rule.type === 'replace' ? 'rule-type-replace' : rule.type === 'exclude' ? 'rule-type-exclude' : 'rule-type-add';
        let condText = rule.conditions.map(c => {
            const name = getPathName(c.path) || c.path;
            return `${name} ${c.negate ? '≠' : '='} <b style="color:var(--rules);">${c.value}</b>`;
        }).join(' <b>И</b> ');
        let actionText = '';
        if (rule.type === 'replace') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `<b>${actName}</b> = <b style="color:var(--clothes);">${rule.action.value}</b>`;
        } else if (rule.type === 'exclude') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `убрать из <b>${actName}</b>: ${rule.action.values.join(', ')}`;
        } else {
            actionText = `+ ${rule.action.text}`;
        }
        const chainBadge = rule.chain ? '<span class="chain-badge">🔗</span>' : '';
        div.innerHTML = `
            <div class="rule-header">
                <span class="rule-type ${typeClass}">${typeLabel}${chainBadge}</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <label style="font-size:0.72rem; cursor:pointer;">
                        <input type="checkbox" ${rule.enabled ? 'checked' : ''} onchange="toggleRule(${rule.id})" style="accent-color: var(--rules);"> Вкл
                    </label>
                    <button class="icon-btn" onclick="deleteRule(${rule.id})">❌</button>
                </div>
            </div>
            <div class="rule-body"><b>Если</b> ${condText}<br><b>Тогда</b> ${actionText}</div>
        `;
        container.appendChild(div);
    });
}
function toggleRule(id) { const r = state.rules.find(x => x.id === id); if (r) { r.enabled = !r.enabled; save(); renderRules(); } }
function deleteRule(id) { state.rules = state.rules.filter(x => x.id !== id); save(); renderRules(); }
function exportRules() {
    const data = JSON.stringify({ version: 3, rules: state.rules }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rules_${Date.now()}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Экспортировано');
}
function importRules(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.rules || !Array.isArray(data.rules)) throw new Error('Неверный формат');
            if (!confirm(`Загрузить ${data.rules.length} правил?`)) return;
            state.rules = data.rules;
            save(); renderRules();
            showToast('Загружено');
        } catch (err) { alert('Ошибка: ' + err.message); }
        event.target.value = '';
    };
    reader.readAsText(file);
}

// ============================================================
// МОДАЛЬНЫЕ ОКНА
// ============================================================
function closeEdit() { document.getElementById('editModal').classList.remove('active'); editContext = null; }
function saveEdit() {
    if (!editContext) return;
    const text = document.getElementById('editTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (editContext.type === 'list') target = state.lists[editContext.key].items;
    else if (editContext.type === 'modifier') target = state.modifiers.items;
    else target = state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items;
    const oldMap = {};
    target.forEach(i => { if (i && i.text) oldMap[i.text.toLowerCase()] = { enabled: i.enabled, image: i.image || null }; });
    const newItems = lines.map(t => {
        const old = oldMap[t.toLowerCase()];
        return { text: t, enabled: old ? old.enabled : true, image: old ? old.image : null };
    });
    if (editContext.type === 'list') state.lists[editContext.key].items = newItems;
    else if (editContext.type === 'modifier') state.modifiers.items = newItems;
    else state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items = newItems;
    save(); renderLists(); renderModules(); renderBuilder();
    closeEdit(); showToast(`Сохранено: ${lines.length}`);
}
function openBulkImport(type, key, mKey, sKey) {
    bulkContext = { type, key, mKey, sKey };
    let title = '';
    if (type === 'list') title = state.lists[key].name;
    else if (type === 'modifier') title = state.modifiers.name;
    else if (type === 'subcat') title = state.modules[key].modules[mKey].subcategories[sKey].name;
    document.getElementById('bulkImportTitle').textContent = `Импорт: ${title}`;
    document.getElementById('bulkImportTextarea').value = '';
    document.getElementById('bulkImportModal').classList.add('active');
}
function closeBulkImport() { document.getElementById('bulkImportModal').classList.remove('active'); bulkContext = null; }
function confirmBulkImport() {
    if (!bulkContext) return;
    const text = document.getElementById('bulkImportTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (bulkContext.type === 'list') target = state.lists[bulkContext.key].items;
    else if (bulkContext.type === 'modifier') target = state.modifiers.items;
    else target = state.modules[bulkContext.key].modules[bulkContext.mKey].subcategories[bulkContext.sKey].items;
    let added = 0, skipped = 0;
    lines.forEach(line => {
        if (target.some(i => i.text.toLowerCase() === line.toLowerCase())) skipped++;
        else { target.push({ text: line, enabled: true, image: null }); added++; }
    });
    save(); renderLists(); renderModules(); renderBuilder();
    closeBulkImport();
    showToast(`+${added}${skipped ? `, пропущено ${skipped}` : ''}`);
}
function resetAll() {
    if (!confirm('Сбросить списки и модули? Правила, образ и таблица сохранятся.')) return;
    state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    state.modifiers = JSON.parse(JSON.stringify(DEFAULT_MODIFIERS));
    state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    save(); renderLists(); renderModules(); renderBuilder();
    showToast('Сброшено');
}

// ============================================================
// ТАБЛИЦА
// ============================================================
function getTableRows() {
    const sections = {
        lists:      { name: "📋 Списки",     class: "table-section-lists",      rows: [] },
        appearance: { name: "🎨 Внешность",  class: "table-section-appearance", rows: [] },
        clothes:    { name: "👗 Одежда",     class: "table-section-clothes",    rows: [] },
        race:       { name: "🧬 Раса",       class: "table-section-race",       rows: [] }
    };
    sections.lists.rows.push({ path: 'list.races', name: "🧬 Расы", items: state.lists.races.items.filter(i => i.enabled), isClothes: false });
    sections.lists.rows.push({ path: 'list.styles', name: "👗 Стили", items: state.lists.styles.items.filter(i => i.enabled), isClothes: false });
    for (const mKey in state.modules.race.modules) {
        const mod = state.modules.race.modules[mKey];
        const path = `race.${mKey}`;
        sections.race.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: false });
    }
    for (const mKey in state.modules.appearance.modules) {
        const mod = state.modules.appearance.modules[mKey];
        const path = `appearance.${mKey}`;
        sections.appearance.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: false });
    }
    for (const mKey in state.modules.clothes.modules) {
        const mod = state.modules.clothes.modules[mKey];
        const path = `clothes.${mKey}`;
        sections.clothes.rows.push({ path, name: mod.name, items: collectItems(path), isClothes: true });
    }
    return sections;
}
function collectItems(path) {
    const all = [];
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].items;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all.filter(i => i.enabled);
}
function renderTable() {
    const container = document.getElementById('tableContainer');
    if (!container) return;
    container.innerHTML = '';
    // Таблица не показывается в UI (убрана вкладка), но функция нужна для совместимости
}

// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = init;
