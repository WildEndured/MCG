<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор Персонажей + Изображения</title>
<style>
:root {
    --bg: #1a1a2e;
    --container: #16213e;
    --accent: #e94560;
    --text: #fff;
    --secondary: #0f3460;
    --header: #0d1b2a;
    --appearance: #e94560;
    --clothes: #4a90d9;
    --race: #d9a441;
    --lists: #5cb85c;
    --rules: #9b59b6;
    --mods: #7b68ee;
}
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; min-height: 100vh;
}
.app {
    width: 100%; max-width: 950px;
    background: var(--container);
    border-radius: 15px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    height: fit-content;
}
.tabs { display: flex; background: var(--header); flex-wrap: wrap; }
.tab-btn {
    flex: 1; padding: 12px 6px; background: none; border: none;
    color: #888; font-size: 0.85rem; cursor: pointer; font-weight: bold;
    border-bottom: 3px solid transparent; transition: 0.3s;
    min-width: 80px;
}
.tab-btn.active {
    color: var(--text); border-bottom-color: var(--accent);
    background: var(--container);
}
.tab-content { padding: 20px; display: none; }
.tab-content.active { display: block; }

/* Генератор */
.result-box {
    background: var(--secondary); padding: 20px;
    border-radius: 10px; margin-bottom: 20px;
    max-height: 600px; overflow-y: auto;
}
.result-line {
    display: flex; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.9rem; gap: 15px;
    align-items: center;
}
.result-line:last-child { border-bottom: none; }
.result-cat { color: #888; font-weight: bold; font-size: 0.82rem; }
.result-val { color: #fff; font-weight: bold; text-align: right; flex-grow: 1; }
.result-line.main .result-val { color: var(--accent); font-size: 1.05rem; }
.result-line.slot .result-cat { color: var(--clothes); }
.result-line.extra .result-val { color: var(--rules); font-style: italic; }

/* Превью значения в результате */
.result-value-block {
    display: flex; align-items: center; gap: 10px;
    justify-content: flex-end; flex-grow: 1;
    flex-wrap: wrap;
}
.result-thumb {
    width: 40px; height: 40px; border-radius: 6px;
    object-fit: cover; cursor: pointer;
    border: 1px solid #333; transition: 0.2s;
    flex-shrink: 0;
}
.result-thumb:hover { border-color: var(--accent); transform: scale(1.1); }
.result-thumbs { display: flex; gap: 5px; flex-wrap: wrap; }

/* Результат-значение из нескольких элементов (например, "Arched bangs, Medium bangs") */
.result-values-list {
    display: flex; flex-direction: column; gap: 6px;
    align-items: flex-end; flex-grow: 1;
}
.result-value-row {
    display: flex; align-items: center; gap: 8px;
    justify-content: flex-end;
}

.btn-main {
    background: var(--accent); color: white; border: none;
    padding: 15px 30px; font-size: 1rem; border-radius: 50px;
    cursor: pointer; font-weight: bold; text-transform: uppercase;
    width: 100%; margin-bottom: 10px; transition: 0.2s;
}
.btn-main:hover { background: #ff2e63; transform: scale(1.02); }
.btn-secondary {
    background: var(--secondary); color: white;
    border: 1px solid #555; padding: 9px 18px;
    border-radius: 5px; cursor: pointer; font-size: 0.85rem;
    transition: 0.2s;
}
.btn-secondary:hover { background: #1a4a7a; }

.presets-bar {
    display: flex; gap: 8px; margin-bottom: 15px;
    flex-wrap: wrap; align-items: center;
}
.presets-bar span { font-size: 0.85rem; color: #888; }
.preset-btn {
    padding: 6px 12px; font-size: 0.8rem;
    border-radius: 20px; cursor: pointer;
    background: var(--secondary); color: white;
    border: 1px solid #555; transition: 0.2s;
}
.preset-btn:hover { background: var(--accent); border-color: var(--accent); }
.counter-badge {
    font-size: 0.75rem; color: #888; margin-left: auto;
    padding: 4px 10px; background: rgba(0,0,0,0.3); border-radius: 10px;
}

/* История */
.history-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.search-input {
    flex-grow: 1; padding: 10px; border-radius: 5px;
    border: 1px solid #333; background: #0d1b2a; color: white;
}
.history-list {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 550px; overflow-y: auto;
}
.history-item {
    background: #0d1b2a; padding: 12px 15px;
    border-radius: 8px; border-left: 4px solid var(--secondary);
}
.history-item.fav { border-left-color: gold; }
.history-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 6px;
}
.history-date { font-size: 0.72rem; color: #888; }
.history-details { font-size: 0.83rem; color: #ccc; line-height: 1.5; }
.history-actions { display: flex; gap: 4px; }
.icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.05rem; padding: 3px; opacity: 0.6;
    color: white; transition: 0.2s;
}
.icon-btn:hover { opacity: 1; transform: scale(1.1); }
.icon-btn.fav-active { opacity: 1; color: gold; }
.icon-btn.img-active { color: var(--clothes); opacity: 1; }

/* Списки */
.toolbar {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
    align-items: center;
}
.list-block {
    background: #0d1b2a; border-radius: 10px;
    margin-bottom: 15px; overflow: hidden;
    border-left: 3px solid var(--lists);
}
.list-block.disabled { opacity: 0.5; }
.list-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 12px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.list-header h3 { margin: 0; font-size: 1rem; }
.list-counter { font-size: 0.72rem; color: #888; }
.list-controls { display: flex; gap: 8px; align-items: center; }
.list-body { padding: 12px 15px; display: none; }
.list-block.open .list-body { display: block; }

.add-row { display: flex; gap: 5px; margin-bottom: 10px; }
.add-row input {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.add-row button {
    padding: 6px 12px; background: var(--accent);
    color: white; border: none; border-radius: 5px;
    cursor: pointer; font-size: 0.85rem;
}
.add-row button.import-btn { background: var(--clothes); }

.item-list { max-height: 350px; overflow-y: auto; }
.item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; border-bottom: 1px solid #1a1a2e;
    font-size: 0.85rem;
}
.item.disabled { opacity: 0.4; text-decoration: line-through; }
.item-text {
    flex-grow: 1; cursor: pointer; padding: 3px;
    border-radius: 3px; word-break: break-word;
}
.item-text:hover { background: rgba(255,255,255,0.1); }
.item input[type="text"] {
    flex-grow: 1; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--accent); background: #1a1a2e;
    color: white; font-size: 0.85rem;
}
.item input[type="checkbox"] {
    cursor: pointer; width: 15px; height: 15px;
    accent-color: var(--accent); flex-shrink: 0;
}

/* Миниатюра в списке */
.item-thumb {
    width: 32px; height: 32px; border-radius: 4px;
    object-fit: cover; cursor: pointer;
    border: 1px solid #333; transition: 0.2s;
    flex-shrink: 0;
}
.item-thumb:hover { border-color: var(--accent); }
.item-thumb-placeholder {
    width: 32px; height: 32px; border-radius: 4px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 0.8rem; color: #555;
    border: 1px dashed #333; transition: 0.2s;
    flex-shrink: 0;
}
.item-thumb-placeholder:hover { color: var(--accent); border-color: var(--accent); }

/* Модули */
.group-title {
    font-size: 1rem; font-weight: bold;
    padding: 11px 15px; margin-top: 15px;
    border-radius: 8px; color: white;
    cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
}
.group-appearance { background: linear-gradient(90deg, var(--appearance), transparent); }
.group-clothes { background: linear-gradient(90deg, var(--clothes), transparent); }
.group-race { background: linear-gradient(90deg, var(--race), transparent); }
.group-mods { background: linear-gradient(90deg, var(--mods), transparent); }
.group-body { padding-left: 8px; }
.group-body.collapsed { display: none; }

.module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--accent);
}
.module.disabled { opacity: 0.5; }
.module-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.module-header h4 { margin: 0; font-size: 0.9rem; }
.module-counter { font-size: 0.7rem; color: #888; }
.module-controls { display: flex; gap: 8px; align-items: center; }
.module-body { padding: 10px 15px 15px; display: none; }
.module.open .module-body { display: block; }
.module-toggle {
    background: none; border: none; color: white;
    font-size: 1rem; cursor: pointer; padding: 3px;
    transition: 0.2s;
}
.module.open .module-toggle { transform: rotate(180deg); }

.simple-module {
    background: #0d1b2a; border-radius: 8px;
    margin-top: 8px; overflow: hidden;
    border-left: 3px solid var(--mods);
}
.simple-module.disabled { opacity: 0.5; }
.simple-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header); cursor: pointer; user-select: none;
}
.simple-header h4 { margin: 0; font-size: 0.9rem; }
.simple-body { padding: 10px 15px 15px; display: none; }
.simple-module.open .simple-body { display: block; }

.subcat {
    background: #1a1a2e; border-radius: 6px;
    margin-top: 6px; overflow: hidden;
    border-left: 2px solid var(--secondary);
}
.subcat.disabled { opacity: 0.4; }
.subcat-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 8px 12px;
    cursor: pointer; user-select: none; font-size: 0.85rem;
}
.subcat-header:hover { background: rgba(255,255,255,0.03); }
.subcat-name { font-weight: bold; }
.subcat-counter { font-size: 0.7rem; color: #888; margin-left: 8px; }
.subcat-controls { display: flex; gap: 5px; align-items: center; }
.subcat-body {
    padding: 8px 12px 12px;
    border-top: 1px solid #0d1b2a;
    display: none;
}
.subcat.open .subcat-body { display: block; }
.subcat-toggle {
    background: none; border: none; color: white;
    font-size: 0.8rem; cursor: pointer; padding: 3px;
    transition: 0.2s;
}
.subcat.open .subcat-toggle { transform: rotate(180deg); }

/* ПРАВИЛА */
.rule-card {
    background: #0d1b2a; border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
    border-left: 3px solid var(--rules);
}
.rule-card.disabled { opacity: 0.5; }
.rule-header {
    display: flex; justify-content: space-between;
    align-items: center; padding: 10px 15px;
    background: var(--header);
}
.rule-header .rule-type {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
    background: var(--rules); color: white; font-weight: bold;
    text-transform: uppercase;
}
.rule-type-replace { background: var(--clothes); }
.rule-type-exclude { background: var(--accent); }
.rule-type-add { background: var(--race); color: #1a1a2e; }

.rule-body { padding: 12px 15px; font-size: 0.85rem; line-height: 1.6; }
.rule-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.rule-row label { font-size: 0.8rem; color: #888; min-width: 100px; }
.rule-row select, .rule-row input[type="text"] {
    flex-grow: 1; padding: 6px 10px; border-radius: 5px;
    border: 1px solid #333; background: #1a1a2e;
    color: white; font-size: 0.85rem;
    min-width: 130px;
}
.rule-row .arrow { color: var(--rules); font-weight: bold; font-size: 1.1rem; }

.condition-block {
    background: #1a1a2e; padding: 10px; border-radius: 6px;
    margin-bottom: 8px; border-left: 2px solid var(--rules);
}
.condition-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 0.8rem; color: var(--rules);
    font-weight: bold;
}
.condition-header button {
    background: none; border: none; color: var(--accent);
    cursor: pointer; font-size: 1rem;
}
.add-rule-form {
    background: #0d1b2a; padding: 15px;
    border-radius: 8px; border: 1px dashed var(--rules);
    margin-bottom: 15px;
}
.empty-state {
    text-align: center; color: #666; padding: 30px;
    font-size: 0.9rem;
}
.chain-badge {
    font-size: 0.65rem; padding: 2px 6px; border-radius: 8px;
    background: var(--race); color: #1a1a2e; font-weight: bold;
    margin-left: 6px;
}

/* Модальное окно */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: none; justify-content: center; align-items: center;
    padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--container); padding: 25px;
    border-radius: 12px; max-width: 550px; width: 100%;
    max-height: 85vh; overflow-y: auto;
}
.modal h3 { margin-top: 0; }
.modal textarea {
    width: 100%; height: 200px; padding: 10px;
    background: #0d1b2a; color: white;
    border: 1px solid #333; border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; resize: vertical;
}
.modal-actions {
    display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
}
/* Просмотр изображения */
.image-viewer-modal {
    max-width: 90vw; max-height: 90vh;
    background: transparent; padding: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 15px;
}
.image-viewer-modal img {
    max-width: 100%; max-height: 75vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
}

.toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%); background: #333;
    color: white; padding: 10px 20px; border-radius: 20px;
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gen', this)">🎲 Генератор</button>
        <button class="tab-btn" onclick="switchTab('hist', this)">📜 История</button>
        <button class="tab-btn" onclick="switchTab('lists', this)">📋 Списки</button>
        <button class="tab-btn" onclick="switchTab('mod', this)">⚙️ Модули</button>
        <button class="tab-btn" onclick="switchTab('rules', this)">🔗 Правила</button>
    </div>

    <div id="tab-gen" class="tab-content active">
        <div class="presets-bar">
            <span>Пресеты:</span>
            <button class="preset-btn" onclick="applyPreset('portrait')">👤 Портрет</button>
            <button class="preset-btn" onclick="applyPreset('full')">🧍 Полный рост</button>
            <button class="preset-btn" onclick="applyPreset('race')">🧬 Только раса</button>
            <button class="preset-btn" onclick="applyPreset('all')">✅ Всё</button>
            <span class="counter-badge" id="genCounter">Создано: 0</span>
        </div>
        <div class="result-box" id="resultBox">
            <p style="text-align:center; color:#888;">Нажмите «Сгенерировать»</p>
        </div>
        <button class="btn-main" onclick="generate()">Сгенерировать!</button>
        <button class="btn-secondary" style="width:100%; margin-bottom:8px;" onclick="copyResult()">📋 Скопировать промпт</button>
        <button class="btn-secondary" style="width:100%;" onclick="copyShort()">📋 Скопировать кратко</button>
    </div>

    <div id="tab-hist" class="tab-content">
        <div class="history-controls">
            <input type="text" id="search" class="search-input" placeholder="Поиск..." oninput="renderHistory()">
            <button class="btn-secondary" onclick="clearHistory()">🗑 Удалить всё</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div id="tab-lists" class="tab-content">
        <div class="toolbar">
            <button class="btn-secondary" onclick="sortLists()">🔤 Сортировать</button>
            <button class="btn-secondary" onclick="resetAll()">↺ Сброс</button>
            <button class="btn-secondary" onclick="clearAllImages()">🖼️ Очистить все картинки</button>
        </div>
        <div id="listsContainer"></div>
    </div>

    <div id="tab-mod" class="tab-content">
        <div class="toolbar">
            <input type="text" id="moduleSearch" class="search-input" placeholder="🔍 Поиск по модулям..." oninput="renderModules()" style="flex-grow:1;">
            <button class="btn-secondary" onclick="sortModules()">🔤 Сортировать</button>
            <button class="btn-secondary" onclick="resetAll()">↺ Сброс</button>
        </div>
        <div id="modulesContainer"></div>
    </div>

    <div id="tab-rules" class="tab-content">
        <div class="add-rule-form">
            <h4 style="margin-top:0;">➕ Новое правило</h4>
            <div class="rule-row">
                <label>Тип:</label>
                <select id="newRuleType" onchange="onRuleTypeChange()">
                    <option value="replace">🔵 Замена (если X → Y)</option>
                    <option value="exclude">🔴 Исключение (если X → убрать Y)</option>
                    <option value="add">🟡 Добавить текст (если X → +текст)</option>
                </select>
            </div>
            <div class="condition-block">
                <div class="condition-header">
                    <span>Условия (И)</span>
                    <button onclick="addCondition()" title="Добавить условие">➕</button>
                </div>
                <div id="conditionsContainer"></div>
            </div>
            <div class="rule-row" id="actionReplaceRow">
                <label>Действие:</label>
                <select id="newRuleActModule"></select>
                <span class="arrow">=</span>
                <select id="newRuleActValue"></select>
            </div>
            <div class="rule-row" id="actionExcludeRow" style="display:none;">
                <label>Убрать из:</label>
                <select id="newRuleExclModule"></select>
                <input type="text" id="newRuleExclValue" placeholder="Значения через запятую">
            </div>
            <div class="rule-row" id="actionAddRow" style="display:none;">
                <label>Текст:</label>
                <input type="text" id="newRuleAddText" placeholder="torn clothes, pale skin">
            </div>
            <div class="rule-row">
                <label>Цепочка:</label>
                <label style="display:flex; align-items:center; gap:5px; font-size:0.8rem; cursor:pointer;">
                    <input type="checkbox" id="newRuleChain"> Может активировать другие правила
                </label>
            </div>
            <button class="btn-main" style="width:auto; margin:10px 0 0 0; padding:10px 20px; font-size:0.85rem;" onclick="addRule()">Добавить правило</button>
        </div>
        <div class="toolbar">
            <button class="btn-secondary" onclick="exportRules()">💾 Экспорт правил</button>
            <button class="btn-secondary" onclick="document.getElementById('ruleFileInput').click()">📂 Импорт правил</button>
            <input type="file" id="ruleFileInput" accept=".json" style="display:none;" onchange="importRules(event)">
        </div>
        <div id="rulesContainer"></div>
    </div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="editTitle">Редактирование</h3>
        <p style="color:#888; font-size:0.85rem;">Один элемент на строку (или через запятую).</p>
        <textarea id="editTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEdit()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="saveEdit()">Сохранить</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="bulkImportModal">
    <div class="modal">
        <h3 id="bulkImportTitle">Массовый импорт</h3>
        <p style="color:#888; font-size:0.85rem;">Вставьте значения: одно на строку или через запятую.</p>
        <textarea id="bulkImportTextarea"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeBulkImport()">Отмена</button>
            <button class="btn-main" style="width:auto; margin:0;" onclick="confirmBulkImport()">Добавить</button>
        </div>
    </div>
</div>

<!-- ПРОСМОТР ИЗОБРАЖЕНИЯ -->
<div class="modal-overlay" id="imageViewerModal">
    <div class="modal image-viewer-modal">
        <img id="imageViewerImg" src="" alt="">
        <button class="btn-secondary" onclick="closeImageViewer()">Закрыть</button>
    </div>
</div>

<!-- СКРЫТЫЙ INPUT ДЛЯ ФАЙЛОВ -->
<input type="file" id="imageFileInput" accept="image/*" style="display:none;">

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ДЕФОЛТНЫЕ ДАННЫЕ
// ============================================================
const DEFAULT_LISTS = {

// ============================================================
// INIT
// ============================================================
function init() {
    const savedLists = localStorage.getItem('cg_lists_v3');
    const savedMods = localStorage.getItem('cg_modifiers_v2');
    const savedModules = localStorage.getItem('cg_modules_v3');
    const savedRules = localStorage.getItem('cg_rules_v2');
    const savedHist = localStorage.getItem('cg_history_v2');
    const savedCount = localStorage.getItem('cg_gen_count_v2');

    state.lists = savedLists ? JSON.parse(savedLists) : null;
    state.modifiers = savedMods ? JSON.parse(savedMods) : null;
    state.modules = savedModules ? JSON.parse(savedModules) : null;
    state.rules = savedRules ? JSON.parse(savedRules) : [];
    state.history = savedHist ? JSON.parse(savedHist) : [];
    state.genCount = savedCount ? parseInt(savedCount) : 0;

    if (!state.lists || !isValidListStructure(state.lists)) {
        state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    }
    if (!state.modifiers) {
        state.modifiers = JSON.parse(JSON.stringify(DEFAULT_MODIFIERS));
    }
    if (!state.modules || !isValidModuleStructure(state.modules)) {
        state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    }
    sanitizeData();
    save();
    renderLists();
    renderModules();
    renderRules();
    renderHistory();
    populateRuleSelects();
    updateCounter();

    // === Автомиграция: с v2 на v3 (если нужно) ===
    // Пробуем подхватить старые данные если новые пусты
    if (!savedLists) {
        const oldLists = localStorage.getItem('cg_lists_v2');
        if (oldLists) {
            try {
                state.lists = JSON.parse(oldLists);
                sanitizeData();
                save();
            } catch(e) {}
        }
    }
}

function isValidListStructure(lists) {
    for (const key in lists) {
        const list = lists[key];
        if (!list || !Array.isArray(list.items)) return false;
        if (!list.items.some(i => i && typeof i.text === 'string' && i.text.length > 0)) return false;
    }
    return true;
}
function isValidModuleStructure(modules) {
    for (const gKey in modules) {
        const group = modules[gKey];
        if (!group.modules) return false;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) return false;
            for (const sKey in mod.subcategories) {
                if (!Array.isArray(mod.subcategories[sKey].items)) return false;
            }
        }
    }
    return true;
}
function sanitizeData() {
    for (const key in state.lists) {
        const list = state.lists[key];
        if (!Array.isArray(list.items)) { list.items = []; continue; }
        list.items = list.items.map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
        if (list.enabled === undefined) list.enabled = true;
        if (list.expanded === undefined) list.expanded = true;
    }
    if (state.modifiers) {
        state.modifiers.items = (state.modifiers.items || []).map(i => {
            if (typeof i === 'string') return { text: i, enabled: true, image: null };
            if (i && typeof i === 'object' && typeof i.text === 'string') {
                if (i.image === undefined) i.image = null;
                return i;
            }
            return null;
        }).filter(i => i && i.text.trim().length > 0);
        if (state.modifiers.enabled === undefined) state.modifiers.enabled = true;
        if (state.modifiers.expanded === undefined) state.modifiers.expanded = true;
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        if (!group.modules) group.modules = {};
        if (group.expanded === undefined) group.expanded = true;
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.subcategories) mod.subcategories = {};
            if (mod.enabled === undefined) mod.enabled = true;
            if (mod.expanded === undefined) mod.expanded = false;
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!Array.isArray(sub.items)) { sub.items = []; continue; }
                sub.items = sub.items.map(i => {
                    if (typeof i === 'string') return { text: i, enabled: true, image: null };
                    if (i && typeof i === 'object' && typeof i.text === 'string') {
                        if (i.image === undefined) i.image = null;
                        return i;
                    }
                    return null;
                }).filter(i => i && i.text.trim().length > 0);
                if (sub.enabled === undefined) sub.enabled = true;
                if (sub.expanded === undefined) sub.expanded = false;
            }
        }
    }
}
function save() {
    try {
        localStorage.setItem('cg_lists_v3', JSON.stringify(state.lists));
        localStorage.setItem('cg_modifiers_v2', JSON.stringify(state.modifiers));
        localStorage.setItem('cg_modules_v3', JSON.stringify(state.modules));

        if (e.name === 'QuotaExceededError') {
            showToast('⚠️ Память переполнена! Удали лишние картинки.');
        }
    }
}

function pickImage(context) {

    document.getElementById('imageFileInput').click();
}

document.getElementById('imageFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !imageContext) return;

    try {
        const dataUrl = await compressImage(file, 512, 512, 0.7);
        applyImageToContext(dataUrl);
    } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
    }
    e.target.value = '';
    imageContext = null;
});

function compressImage(file, maxW, maxH, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxW) { height = height * maxW / width; width = maxW; }
                if (height > maxH) { width = width * maxH / height; height = maxH; }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                // Белый фон (для прозрачных PNG)
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                resolve(dataUrl);
            };
            img.onerror = reject;
            img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function applyImageToContext(dataUrl) {
    const ctx = imageContext;
    if (!ctx) return;

    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;

    if (items && items[ctx.index]) {
        items[ctx.index].image = dataUrl;
        save();
        // Перерисовать
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение привязано');
    }
}

function removeImage(context) {
    const ctx = context;
    let items;
    if (ctx.type === 'list') items = state.lists[ctx.key].items;
    else if (ctx.type === 'modifier') items = state.modifiers.items;
    else if (ctx.type === 'subcat') items = state.modules[ctx.gKey].modules[ctx.mKey].subcategories[ctx.sKey].items;

    if (items && items[ctx.index]) {
        items[ctx.index].image = null;
        save();
        if (ctx.type === 'list') renderListItems(ctx.key);
        else if (ctx.type === 'modifier') renderModifierItems();
        else if (ctx.type === 'subcat') renderSubcatItems(ctx.gKey, ctx.mKey, ctx.sKey);
        showToast('Изображение удалено');
    }
}

// ============================================================
// ГЕНЕРАЦИЯ
// ============================================================
function randItem(items) {
    const active = items.filter(i => i.enabled && i.text && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}
function randItemExcluding(items, excludeList) {
    const excludeLower = excludeList.map(s => s.toLowerCase());
    const active = items.filter(i => i.enabled && i.text && !excludeLower.includes(i.text.toLowerCase()) && i.text !== "Отсутствует" && i.text !== "None");
    if (active.length === 0) return null;
    return active[Math.floor(Math.random() * active.length)];
}

function generate() {
    const result = {};       // { path: text }
    const resultItems = {};  // { path: [itemObj, ...] }
    const paths = [];
    const extraTexts = [];

    // Списки
    if (state.lists.races.enabled) {
        const item = randItem(state.lists.races.items);
        if (item) { result['list.races'] = item.text; resultItems['list.races'] = [item]; paths.push('list.races'); }
    }
    if (state.lists.styles.enabled) {
        const item = randItem(state.lists.styles.items);
        if (item) { result['list.styles'] = item.text; resultItems['list.styles'] = [item]; paths.push('list.styles'); }
    }

    // Модули
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!mod.enabled) continue;
            const slotItems = [];
            for (const sKey in mod.subcategories) {
                const sub = mod.subcategories[sKey];
                if (!sub.enabled) continue;
                const item = randItem(sub.items);
                if (item) slotItems.push(item);
            }
            if (slotItems.length > 0) {
                const path = `${gKey}.${mKey}`;
                result[path] = slotItems.map(i => i.text).join(', ');
                resultItems[path] = slotItems;
                paths.push(path);
            }
        }
    }

    // Модификаторы
    if (state.modifiers && state.modifiers.enabled) {
        const modItem = randItem(state.modifiers.items);
        if (modItem) {
            const clothesSlots = ['clothes.headwear', 'clothes.neckwear', 'clothes.topwear1', 'clothes.bottomwear', 'clothes.legwear', 'clothes.footwear'];
            const available = clothesSlots.filter(s => result[s]);
            if (available.length > 0) {
                const target = available[Math.floor(Math.random() * available.length)];
                result[target] = `${modItem.text} ${result[target]}`;
                if (resultItems[target]) resultItems[target].unshift(modItem);
            }
        }
    }

    // Правила (замены)
    const activeRules = state.rules.filter(r => r.enabled);
    activeRules.filter(r => r.type === 'replace').forEach(rule => {
        if (checkConditions(rule, result)) {
            const actPath = rule.action.path;
            const actVal = rule.action.value;
            if (actPath) {
                result[actPath] = actVal;
                if (!paths.includes(actPath)) paths.push(actPath);
                // Для картинок — ищем соответствующий item
                const items = getItemsByPath(actPath);
                const found = items.find(i => i.text === actVal);
                resultItems[actPath] = found ? [found] : [];
            }
        }
    });

    // Цепочки
    let chainChanged = true, chainIter = 0;
    while (chainChanged && chainIter < 3) {
        chainChanged = false; chainIter++;
        activeRules.filter(r => r.type === 'replace' && r.chain).forEach(rule => {
            if (checkConditions(rule, result)) {
                const actPath = rule.action.path;
                const actVal = rule.action.value;
                if (actPath && result[actPath] !== actVal) {
                    result[actPath] = actVal;
                    if (!paths.includes(actPath)) paths.push(actPath);
                    const items = getItemsByPath(actPath);
                    const found = items.find(i => i.text === actVal);
                    resultItems[actPath] = found ? [found] : [];
                    chainChanged = true;
                }
            }
        });
    }

    // Исключения
    activeRules.filter(r => r.type === 'exclude').forEach(rule => {
        if (checkConditions(rule, result)) {
            const exclPath = rule.action.path;
            const exclValues = rule.action.values || [];
            if (!exclPath) return;
            if (exclPath.startsWith('list.')) {
                const listKey = exclPath.split('.')[1];
                const item = randItemExcluding(state.lists[listKey].items, exclValues);
                if (item) { result[exclPath] = item.text; resultItems[exclPath] = [item]; }
            } else {
                const [gKey, mKey] = exclPath.split('.');
                const mod = state.modules[gKey] && state.modules[gKey].modules[mKey];
                if (!mod || !mod.enabled) return;
                const slotItems = [];
                for (const sKey in mod.subcategories) {
                    const sub = mod.subcategories[sKey];
                    if (!sub.enabled) continue;
                    const item = randItemExcluding(sub.items, exclValues);
                    if (item) slotItems.push(item);
                }
                if (slotItems.length > 0) {
                    result[exclPath] = slotItems.map(i => i.text).join(', ');
                    resultItems[exclPath] = slotItems;
                }
            }
        }
    });

    // Добавление текста
    activeRules.filter(r => r.type === 'add').forEach(rule => {
        if (checkConditions(rule, result)) {
            if (rule.action.text) extraTexts.push(rule.action.text);
        }
    });

    if (paths.length === 0) { showToast("Все списки и модули отключены!"); return; }

    state.current = result;
    state.currentPaths = paths;
    state.currentItems = resultItems;
    state.extraText = extraTexts.join(', ');
    state.genCount++;
    save();
    updateCounter();
    renderResult(result, paths, extraTexts, resultItems);
    addHistory(result, paths, extraTexts, resultItems);
}

function checkConditions(rule, result) {
    if (!rule.conditions || rule.conditions.length === 0) return false;
    for (const cond of rule.conditions) {
        if (!matchesCondition(result, cond.path, cond.value, cond.negate)) return false;
    }
    return true;
}
function matchesCondition(result, condPath, condVal, negate) {
    if (!condPath) return false;
    const currentVal = result[condPath];
    const isEmpty = !currentVal;
    const currentParts = currentVal ? currentVal.split(',').map(s => s.trim().toLowerCase()) : [];
    const match = !isEmpty && currentParts.includes((condVal || '').toLowerCase());
    if (negate) return isEmpty || !match;
    return match;
}

function getPathName(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].name;
    const [g, m] = path.split('.');
    return state.modules[g].modules[m].name;
}
function getItemsByPath(path) {
    if (path.startsWith('list.')) return state.lists[path.split('.')[1]].items;
    const [g, m] = path.split('.');
    if (!state.modules[g] || !state.modules[g].modules[m]) return [];
    const all = [];
    for (const sKey in state.modules[g].modules[m].subcategories) {
        all.push(...state.modules[g].modules[m].subcategories[sKey].items);
    }
    return all;
}

function renderResult(result, paths, extraTexts, resultItems) {
    const box = document.getElementById('resultBox');
    box.innerHTML = '';
    paths.forEach(path => {
        const name = getPathName(path);
        const isMain = path === 'list.races' || path === 'list.styles';
        const isSlot = !path.startsWith('list.');

        const line = document.createElement('div');
        line.className = `result-line ${isMain ? 'main' : ''} ${isSlot ? 'slot' : ''}`;
        line.innerHTML = `<span class="result-cat">${name}</span>`;

        const valueBlock = document.createElement('div');
        valueBlock.className = 'result-value-block';

        // Соберём картинки из items, у которых есть image
        const items = resultItems[path] || [];
        const withImages = items.filter(i => i && i.image);

        const valueText = document.createElement('span');
        valueText.className = 'result-val';
        valueText.textContent = result[path];
        valueBlock.appendChild(valueText);

        if (withImages.length > 0) {
            const thumbs = document.createElement('div');
            thumbs.className = 'result-thumbs';
            withImages.forEach(item => {
                const img = document.createElement('img');
                img.className = 'result-thumb';
                img.src = item.image;
                img.title = item.text;
                img.onclick = () => openImageViewer(item.image);
                thumbs.appendChild(img);
            });
            valueBlock.appendChild(thumbs);
        }

        line.appendChild(valueBlock);
        box.appendChild(line);
    });
    if (extraTexts && extraTexts.length > 0) {
        const line = document.createElement('div');
        line.className = 'result-line extra';
        line.innerHTML = `<span class="result-cat">🔗 Дополнительно</span><span class="result-val">${extraTexts.join(', ')}</span>`;
        box.appendChild(line);
    }
}

function addHistory(result, paths, extraTexts, resultItems) {
    // Сохраняем только ID-подобные данные + картинки для превью
    const itemsForHistory = {};
    for (const path in resultItems) {
        itemsForHistory[path] = resultItems[path].map(i => ({ text: i.text, image: i.image || null }));
    }
    state.history.unshift({
        id: Date.now(),
        result: JSON.parse(JSON.stringify(result)),
        paths: [...paths],
        extraTexts: extraTexts || [],
        items: itemsForHistory,
        date: new Date().toLocaleString('ru-RU'),
        favorite: false
    });
    if (state.history.length > 200) state.history.pop();
    save();
}

function formatPrompt(result, paths, extraTexts) {
    let out = paths.map(p => `${getPathName(p)}: ${result[p]}`).join('\n');
    if (extraTexts && extraTexts.length > 0) out += `\nДополнительно: ${extraTexts.join(', ')}`;
    return out;
}
function formatShort(result, paths, extraTexts) {
    let out = paths.map(p => result[p]).join(', ');
    if (extraTexts && extraTexts.length > 0) out += `, ${extraTexts.join(', ')}`;
    return out;
}
function copyResult() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatPrompt(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));
    showToast('Скопировано!');
}
function copyShort() {
    if (!state.currentPaths.length) { showToast('Сначала сгенерируйте!'); return; }
    navigator.clipboard.writeText(formatShort(state.current, state.currentPaths, state.extraText ? [state.extraText] : []));

const PRESETS = {
    all: null,
    portrait: ['list.races', 'list.styles', 'appearance.bangs', 'appearance.sidelocks', 'appearance.backHair', 'appearance.addHair', 'appearance.eyeShape', 'appearance.skinColor', 'race.trait1', 'race.trait2', 'race.trait3', 'clothes.acc1'],
    full: ['list.races', 'list.styles', 'appearance.bangs', 'appearance.sidelocks', 'appearance.backHair', 'appearance.addHair', 'appearance.eyeShape', 'appearance.skinColor', 'clothes.headwear', 'clothes.neckwear', 'clothes.handwear', 'clothes.topwear1', 'clothes.bottomwear', 'clothes.legwear', 'clothes.footwear', 'clothes.acc1', 'clothes.acc2', 'clothes.acc3', 'clothes.acc4', 'clothes.acc5', 'race.trait1', 'race.trait2', 'race.trait3'],
    race: ['list.races', 'race.trait1', 'race.trait2', 'race.trait3', 'race.trait4', 'race.trait5', 'race.trait6', 'race.trait7']
};
function applyPreset(name) {
    const preset = PRESETS[name];
    for (const key in state.lists) {
        if (preset === null) state.lists[key].enabled = true;
        else state.lists[key].enabled = preset.includes(`list.${key}`);
    }
    if (state.modifiers) {
        if (preset === null) state.modifiers.enabled = true;
        else state.modifiers.enabled = false;
    }
    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (preset === null) mod.enabled = true;
            else mod.enabled = preset.includes(`${gKey}.${mKey}`);
        }
    }
    if (name === 'full' && state.modifiers) state.modifiers.enabled = true;
    save(); renderLists(); renderModules();
    showToast(`Пресет "${name}"`);
}

function renderModules() {
    const container = document.getElementById('modulesContainer');
    container.innerHTML = '';
    const q = (document.getElementById('moduleSearch').value || '').toLowerCase();

    for (const gKey in state.modules) {
        const group = state.modules[gKey];
        const visibleModules = {};
        for (const mKey in group.modules) {
            const mod = group.modules[mKey];
            if (!q) { visibleModules[mKey] = mod; continue; }
            const modMatch = mod.name.toLowerCase().includes(q);
            let subMatch = false;
            for (const sKey in mod.subcategories) {
                if (mod.subcategories[sKey].name.toLowerCase().includes(q)) { subMatch = true; break; }
                for (const item of mod.subcategories[sKey].items) {
                    if (item.text.toLowerCase().includes(q)) { subMatch = true; break; }
                }
                if (subMatch) break;
            }
            if (modMatch || subMatch) visibleModules[mKey] = mod;
        }
        if (Object.keys(visibleModules).length === 0 && q) continue;

        const title = document.createElement('div');
        title.className = `group-title ${group.groupClass}`;
        title.innerHTML = `<span>${group.name}</span><span>${group.expanded ? '▼' : '▶'}</span>`;
        title.onclick = () => { group.expanded = !group.expanded; save(); renderModules(); };
        container.appendChild(title);

        const body = document.createElement('div');
        body.className = `group-body ${group.expanded ? '' : 'collapsed'}`;
        for (const mKey in visibleModules) body.appendChild(createModule(gKey, mKey, visibleModules[mKey]));
        container.appendChild(body);
    }

    // Модификаторы
    if (state.modifiers && (!q || state.modifiers.name.toLowerCase().includes(q) || state.modifiers.items.some(i => i.text.toLowerCase().includes(q)))) {
        const title = document.createElement('div');

        const body = document.createElement('div');

                <span class="module-counter">Подкатегорий: ${activeSubs}/${totalSubs} · Значений: ${totalActive}/${totalItems}</span>
            </div>
            <div class="module-controls">
                <label style="font-size:0.75rem; cursor:pointer;">
                    <input type="checkbox" ${mod.enabled ? 'checked' : ''} onchange="toggleModule('${gKey}','${mKey}')" style="accent-color: var(--accent);"> Вкл
                </label>
                <button class="module-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'module-body';
    for (const sKey in mod.subcategories) body.appendChild(createSubcat(gKey, mKey, sKey, mod.subcategories[sKey]));
    div.querySelector('.module-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
        mod.expanded = !mod.expanded; save(); renderModules();
    };
    div.querySelector('.module-toggle').onclick = (e) => { e.stopPropagation(); mod.expanded = !mod.expanded; save(); renderModules(); };
    div.appendChild(body);
    return div;
}
function createSubcat(gKey, mKey, sKey, sub) {
    const div = document.createElement('div');
    div.className = `subcat ${sub.enabled ? '' : 'disabled'} ${sub.expanded ? 'open' : ''}`;
    const active = sub.items.filter(i => i.enabled).length;
    const withImages = sub.items.filter(i => i.image).length;
    div.innerHTML = `
        <div class="subcat-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" ${sub.enabled ? 'checked' : ''} style="accent-color: var(--accent); cursor:pointer;" onclick="event.stopPropagation(); toggleSubcat('${gKey}','${mKey}','${sKey}')">
                <span class="subcat-name">${sub.name}</span>
                <span class="subcat-counter">(${active}/${sub.items.length}${withImages ? ` · 🖼️${withImages}` : ''})</span>
            </div>
            <div class="subcat-controls">
                <button class="icon-btn" onclick="event.stopPropagation(); openEditSubcat('${gKey}','${mKey}','${sKey}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); openBulkImport('subcat','${gKey}','${mKey}','${sKey}')">📥</button>
                <button class="subcat-toggle">▼</button>
            </div>
        </div>
    `;
    const body = document.createElement('div');
    body.className = 'subcat-body';
    body.innerHTML = `
        <div class="add-row">
            <input type="text" placeholder="Добавить..." onkeydown="if(event.key==='Enter') addSubcatItem('${gKey}','${mKey}','${sKey}', this)">
            <button onclick="addSubcatItem('${gKey}','${mKey}','${sKey}', this.previousElementSibling)">+</button>
        </div>
        <div class="item-list" id="sub-values-${gKey}-${mKey}-${sKey}"></div>
    `;
    div.querySelector('.subcat-header').onclick = (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        sub.expanded = !sub.expanded; save(); renderModules();
    };
    div.querySelector('.subcat-toggle').onclick = (e) => { e.stopPropagation(); sub.expanded = !sub.expanded; save(); renderModules(); };
    div.appendChild(body);
    setTimeout(() => renderSubcatItems(gKey, mKey, sKey), 0);
    return div;
}
function renderSubcatItems(gKey, mKey, sKey) {
    const container = document.getElementById(`sub-values-${gKey}-${mKey}-${sKey}`);
    if (!container) return;
    container.innerHTML = '';
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    sub.items.forEach((item, idx) => {
        if (!item || !item.text) return;
        const row = document.createElement('div');
        row.className = `item ${item.enabled ? '' : 'disabled'}`;
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = item.enabled;
        cb.onchange = () => { item.enabled = !item.enabled; save(); renderSubcatItems(gKey, mKey, sKey); };

        const thumbWrap = document.createElement('div');
        if (item.image) {
            const img = document.createElement('img');
            img.className = 'item-thumb'; img.src = item.image;
            img.onclick = () => openImageViewer(item.image);
            img.oncontextmenu = (e) => { e.preventDefault(); removeImage({ type: 'subcat', gKey, mKey, sKey, index: idx }); };
            thumbWrap.appendChild(img);
        } else {
            const ph = document.createElement('div');
            ph.className = 'item-thumb-placeholder'; ph.textContent = '🖼️';
            ph.onclick = () => pickImage({ type: 'subcat', gKey, mKey, sKey, index: idx });
            thumbWrap.appendChild(ph);
        }

        const txt = document.createElement('span');
        txt.className = 'item-text'; txt.textContent = item.text;
        txt.onclick = () => startEditSubcatItem(gKey, mKey, sKey, idx, txt);
        const del = document.createElement('button');
        del.className = 'icon-btn'; del.textContent = '❌';
        del.onclick = () => { sub.items.splice(idx, 1); save(); renderSubcatItems(gKey, mKey, sKey); };
        row.appendChild(cb); row.appendChild(thumbWrap); row.appendChild(txt); row.appendChild(del);
        container.appendChild(row);
    });
    const header = container.closest('.subcat').querySelector('.subcat-counter');
    const active = sub.items.filter(i => i.enabled).length;
    const withImages = sub.items.filter(i => i.image).length;
    header.textContent = `(${active}/${sub.items.length}${withImages ? ` · 🖼️${withImages}` : ''})`;
}
function toggleModule(gKey, mKey) { state.modules[gKey].modules[mKey].enabled = !state.modules[gKey].modules[mKey].enabled; save(); renderModules(); }
function toggleSubcat(gKey, mKey, sKey) { state.modules[gKey].modules[mKey].subcategories[sKey].enabled = !state.modules[gKey].modules[mKey].subcategories[sKey].enabled; save(); renderModules(); }
function startEditSubcatItem(gKey, mKey, sKey, idx, span) {
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    const old = sub.items[idx].text;
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = old;
    span.replaceWith(inp); inp.focus();
    const finish = () => { const v = inp.value.trim(); if (v && v !== old) { sub.items[idx].text = v; save(); } renderSubcatItems(gKey, mKey, sKey); };
    inp.onblur = finish;
    inp.onkeydown = (e) => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') renderSubcatItems(gKey, mKey, sKey); };
}
function addSubcatItem(gKey, mKey, sKey, inputEl) {
    const v = inputEl.value.trim(); if (!v) return;
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    if (sub.items.some(i => i.text.toLowerCase() === v.toLowerCase())) { showToast('Уже есть!'); return; }
    sub.items.push({ text: v, enabled: true, image: null });
    inputEl.value = '';
    save(); renderSubcatItems(gKey, mKey, sKey);
}
function sortModules() {
    for (const g in state.modules) {
        for (const m in state.modules[g].modules) {
            for (const s in state.modules[g].modules[m].subcategories) {
                state.modules[g].modules[m].subcategories[s].items.sort((a, b) => a.text.localeCompare(b.text));
            }
        }
    }
    if (state.modifiers) state.modifiers.items.sort((a, b) => a.text.localeCompare(b.text));
    save(); renderModules(); showToast('Отсортировано');
}
function openEditSubcat(gKey, mKey, sKey) {
    editContext = { type: 'subcat', gKey, mKey, sKey };
    const sub = state.modules[gKey].modules[mKey].subcategories[sKey];
    document.getElementById('editTitle').textContent = `Редактирование: ${sub.name}`;
    document.getElementById('editTextarea').value = sub.items.map(i => i.text).join('\n');
    document.getElementById('editModal').classList.add('active');
}

// ============================================================
// ПРАВИЛА
// ============================================================
function populateRuleSelects() {
    const paths = getAllPaths();
    const selects = ['newRuleActModule', 'newRuleExclModule'];
    selects.forEach(selId => {
        const sel = document.getElementById(selId);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '';
        paths.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.path; opt.textContent = p.name;
            sel.appendChild(opt);
        });
        if (currentVal) sel.value = currentVal;
    });
    onRuleActModuleChange();
    if (document.getElementById('conditionsContainer').children.length === 0) addCondition();
}
function createConditionRow(cond) {
    const div = document.createElement('div');
    div.className = 'rule-row';
    const paths = getAllPaths();

    const moduleSelect = document.createElement('select');
    moduleSelect.className = 'cond-module';
    paths.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.path; opt.textContent = p.name;
        if (cond && cond.path === p.path) opt.selected = true;
        moduleSelect.appendChild(opt);
    });

    const arrow = document.createElement('span');
    arrow.className = 'arrow'; arrow.textContent = '=';

    const valueSelect = document.createElement('select');
    valueSelect.className = 'cond-value';
    const fillValues = () => {
        valueSelect.innerHTML = '';
        const items = getItemsByPath(moduleSelect.value);
        items.filter(i => i.enabled).forEach(i => {
            const opt = document.createElement('option');
            opt.value = i.text; opt.textContent = i.text;
            if (cond && cond.value === i.text) opt.selected = true;
            valueSelect.appendChild(opt);
        });
    };
    fillValues();
    moduleSelect.onchange = fillValues;

    const negateLabel = document.createElement('label');
    negateLabel.style.fontSize = '0.75rem';
    negateLabel.style.display = 'flex';
    negateLabel.style.alignItems = 'center';
    negateLabel.style.gap = '4px';
    negateLabel.style.cursor = 'pointer';
    const negateCb = document.createElement('input');
    negateCb.type = 'checkbox';
    negateCb.className = 'cond-negate';
    if (cond && cond.negate) negateCb.checked = true;
    negateLabel.appendChild(negateCb);
    negateLabel.appendChild(document.createTextNode('НЕ'));

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '❌';
    removeBtn.style.background = 'none';
    removeBtn.style.border = 'none';
    removeBtn.style.color = 'var(--accent)';
    removeBtn.style.cursor = 'pointer';
    removeBtn.style.fontSize = '1rem';
    removeBtn.onclick = () => div.remove();

    div.appendChild(moduleSelect); div.appendChild(arrow); div.appendChild(valueSelect);
    div.appendChild(negateLabel); div.appendChild(removeBtn);
    return div;
}
function addCondition() {
    document.getElementById('conditionsContainer').appendChild(createConditionRow(null));
}
function onRuleTypeChange() {
    const t = document.getElementById('newRuleType').value;
    document.getElementById('actionReplaceRow').style.display = t === 'replace' ? 'flex' : 'none';
    document.getElementById('actionExcludeRow').style.display = t === 'exclude' ? 'flex' : 'none';
    document.getElementById('actionAddRow').style.display = t === 'add' ? 'flex' : 'none';
}
function onRuleActModuleChange() {
    const sel = document.getElementById('newRuleActModule');
    const valSel = document.getElementById('newRuleActValue');
    if (!sel || !valSel) return;
    const items = getItemsByPath(sel.value);
    valSel.innerHTML = '';
    items.filter(i => i.enabled).forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.text; opt.textContent = i.text;
        valSel.appendChild(opt);
    });
}
function addRule() {
    const type = document.getElementById('newRuleType').value;
    const conditions = [];
    const condRows = document.querySelectorAll('#conditionsContainer .rule-row');
    condRows.forEach(row => {
        const path = row.querySelector('.cond-module').value;
        const value = row.querySelector('.cond-value').value;
        const negate = row.querySelector('.cond-negate').checked;
        if (path && value) conditions.push({ path, value, negate });
    });
    if (conditions.length === 0) { showToast('Добавьте условие!'); return; }
    const rule = { id: Date.now(), type, conditions, action: {}, enabled: true, chain: document.getElementById('newRuleChain').checked };

    if (type === 'replace') {
        const actPath = document.getElementById('newRuleActModule').value;
        const actValue = document.getElementById('newRuleActValue').value;
        if (!actPath || !actValue) { showToast('Заполните действие!'); return; }
        rule.action = { path: actPath, value: actValue };
    } else if (type === 'exclude') {
        const actPath = document.getElementById('newRuleExclModule').value;
        const actValues = document.getElementById('newRuleExclValue').value.split(',').map(s => s.trim()).filter(s => s);
        if (!actPath || actValues.length === 0) { showToast('Заполните!'); return; }
        rule.action = { path: actPath, values: actValues };
    } else if (type === 'add') {
        const text = document.getElementById('newRuleAddText').value.trim();
        if (!text) { showToast('Введите текст!'); return; }
        rule.action = { text: text };
    }

    state.rules.push(rule);
    save(); renderRules();
    showToast('Правило добавлено');
    document.getElementById('newRuleExclValue').value = '';
    document.getElementById('newRuleAddText').value = '';
    document.getElementById('conditionsContainer').innerHTML = '';
    document.getElementById('newRuleChain').checked = false;
    addCondition();
}
function renderRules() {
    const container = document.getElementById('rulesContainer');
    if (!container) return;
    container.innerHTML = '';
    if (state.rules.length === 0) {
        container.innerHTML = '<div class="empty-state">Пока нет правил.</div>';
        return;
    }
    state.rules.forEach(rule => {
        const div = document.createElement('div');
        div.className = `rule-card ${rule.enabled ? '' : 'disabled'}`;
        const typeLabel = rule.type === 'replace' ? '🔵 Замена' : rule.type === 'exclude' ? '🔴 Исключение' : '🟡 Добавить';
        const typeClass = rule.type === 'replace' ? 'rule-type-replace' : rule.type === 'exclude' ? 'rule-type-exclude' : 'rule-type-add';
        let condText = rule.conditions.map(c => {
            const name = getPathName(c.path) || c.path;
            return `${name} ${c.negate ? '≠' : '='} <b style="color:var(--rules);">${c.value}</b>`;
        }).join(' <b>И</b> ');
        let actionText = '';
        if (rule.type === 'replace') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `<b>${actName}</b> = <b style="color:var(--clothes);">${rule.action.value}</b>`;
        } else if (rule.type === 'exclude') {
            const actName = getPathName(rule.action.path) || rule.action.path;
            actionText = `убрать из <b>${actName}</b>: <b style="color:var(--accent);">${rule.action.values.join(', ')}</b>`;
        } else if (rule.type === 'add') {
            actionText = `добавить текст: <b style="color:var(--race);">${rule.action.text}</b>`;
        }
        const chainBadge = rule.chain ? '<span class="chain-badge">🔗 ЦЕПОЧКА</span>' : '';
        div.innerHTML = `
            <div class="rule-header">
                <span class="rule-type ${typeClass}">${typeLabel}${chainBadge}</span>
                <div style="display:flex; gap:8px; align-items:center;">
                    <label style="font-size:0.75rem; cursor:pointer;">
                        <input type="checkbox" ${rule.enabled ? 'checked' : ''} onchange="toggleRule(${rule.id})" style="accent-color: var(--rules);"> Вкл
                    </label>
                    <button class="icon-btn" onclick="deleteRule(${rule.id})">❌</button>
                </div>
            </div>
            <div class="rule-body">
                <b>Если</b> ${condText}<br>
                <b>Тогда</b> ${actionText}
            </div>
        `;
        container.appendChild(div);
    });
}
function toggleRule(id) { const r = state.rules.find(x => x.id === id); if (r) { r.enabled = !r.enabled; save(); renderRules(); } }
function deleteRule(id) { state.rules = state.rules.filter(x => x.id !== id); save(); renderRules(); }
function exportRules() {
    const data = JSON.stringify({ version: 2, rules: state.rules }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rules_${Date.now()}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Правила экспортированы');
}
function importRules(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.rules || !Array.isArray(data.rules)) throw new Error('Неверный формат');
            if (!confirm(`Загрузить ${data.rules.length} правил?`)) return;
            state.rules = data.rules;
            save(); renderRules();
            showToast(`Загружено: ${data.rules.length}`);
        } catch (err) { alert('Ошибка: ' + err.message); }
        event.target.value = '';
    };
    reader.readAsText(file);
}

// ============================================================
// МОДАЛЬНЫЕ ОКНА
// ============================================================
function closeEdit() { document.getElementById('editModal').classList.remove('active'); editContext = null; }
function saveEdit() {
    if (!editContext) return;
    const text = document.getElementById('editTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);

    let target;
    if (editContext.type === 'list') target = state.lists[editContext.key].items;
    else if (editContext.type === 'modifier') target = state.modifiers.items;
    else target = state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items;

    // Сохраняем старые картинки по тексту
    const oldMap = {};
    target.forEach(i => { if (i && i.text) oldMap[i.text.toLowerCase()] = { enabled: i.enabled, image: i.image || null }; });
    const newItems = lines.map(t => {
        const old = oldMap[t.toLowerCase()];
        return { text: t, enabled: old ? old.enabled : true, image: old ? old.image : null };
    });

    if (editContext.type === 'list') state.lists[editContext.key].items = newItems;
    else if (editContext.type === 'modifier') state.modifiers.items = newItems;
    else state.modules[editContext.gKey].modules[editContext.mKey].subcategories[editContext.sKey].items = newItems;

    save(); renderLists(); renderModules();
    closeEdit(); showToast(`Сохранено: ${lines.length}`);
}
function openBulkImport(type, key, mKey, sKey) {
    bulkContext = { type, key, mKey, sKey };
    let title = '';
    if (type === 'list') title = state.lists[key].name;
    else if (type === 'modifier') title = state.modifiers.name;
    else if (type === 'subcat') title = state.modules[key].modules[mKey].subcategories[sKey].name;
    document.getElementById('bulkImportTitle').textContent = `Импорт: ${title}`;
    document.getElementById('bulkImportTextarea').value = '';
    document.getElementById('bulkImportModal').classList.add('active');
}
function closeBulkImport() { document.getElementById('bulkImportModal').classList.remove('active'); bulkContext = null; }
function confirmBulkImport() {
    if (!bulkContext) return;
    const text = document.getElementById('bulkImportTextarea').value;
    const lines = text.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
    let target;
    if (bulkContext.type === 'list') target = state.lists[bulkContext.key].items;
    else if (bulkContext.type === 'modifier') target = state.modifiers.items;
    else target = state.modules[bulkContext.key].modules[bulkContext.mKey].subcategories[bulkContext.sKey].items;
    let added = 0, skipped = 0;
    lines.forEach(line => {
        if (target.some(i => i.text.toLowerCase() === line.toLowerCase())) skipped++;
        else { target.push({ text: line, enabled: true, image: null }); added++; }
    });
    save(); renderLists(); renderModules();
    closeBulkImport();
    showToast(`Добавлено: ${added}${skipped ? `, пропущено: ${skipped}` : ''}`);
}
function resetAll() {
    if (!confirm('Сбросить списки и модули? Правила и картинки сохранятся.')) return;
    state.lists = JSON.parse(JSON.stringify(DEFAULT_LISTS));
    state.modifiers = JSON.parse(JSON.stringify(DEFAULT_MODIFIERS));
    state.modules = JSON.parse(JSON.stringify(DEFAULT_MODULES));
    save(); renderLists(); renderModules();
    showToast('Сброшено');
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = init;
</script>
